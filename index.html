  --accent: #c85f83;

  --accent-deep: #983b5c;
  --gold: #b8860b;
  --gold-soft: #fff6db;
  --green: #237a57;
  --green-soft: #e6f6ee;
  --amber: #9c6516;
  --amber-soft: #fff2db;
  --red: #b9384f;

  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {

  --paper: #231b20;
  --ink: #f8eef2;
  --muted: #b09aa3;
  --line: #362a31;
  --accent-soft: #3d212d;
  --gold-soft: #362b14;

  --amber-soft: #382812;

}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {

  background: var(--bg); color: var(--ink);

button { cursor: pointer; border: 0; background: none; }
input, select, textarea {

}
.brand-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.shop-logo {

  color: #fff; font-weight: 800; font-size: 19px;

}
.shop-logo img { width: 100%; height: 100%; object-fit: cover; }
.brand-text h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-text p { margin: 0; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.sync-pill {

}
.sync-pill.syncing { background: var(--amber-soft); color: var(--amber); }
.sync-pill.offline { background: var(--red-soft); color: var(--red); }
.acct-chip {

  background: var(--paper); border: 1px solid var(--line);

}
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--gold));

  display: inline-flex; align-items: center; justify-content: center;

}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.lg { width: 54px; height: 54px; font-size: 21px; }
.avatar.xl { width: 68px; height: 68px; font-size: 26px; }

.container { padding: 14px 15px; display: flex; flex-direction: column; gap: 14px; }
.card {

  border-radius: var(--radius); padding: 15px;

}
.hero-card {

.hero-card p { margin: 0; opacity: 0.9; font-size: 13px; }
.kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kpi-box {

.kpi-label { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.kpi-val { font-size: 19px; font-weight: 800; margin-top: 3px; }
.kpi-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

.btn {

}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-gold { background: linear-gradient(135deg, #c7911b, #9b6c08); color: #fff; }
.btn-soft { background: var(--accent-soft); color: var(--accent-deep); }
[data-theme="dark"] .btn-soft { color: #ff9ebb; }
.btn-outline { background: var(--paper); border: 1.5px solid var(--line); color: var(--ink); }
.btn-danger { background: var(--red-soft); color: var(--red); }
.btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 9px; }

/* Blurred Product Tile Card */
.prod-tile {
  position: relative; overflow: hidden;
  border-radius: var(--radius); border: 1px solid var(--line);
  box-shadow: var(--shadow); background: var(--paper);
}
.prod-blur-bg {
  position: absolute; inset: -18px;
  background-size: cover; background-position: center;
  filter: blur(22px) saturate(1.3) brightness(0.92);
  transform: scale(1.12);
  z-index: 0; opacity: 0.42;
}
[data-theme="dark"] .prod-blur-bg { filter: blur(22px) saturate(1.3) brightness(0.55); opacity: 0.55; }
.prod-scrim {
  position: relative; z-index: 1;
  background: color-mix(in srgb, var(--paper) 74%, transparent);

}
.prod-row { display: flex; gap: 13px; align-items: flex-start; }
.prod-thumb {
  width: 84px; height: 102px; border-radius: 13px;
  background: var(--accent-soft); overflow: hidden; flex-shrink: 0;

}
.prod-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-count-badge {

}
.prod-info { flex: 1; min-width: 0; }
.prod-title { font-weight: 800; font-size: 15.5px; margin: 0 0 3px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.prod-meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.pill-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.pill {
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent-deep);
}
[data-theme="dark"] .pill { color: #ff9ebb; }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.red { background: var(--red-soft); color: var(--red); }
.prod-actions {

  gap: 8px; margin-top: 8px; padding-top: 8px;

  flex-wrap: wrap;
}

/* Bottom Navigation Bar */
.bottom-nav {

.bottom-nav-inner {

}
.nav-item {

}
.nav-item .ico { font-size: 17px; line-height: 1.1; position: relative; }
.nav-badge-dot {
  position: absolute; top: -2px; right: -5px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--red); border: 1.5px solid var(--paper);
}
.nav-item.active { color: var(--accent); background: var(--accent-soft); }

/* Modals */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(20, 12, 16, 0.58);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center;
}
.modal-sheet {
  width: 100%; max-width: 640px; max-height: 92dvh;
  background: var(--paper); border-radius: 24px 24px 0 0;
  padding: 18px 18px calc(22px + var(--safe-bottom));
  overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.22);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
}
.modal-head h3 { margin: 0; font-size: 17px; font-weight: 800; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Login Screen */
.auth-screen {
  min-height: 100dvh; display: flex; flex-direction: column;
  justify-content: center; padding: calc(24px + var(--safe-top)) 18px calc(24px + var(--safe-bottom));
  max-width: 480px; margin: 0 auto;
}
.acct-card {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-radius: 18px;
  background: var(--paper); border: 1.5px solid var(--line);
  margin-bottom: 11px; text-align: left; width: 100%;
  box-shadow: var(--shadow); transition: transform .12s, border-color .15s;
}
.acct-card:active { transform: scale(0.98); border-color: var(--accent); }
.pin-dots { display: flex; justify-content: center; gap: 12px; margin: 16px 0; }
.pin-dot {
  width: 15px; height: 15px; border-radius: 50%;
  border: 2px solid var(--accent); background: transparent;
}
.pin-dot.filled { background: var(--accent); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 290px; margin: 0 auto; }
.key-btn {
  height: 54px; border-radius: 15px; background: var(--bg);
  border: 1px solid var(--line); font-size: 20px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.key-btn:active { background: var(--accent-soft); }

/* Diagrams & Charts */
.chart-bar-row { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding: 12px 4px 4px; border-bottom: 1px solid var(--line); }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 4px; }

.legend-list { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 6px; }

.legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 7px; }

.toast {

.desktop-help-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.desktop-help-row .ig-help-btn {

@media (max-width: 440px) {

    grid-template-columns: 1fr;
  }
}
@media (min-width: 768px) {
  .desktop-help-row {
    display: grid !important;
    grid-template-columns: 1fr 1fr 1fr !important;
    gap: 10px !important;
  }
  .desktop-help-row .ig-help-btn {
    grid-column: auto !important;
  }
}

@media (min-width: 840px) {

    padding: 8px 14px;
    background: color-mix(in srgb, var(--paper) 95%, transparent);

  .bottom-nav-inner {
    max-width: 100%;
    gap: 6px;
  }
  .nav-item {
    padding: 8px 12px;
    font-size: 11px;
    border-radius: 14px;
  }
  .nav-item .ico { font-size: 20px; }

  /* Centered Dialog Modals on Desktop */
  .modal-backdrop {
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-sheet {
    border-radius: 24px;
    max-width: 780px;
    max-height: 88vh;
    box-shadow: 0 24px 70px rgba(0,0,0,0.52);
    border: 1.5px solid var(--line);
    padding: 24px 28px;
  }

  /* Quick Actions: 4 columns in one row */

  .desktop-prod-grid {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)) !important;
    gap: 16px !important;
  }

  /* Purchases & Sales: Responsive multi-column cards */
  .desktop-card-grid {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)) !important;
    gap: 16px !important;
  }

  /* Catalogue Floating Order Bar on Desktop */
  .cat-order-bar {
    max-width: 820px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    bottom: 18px !important;
    border-radius: 22px !important;
    border: 1.5px solid var(--line) !important;
    box-shadow: 0 16px 44px rgba(0,0,0,0.42) !important;
  }

  .desktop-help-row {
    display: grid !important;
    grid-template-columns: 1fr 1fr 1fr !important;
    gap: 10px !important;
  }
  .desktop-help-row .ig-help-btn {
    grid-column: auto !important;
  }
}
</style>

// ---- IndexedDB for Product, Invoice & Profile Images ----
function openImgDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("sisora_images_idb", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("imgs", { keyPath: "id" });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function loadAllImagesFromIdb() {
  try {
    const idb = await openImgDb();
    return new Promise((resolve) => {
      const tx = idb.transaction("imgs", "readonly");
      const req = tx.objectStore("imgs").getAll();
      req.onsuccess = () => {
        (req.result || []).forEach((row) => {
          if (row && row.id && row.data) imgMap.set(row.id, { at: row.at || 0, data: row.data });
        });
        resolve();
      };
      req.onerror = () => resolve();
    });
  } catch (e) {}
}

async function putLocalImage(id, data, at = Date.now(), fromRemote = false) {
  imgMap.set(id, { at, data });
  try {
    const idb = await openImgDb();
    const tx = idb.transaction("imgs", "readwrite");
    tx.objectStore("imgs").put({ id, at, data });
  } catch (e) {}
  if (!fromRemote) {
    outbox.add("img/" + id);
    saveOutbox();
    pushOutboxToFirebase();
  }
}

async function deleteLocalImage(id) {
  imgMap.delete(id);
  try {
    const idb = await openImgDb();
    const tx = idb.transaction("imgs", "readwrite");
    tx.objectStore("imgs").delete(id);
  } catch (e) {}
}

function compressImageFile(file, maxDim = 920, quality = 0.78) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        const ctx = cv.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---- Firebase REST Client (100% compatible with Android APK CloudSyncClient.kt) ----
async function ensureFirebaseAuth() {
  if (idToken) return idToken;
  const url = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(FIREBASE_CFG.apiKey)}`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email: FIREBASE_CFG.syncEmail,
      password: FIREBASE_CFG.syncPass,
      returnSecureToken: true
    })
  });
  if (!res.ok) throw new Error("Firebase Auth failed");
  const data = await res.json();
  idToken = data.idToken;
  refreshToken = data.refreshToken || "";
  return idToken;
}

async function fbGet(path) {
  const token = await ensureFirebaseAuth();
  const url = `${FIREBASE_CFG.databaseURL}/${path}.json?auth=${encodeURIComponent(token)}`;
  const res = await fetch(url);
  if (res.status === 401) {
    idToken = "";
    const retryToken = await ensureFirebaseAuth();
    const res2 = await fetch(`${FIREBASE_CFG.databaseURL}/${path}.json?auth=${encodeURIComponent(retryToken)}`);
    return res2.ok ? res2.json() : null;
  }
  return res.ok ? res.json() : null;
}

async function fbPut(path, payload) {
  const token = await ensureFirebaseAuth();
  const url = `${FIREBASE_CFG.databaseURL}/${path}.json?auth=${encodeURIComponent(token)}`;
  const res = await fetch(url, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  return res.ok ? res.json() : null;
}

const COLLECTIONS = ["products", "sales", "purchases", "expenses", "customers", "settlements"];

async function pullFromFirebase() {
  try {
    syncStatus = "syncing";
    updateSyncPill();
    const shopId = FIREBASE_CFG.shopId;
    const [prodObj, salesObj, purObj, expObj, custObj, setObj, settingsObj] = await Promise.all([
      fbGet(`shops/${shopId}/data/products`),
      fbGet(`shops/${shopId}/data/sales`),
      fbGet(`shops/${shopId}/data/purchases`),
      fbGet(`shops/${shopId}/data/expenses`),
      fbGet(`shops/${shopId}/data/customers`),
      fbGet(`shops/${shopId}/data/settlements`),
      fbGet(`shops/${shopId}/data/settings`)
    ]);

    const colMap = { products: prodObj, sales: salesObj, purchases: purObj, expenses: expObj, customers: custObj, settlements: setObj };
    let changed = false;

    for (const col of COLLECTIONS) {
      if (!Array.isArray(db[col])) db[col] = [];
      const remoteCol = colMap[col];
      if (!remoteCol || typeof remoteCol !== "object") continue;
      for (const [id, wrapper] of Object.entries(remoteCol)) {
        if (!wrapper) continue;
        const ru = Number(wrapper._u) || 0;
        const idx = db[col].findIndex((x) => x.id === id);
        const localItem = idx >= 0 ? db[col][idx] : null;
        const tomb = db.tombs.find((t) => t.c === col && t.id === id);
        const lu = localItem ? (Number(localItem._u) || 0) : (tomb ? (Number(tomb._u) || 0) : -1);

        if (ru > lu) {
          db.tombs = db.tombs.filter((t) => !(t.c === col && t.id === id));
          if (wrapper.deleted) {
            if (idx >= 0) db[col].splice(idx, 1);
            db.tombs.push({ c: col, id, _u: ru });
          } else if (wrapper.j) {
            try {
              const parsed = typeof wrapper.j === "string" ? JSON.parse(wrapper.j) : wrapper.j;
              parsed._u = ru;
              if (idx >= 0) db[col][idx] = parsed;
              else db[col].unshift(parsed);
            } catch (e) {}
          }
          outbox.delete(`${col}/${id}`);
          changed = true;
        }
      }
    }

    if (settingsObj && settingsObj.j) {
      const ru = Number(settingsObj._u) || 0;
      const lu = Number(db.settings._u) || 0;
      if (ru > lu) {
        try {
          const remoteSettings = typeof settingsObj.j === "string" ? JSON.parse(settingsObj.j) : settingsObj.j;
          db.settings = {
            ...db.settings,
            ...remoteSettings,
            sisters: FIXED_SISTERS,
            pins: { ...DEFAULT_SETTINGS.pins, ...(db.settings.pins || {}), ...(remoteSettings.pins || {}) },
            profilePhotosAt: { ...(db.settings.profilePhotosAt || {}), ...(remoteSettings.profilePhotosAt || {}) },
            _u: ru
          };
          outbox.delete("settings");
          changed = true;
        } catch (e) {}
      }
    }

    if (changed) {
      saveLocalDb();
      saveOutbox();
      renderApp();
    }

    // Fetch any missing product, invoice, or profile images
    const neededImgs = new Set();
    for (const p of db.products) {
      const ids = Array.isArray(p.photoIds) && p.photoIds.length ? p.photoIds : (p.imgAt ? [p.id] : []);
      for (const pid of ids) {
        const localIm = imgMap.get(pid);
        if (!localIm || (p.imgAt && localIm.at < p.imgAt)) neededImgs.add(pid);
      }
    }
    for (const pu of (db.purchases || [])) {
      const ids = Array.isArray(pu.invoicePhotoIds) ? pu.invoicePhotoIds : [];
      for (const pid of ids) {
        const localIm = imgMap.get(pid);
        if (!localIm || (pu.invoiceAt && localIm.at < pu.invoiceAt)) neededImgs.add(pid);
      }
      const pIds = Array.isArray(pu.photoIds) ? pu.photoIds : [];
      for (const pid of pIds) {
        if (!imgMap.get(pid)) neededImgs.add(pid);
      }
    }
    for (const s of (db.sales || [])) {
      if (s.paymentScreenshotId && !imgMap.get(s.paymentScreenshotId)) {
        neededImgs.add(s.paymentScreenshotId);
      }
    }
    const profAt = db.settings.profilePhotosAt || {};
    for (const acc of FIXED_ACCOUNTS) {
      const ts = Number(profAt[acc.id]) || 0;
      const imgId = "profile_" + acc.id;
      const localIm = imgMap.get(imgId);
      if (ts > 0 && (!localIm || localIm.at < ts)) neededImgs.add(imgId);
    }
    if (db.settings.logoAt && (!imgMap.get("logo") || imgMap.get("logo").at < db.settings.logoAt)) {
      neededImgs.add("logo");
    }

    for (const imgId of neededImgs) {
      try {
        const imObj = await fbGet(`shops/${shopId}/data/images/${imgId}`);
        if (imObj && imObj.data) {
          await putLocalImage(imgId, imObj.data, imObj.at || Date.now(), true);
        }
      } catch (e) {}
    }
    if (neededImgs.size > 0) renderApp();

    syncStatus = "live";
    updateSyncPill();
  } catch (e) {
    syncStatus = "offline";
    updateSyncPill();
  }
}

async function pushOutboxToFirebase() {
  if (outbox.size === 0) return;
  try {
    syncStatus = "syncing";
    updateSyncPill();
    const shopId = FIREBASE_CFG.shopId;
    const keys = [...outbox];
    for (const key of keys) {
      if (key === "settings") {
        const u = db.settings._u || Date.now();
        await fbPut(`shops/${shopId}/data/settings`, { _u: u, j: JSON.stringify(db.settings) });
        outbox.delete(key);
      } else if (key.startsWith("img/")) {
        const imgId = key.slice(4);
        const im = imgMap.get(imgId);
        if (im && im.data) {
          await fbPut(`shops/${shopId}/data/images/${imgId}`, { at: im.at || Date.now(), data: im.data });
        }
        outbox.delete(key);
      } else if (key.includes("/")) {
        const [col, id] = key.split("/");
        const item = (db[col] || []).find((x) => x.id === id);
        const tomb = db.tombs.find((t) => t.c === col && t.id === id);
        if (item) {
          await fbPut(`shops/${shopId}/data/${col}/${id}`, { _u: item._u || Date.now(), j: JSON.stringify(item) });
        } else if (tomb) {
          await fbPut(`shops/${shopId}/data/${col}/${id}`, { _u: tomb._u || Date.now(), deleted: true });
        }
        outbox.delete(key);
      }
    }
    saveOutbox();
    syncStatus = "live";
    updateSyncPill();
  } catch (e) {
    syncStatus = "offline";
    updateSyncPill();
  }
}

function updateSyncPill() {
  const el = document.getElementById("syncPill");
  if (!el) return;
  if (syncStatus === "live") {
    el.className = "sync-pill";
    el.textContent = "● Live Sync";
  } else if (syncStatus === "syncing") {
    el.className = "sync-pill syncing";
    el.textContent = "↻ Syncing…";
  } else {
    el.className = "sync-pill offline";
    el.textContent = "○ Offline Ready";
  }
}

// ---- Colour × Size Variant Stock & Colour-Specific Photo Helpers ----
function parseSizesList(p) {
  const list = String((p && p.variant) || "Free Size").split(",").map((x) => x.trim()).filter(Boolean);
  return list.length ? list : ["Free Size"];
}
function parseColorsList(p) {
  const list = String((p && p.color) || "As Shown").split(",").map((x) => x.trim()).filter(Boolean);
  return list.length ? list : ["As Shown"];
}
function makeVariantKey(color, size) {
  return `${String(color || "").trim()}|${String(size || "").trim()}`;
}
function hasVariantStockMatrix(p) {
  return Boolean(p && p.variantStock && typeof p.variantStock === "object" && Object.keys(p.variantStock).length > 0);
}
function getVariantQty(p, color, size) {
  if (!p) return 0;
  if (!hasVariantStockMatrix(p)) return Math.max(0, Number(p.qty) || 0);
  const exactKey = makeVariantKey(color, size);
  if (p.variantStock[exactKey] !== undefined) return Math.max(0, Number(p.variantStock[exactKey]) || 0);
  const lowerKey = exactKey.toLowerCase();
  for (const [k, v] of Object.entries(p.variantStock)) {
    if (String(k).toLowerCase() === lowerKey) return Math.max(0, Number(v) || 0);
  }
  return 0;
}
function getColorTotalQty(p, color) {
  if (!p) return 0;
  if (!hasVariantStockMatrix(p)) return Math.max(0, Number(p.qty) || 0);
  const sizes = parseSizesList(p);
  return sizes.reduce((sum, sz) => sum + getVariantQty(p, color, sz), 0);
}
function getSizeTotalQty(p, size) {
  if (!p) return 0;
  if (!hasVariantStockMatrix(p)) return Math.max(0, Number(p.qty) || 0);
  const colors = parseColorsList(p);
  return colors.reduce((sum, cl) => sum + getVariantQty(p, cl, size), 0);
}
function isColorAvailable(p, color) {
  return getColorTotalQty(p, color) > 0;
}
function isSizeAvailableForColor(p, color, size) {
  return getVariantQty(p, color, size) > 0;
}
function getFirstAvailableColorAndSize(p) {
  const colors = parseColorsList(p);
  const sizes = parseSizesList(p);
  for (const c of colors) {
    if (isColorAvailable(p, c)) {
      for (const s of sizes) {
        if (isSizeAvailableForColor(p, c, s)) return { color: c, size: s };
      }
      return { color: c, size: sizes[0] || "Free Size" };
    }
  }
  return { color: colors[0] || "As Shown", size: sizes[0] || "Free Size" };
}

function getOrderedPhotosForProductColor(p, selectedColor, idToUrlObj) {
  const ids = Array.isArray(p?.photoIds) && p.photoIds.length ? p.photoIds : (p?.imgAt ? [p.id] : []);
  const colorMap = (p && p.photoColorMap && typeof p.photoColorMap === "object") ? p.photoColorMap : {};
  const targetColor = String(selectedColor || "").trim().toLowerCase();
  const matchedUrls = [];
  const otherUrls = [];
  for (const id of ids) {
    const url = idToUrlObj ? idToUrlObj[id] : (imgMap.get(id)?.data || "");
    if (!url) continue;
    const tag = String(colorMap[id] || "").trim().toLowerCase();
    if (targetColor && tag && tag === targetColor) {
      matchedUrls.push(url);
    } else {
      otherUrls.push(url);
    }
  }
  return matchedUrls.length > 0 ? [...matchedUrls, ...otherUrls] : otherUrls;
}

function getCatItemState(p) {
  if (!catSelections[p.id]) {
    const firstAvail = getFirstAvailableColorAndSize(p);
    catSelections[p.id] = {
      selected: false,
      qty: 1,
      size: firstAvail.size,
      color: firstAvail.color
    };
  } else {
    const st = catSelections[p.id];
    if (!isColorAvailable(p, st.color)) {
      const firstAvail = getFirstAvailableColorAndSize(p);
      st.color = firstAvail.color;
      st.size = firstAvail.size;
    } else if (!isSizeAvailableForColor(p, st.color, st.size)) {
      const sizes = parseSizesList(p);
      const availSz = sizes.find((sz) => isSizeAvailableForColor(p, st.color, sz));
      if (availSz) st.size = availSz;
    }
    const maxVarQty = Math.max(1, getVariantQty(p, st.color, st.size));
    if (st.qty > maxVarQty) st.qty = maxVarQty;
  }
  return catSelections[p.id];
}

async function renderCustomerLiveCatalogueMode(preselectProdId = null) {
  const root = document.getElementById("app");
  root.innerHTML = `
    <div class="auth-screen" style="text-align:center;">
      <div class="card" style="padding:28px 20px;">
        <div style="font-size:38px;margin-bottom:10px;">👗</div>
        <h2 style="margin:0 0 6px;">Loading Live Collection…</h2>
        <p style="color:var(--muted);margin:0;">Fetching current in-stock outfits & photos from SISORA…</p>
      </div>
    </div>
  `;

  try {
    const shopId = FIREBASE_CFG.shopId;
    const [rawSettings, rawProducts] = await Promise.all([
      fbGet(`shops/${shopId}/data/settings`),
      fbGet(`shops/${shopId}/data/products`)
    ]);

    if (rawSettings && rawSettings.j) {
      const parsedSet = typeof rawSettings.j === "string" ? JSON.parse(rawSettings.j) : rawSettings.j;
      catShopSettings = { ...DEFAULT_SETTINGS, ...parsedSet };
      db.settings = catShopSettings;
      applyTheme();
    }

    const prodMap = new Map();
    // 1. Seed with Firebase products
    if (rawProducts && typeof rawProducts === "object") {
      for (const [pid, wrap] of Object.entries(rawProducts)) {
        if (!wrap || wrap.deleted || !wrap.j) continue;
        const p = typeof wrap.j === "string" ? JSON.parse(wrap.j) : wrap.j;
        if (p && p.id) prodMap.set(p.id, p);
      }
    }
    // 2. Merge local products if available (from db.products or localStorage)
    const localProds = (typeof db !== "undefined" && Array.isArray(db.products) && db.products.length)
      ? db.products
      : (function() {
          try {
            const raw = localStorage.getItem("sisora_db_v2") || localStorage.getItem("sisora_db");
            if (raw) {
              const d = JSON.parse(raw);
              return Array.isArray(d.products) ? d.products : [];
            }
          } catch (e) {}
          return [];
        })();
    for (const lp of localProds) {
      if (!lp || !lp.id) continue;
      const remote = prodMap.get(lp.id);
      if (!remote || (Number(lp._u) || 0) >= (Number(remote._u) || 0)) {
        prodMap.set(lp.id, lp);
      }
    }
    const inStockList = [];
    for (const p of prodMap.values()) {
      if (p && Number(p.qty) > 0 && !p.archived) {
        inStockList.push(p);
      }
    }
    inStockList.sort((a, b) => (Number(b._u) || 0) - (Number(a._u) || 0));
    catProducts = inStockList;

    if (preselectProdId) {
      const found = catProducts.find((x) => x.id === preselectProdId);
      if (found) {
        const st = getCatItemState(found);
        st.selected = true;
      }
    }

    if (catShopSettings.logoAt) {
      fbGet(`shops/${shopId}/data/images/logo`).then((im) => {
        if (im && im.data) {
          catShopSettings._logoData = im.data;
          renderLiveCatalogueDom();
        }
      }).catch(() => {});
    }

    renderLiveCatalogueDom();

    // Load product photos and videos progressively in parallel
    await Promise.all(
      catProducts.map(async (p) => {
        const ids = Array.isArray(p.photoIds) && p.photoIds.length ? p.photoIds : (p.imgAt ? [p.id] : []);
        const urls = [];
        const byId = {};
        for (const imgId of ids) {
          const im = await fbGet(`shops/${shopId}/data/images/${imgId}`);
          if (im && im.data) {
            urls.push(im.data);
            byId[imgId] = im.data;
          }
        }
        if (urls.length) {
          catPhotosMap[p.id] = urls;
          catPhotosByIdMap[p.id] = byId;
        }
        if (p.videoId) {
          const vIm = await fbGet(`shops/${shopId}/data/images/${p.videoId}`).catch(() => null);
          if (vIm && vIm.data) {
            catVideosMap[p.id] = vIm.data;
          }
        }
        renderLiveCatalogueDom();
      })
    );
  } catch (err) {
    root.innerHTML = `
      <div class="auth-screen" style="text-align:center;">
        <div class="card" style="padding:28px 20px;">
          <h2>Unable to load live catalogue</h2>
          <p style="color:var(--muted);">${esc(err.message)}</p>
        </div>
      </div>
    `;
  }
}

window.updateCatItemOption = (prodId, field, value) => {
  const p = catProducts.find((x) => x.id === prodId);
  if (!p) return;
  const st = getCatItemState(p);
  if (field === "color") {
    if (!isColorAvailable(p, value)) return showToast("This colour is currently out of stock");
    st.color = value;
    if (!isSizeAvailableForColor(p, value, st.size)) {
      const availSz = parseSizesList(p).find((sz) => isSizeAvailableForColor(p, value, sz));
      if (availSz) st.size = availSz;
    }
  } else if (field === "size") {
    if (!isSizeAvailableForColor(p, st.color, value)) return showToast("This size is out of stock for " + st.color);
    st.size = value;
  }
  const maxVarQty = Math.max(1, getVariantQty(p, st.color, st.size));
  st.qty = Math.min(st.qty || 1, maxVarQty);
  renderLiveCatalogueDom();
};

window.submitCustomerCatalogueOrder = async () => {
  const name = (document.getElementById("custOrdName")?.value || "").trim();
  const phone = (document.getElementById("custOrdPhone")?.value || "").trim();
  const address = (document.getElementById("custOrdAddress")?.value || "").trim();
  const extraNotes = (document.getElementById("custOrdNotes")?.value || "").trim();
  const chosenUpiObj = OFFICIAL_UPI_IDS.find((u) => u.id === _custCheckoutUpiId) || OFFICIAL_UPI_IDS[0];

  if (!name) return showToast("Please enter your name");
  if (!phone) return showToast("Please enter your WhatsApp number");
  if (!address) return showToast("Please enter your delivery address");
  if (!_custCheckoutScreenshotDataUrl) {
    return showToast("Please attach your UPI payment confirmation screenshot 📸");
  }

  const selectedItems = catProducts.filter((p) => getCatItemState(p).selected);
  if (!selectedItems.length) return;

  const btn = document.getElementById("placeCustOrderBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Submitting order & payment proof…"; }

  try {
    const shopId = FIREBASE_CFG.shopId;
    const now = Date.now();
    const custId = "cust_" + phone.replace(/\D/g, "").slice(-10) + "_" + uid().slice(-3);

    // 1. Save customer record in Firebase
    const custRecord = {
      id: custId,
      name,
      phone,
      address,
      birthday: "",
      size: selectedItems.map((p) => getCatItemState(p).size).join(", "),
      notes: `Ordered via Live Catalogue · UPI: ${chosenUpiObj.id}`,
      createdAt: nowIso(),
      updatedAt: nowIso(),
      _u: now
    };
    await fbPut(`shops/${shopId}/data/customers/${custId}`, { _u: now, j: JSON.stringify(custRecord) });

    // Upload payment screenshot once to Firebase images
    const payProofImgId = `pay_${now.toString(36)}_${uid().slice(-3)}`;
    if (_custCheckoutScreenshotDataUrl) {
      await fbPut(`shops/${shopId}/data/images/${payProofImgId}`, {
        id: payProofImgId,
        at: now,
        data: _custCheckoutScreenshotDataUrl
      });
    }

    // 2. Create a Sale order record for each selected outfit and decrement live variant stock
    let grandTotal = 0;
    const orderLines = [];

    for (const p of selectedItems) {
      const st = getCatItemState(p);
      const availVarQty = Math.max(1, getVariantQty(p, st.color, st.size));
      const orderQty = Math.max(1, Math.min(availVarQty, Number(st.qty) || 1));
      const lineTotal = orderQty * (Number(p.price) || 0);
      grandTotal += lineTotal;

      const saleId = uid();
      const itemNote = `Size: ${st.size} · Colour: ${st.color} · UPI Paid To: ${chosenUpiObj.id} · Payment Verification Pending${extraNotes ? " · " + extraNotes : ""}`;
      const newSale = {
        id: saleId,
        productId: p.id,
        productName: p.name,
        qty: orderQty,
        price: Number(p.price) || 0,
        costAtSale: Number(p.cost) || 0,
        owner: p.owner || "joint",
        customer: name,
        customerId: custId,
        customerPhone: phone,
        seller: chosenUpiObj.sister,
        channel: "Live Catalogue",
        date: todayIso(),
        notes: itemNote,
        total: lineTotal,
        status: "ordered",
        courier: "",
        tracking: "",
        address,
        isWebOrder: true,
        orderSeen: false,
        selectedColor: st.color,
        selectedSize: st.size,
        upiId: chosenUpiObj.id,
        paymentScreenshotId: payProofImgId,
        paymentVerified: false,
        // Order confirmed only after payment received & verified by sister/admin
        pays: [],
        returns: [],
        createdAt: nowIso(),
        _u: now
      };
      await fbPut(`shops/${shopId}/data/sales/${saleId}`, { _u: now, j: JSON.stringify(newSale) });

      // Update product variantStock & total qty in Firebase
      if (hasVariantStockMatrix(p)) {
        const key = makeVariantKey(st.color, st.size);
        let matchedKey = key;
        for (const k of Object.keys(p.variantStock)) {
          if (k.toLowerCase() === key.toLowerCase()) { matchedKey = k; break; }
        }
        p.variantStock[matchedKey] = Math.max(0, (Number(p.variantStock[matchedKey]) || 0) - orderQty);
        p.qty = Object.values(p.variantStock).reduce((a, b) => a + Math.max(0, Number(b) || 0), 0);
      } else {
        p.qty = Math.max(0, (Number(p.qty) || 0) - orderQty);
      }
      p._u = now;
      await fbPut(`shops/${shopId}/data/products/${p.id}`, { _u: now, j: JSON.stringify(p) });

      orderLines.push(`• *${p.name}* × ${orderQty} (Colour: ${st.color}, Size: ${st.size}) — ${money(lineTotal)}`);
    }

    const waSummary = [
      `🛍️ *New Catalogue Order — ${catShopSettings.shopName}*`,
      `⏳ *Status:* Awaiting Payment Verification (Confirmed once UPI payment is received)`,
      `👤 *Customer:* ${name}`,
      `📞 *WhatsApp:* ${phone}`,
      `📍 *Address:* ${address}`,
      `💳 *Paid via UPI To:* ${chosenUpiObj.id} (${chosenUpiObj.sister === "vaheeda" ? "Vaheeda" : "Balkees"})`,
      `📸 *Payment Screenshot:* Uploaded & attached`,
      extraNotes ? `📝 *Note/Ref:* ${extraNotes}` : "",
      ``,
      `*Ordered Outfits:*`,
      ...orderLines,
      ``,
      `💖 *Total Paid via UPI: ${money(grandTotal)}*`
    ].filter(Boolean).join("\n");

    const savedScreenshotUrl = _custCheckoutScreenshotDataUrl;
    window._lastOrderWaSummary = waSummary;
    window._lastOrderScreenshot = savedScreenshotUrl;

    _custCheckoutScreenshotDataUrl = "";
    catProducts = catProducts.filter((p) => Number(p.qty) > 0 && !p.archived);
    catSelections = {};
    renderLiveCatalogueDom();

    const modalRoot = document.getElementById("modalRoot");
    modalRoot.innerHTML = `
      <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
        <div class="modal-sheet" style="text-align:center;">
          <div style="font-size:44px;margin-bottom:4px;">🎉</div>
          <h3 style="margin:0 0 4px;font-size:20px;">Order Submitted — Pending Payment Verification!</h3>
          <p style="color:var(--muted);font-size:12.5px;margin:0 0 10px;">
            Thank you, <b>${esc(name)}</b>! Your order & UPI screenshot (paid to <b>${esc(chosenUpiObj.id)}</b>) have been recorded. <b>Your order will be confirmed once payment is verified.</b>
          </p>

          ${savedScreenshotUrl ? `
            <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--green-soft);border-radius:12px;margin-bottom:10px;text-align:left;">
              <img src="${savedScreenshotUrl}" style="width:48px;height:58px;object-fit:cover;border-radius:8px;border:1.5px solid var(--green);">
              <div style="font-size:12px;">
                <b style="color:var(--green);">✅ UPI Screenshot Uploaded</b><br>
                <span>UPI ID: <b>${esc(chosenUpiObj.id)}</b></span>
              </div>
            </div>
          ` : ""}

          <div class="card" style="background:var(--bg);text-align:left;font-size:12px;white-space:pre-wrap;margin-bottom:12px;">${esc(waSummary)}</div>

          <div style="display:flex;flex-direction:column;gap:8px;">
            <button class="btn btn-primary" style="width:100%;padding:13px;" onclick="window.sendCustOrderWhatsAppWithProof('${SISTER_WHATSAPP_HELP.vaheeda.digits}')">
              ${whatsappLogoSvg(18)} <span>💬 Send Confirmation + UPI Screenshot to Vaheeda (${SISTER_WHATSAPP_HELP.vaheeda.display})</span>
            </button>
            <button class="btn btn-primary" style="width:100%;padding:13px;" onclick="window.sendCustOrderWhatsAppWithProof('${SISTER_WHATSAPP_HELP.balkees.digits}')">
              ${whatsappLogoSvg(18)} <span>💬 Send Confirmation + UPI Screenshot to Balkees (${SISTER_WHATSAPP_HELP.balkees.display})</span>
            </button>
            <button class="btn btn-gold" style="width:100%;padding:13px;" onclick="window.sendCustOrderToInstagram()">
              ${instagramLogoSvg(18)} <span>Send Order Confirmation to Instagram (@sisora.business)</span>
            </button>
            <button class="btn btn-soft" style="width:100%;" onclick="closeModal()">Continue Browsing Catalogue</button>
          </div>
        </div>
      </div>
    `;
  } catch (e) {
    showToast("Could not submit order: " + e.message);
    if (btn) { btn.disabled = false; btn.textContent = "✅ Submit Order & Send Payment Confirmation"; }
  }
};

window.sendCustOrderWhatsAppWithProof = async (targetDigits) => {
  const summary = window._lastOrderWaSummary || "";
  const screenshotDataUrl = window._lastOrderScreenshot || "";
  if (screenshotDataUrl && navigator.share) {
    try {
      const res = await fetch(screenshotDataUrl);
      const blob = await res.blob();
      const file = new File([blob], "SISORA_UPI_Payment_Screenshot.jpg", { type: "image/jpeg" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          title: "SISORA Order & UPI Payment Screenshot",
          text: summary,
          files: [file]
        });
        return;
      }
    } catch (e) {}
  }
  const waUrl = `https://wa.me/${targetDigits}?text=${encodeURIComponent(summary)}`;
  window.open(waUrl, "_blank");
};

window.sendCustOrderToInstagram = () => {
  const summary = window._lastOrderWaSummary || "";
  if (navigator.clipboard && summary) {
    navigator.clipboard.writeText(summary).catch(() => {});
  }
  showToast("Order details copied! Paste in @sisora.business Instagram DM 📸");
  window.open(SISORA_INSTAGRAM_URL, "_blank");
};

// ---- Sister Available Cash Wallets & Financial Totals (Synced with Android Models.kt) ----
function computeSisterCashWallets() {
  function calcForSister(sisId, sisName) {
    let salesCashReceived = 0;
    let salesReturnsRefunded = 0;
    for (const s of (db.sales || [])) {
      for (const p of (s.pays || [])) {
        const amt = Number(p.amount) || 0;
        const recBy = p.receivedBy || s.seller || "vaheeda";
        if (recBy === "split") {
          salesCashReceived += sisId === "vaheeda" ? (Number(p.vaheedaAmount) || 0) : (Number(p.balkeesAmount) || 0);
        } else if (recBy === sisId) {
          salesCashReceived += amt;
        } else if (recBy === "both") {
          salesCashReceived += amt / 2;
        }
      }
      for (const r of (s.returns || [])) {
        const ref = Number(r.refund) || 0;
        const mode = r.cashFlowMode || ("refund_by_" + (s.seller === "balkees" ? "balkees" : "vaheeda"));
        if (mode === "store_credit") continue;
        if (mode === "refund_split") {
          salesReturnsRefunded += sisId === "vaheeda" ? (Number(r.vaheedaRefund) || 0) : (Number(r.balkeesRefund) || 0);
        } else if (mode === "refund_by_" + sisId) {
          salesReturnsRefunded += ref;
        }
      }
    }

    let purchasesFromAvailableCash = 0;
    let purchasesNewInvestment = 0;
    let purchaseReturnsCashIn = 0;
    for (const pur of (db.purchases || [])) {
      const tot = Number(pur.totalAmount) || 0;
      let myPaid = 0;
      if (pur.paidBy === "split") {
        myPaid = sisId === "vaheeda" ? (Number(pur.vaheedaPaid) || 0) : (Number(pur.balkeesPaid) || 0);
      } else if (pur.paidBy === sisId) {
        myPaid = tot;
      }
      if ((pur.fundingSource || "available_cash") === "new_investment") {
        purchasesNewInvestment += myPaid;
      } else {
        purchasesFromAvailableCash += myPaid;
      }

      for (const pr of (pur.returns || [])) {
        const rAmt = Number(pr.returnAmount) || 0;
        const cf = pr.cashFlowMode || "cash_refund_vaheeda";
        if (cf === "supplier_credit") continue;
        if (cf === "cash_refund_split") {
          purchaseReturnsCashIn += sisId === "vaheeda" ? (Number(pr.vaheedaRefund) || 0) : (Number(pr.balkeesRefund) || 0);
        } else if (cf === "cash_refund_" + sisId) {
          purchaseReturnsCashIn += rAmt;
        }
      }
    }

    let expensesFromAvailableCash = 0;
    let expensesNewInvestment = 0;
    let capitalAdded = 0;
    let capitalWithdrawn = 0;

    for (const e of (db.expenses || [])) {
      const amt = Number(e.amount) || 0;
      let myShare = 0;
      if (e.paidBy === "split") {
        myShare = sisId === "vaheeda" ? (Number(e.vaheedaPaid) || 0) : (Number(e.balkeesPaid) || 0);
      } else if (e.paidBy === sisId) {
        myShare = amt;
      }
      if (e.category === "Capital Contribution") {
        capitalAdded += myShare;
      } else if (e.category === "Partner Withdrawal") {
        capitalWithdrawn += myShare;
      } else {
        if ((e.fundingSource || "available_cash") === "new_investment") {
          expensesNewInvestment += myShare;
        } else {
          expensesFromAvailableCash += myShare;
        }
      }
    }

    let settlementsIn = 0, settlementsOut = 0;
    for (const st of (db.settlements || [])) {
      const a = Number(st.amount) || 0;
      if (st.to === sisId) settlementsIn += a;
      if (st.from === sisId) settlementsOut += a;
    }

    const availableCash = salesCashReceived + purchaseReturnsCashIn + settlementsIn
      - salesReturnsRefunded - purchasesFromAvailableCash - expensesFromAvailableCash - capitalWithdrawn - settlementsOut;
    const totalOutOfPocketInvested = capitalAdded + purchasesNewInvestment + expensesNewInvestment;

    return {
      sisterId: sisId,
      sisterName: sisName,
      salesCashReceived,
      salesReturnsRefunded,
      purchasesFromAvailableCash,
      purchasesNewInvestment,
      purchaseReturnsCashIn,
      expensesFromAvailableCash,
      expensesNewInvestment,
      capitalAdded,
      capitalWithdrawn,
      availableCash,
      totalOutOfPocketInvested
    };
  }
  return {
    vaheeda: calcForSister("vaheeda", "Vaheeda"),
    balkees: calcForSister("balkees", "Balkees")
  };
}

function computeTotals() {
  let salesGross = 0, returnsTotal = 0, revenue = 0, cogs = 0, received = 0, due = 0;
  for (const s of (db.sales || [])) {
    const gross = Number(s.total) || 0;
    const retRefund = (s.returns || []).reduce((a, r) => a + (Number(r.refund) || 0), 0);
    const retRestock = (s.returns || []).reduce((a, r) => a + (Number(r.restock) || 0), 0);
    const netTot = Math.max(0, gross - retRefund);
    const paid = (s.pays || []).reduce((a, p) => a + (Number(p.amount) || 0), 0);
    salesGross += gross;
    returnsTotal += retRefund;
    revenue += netTot;
    cogs += (Number(s.costAtSale) || 0) * Math.max(0, (Number(s.qty) || 1) - retRestock);
    received += paid;
    due += Math.max(0, netTot - paid);
  }
  const expenses = (db.expenses || [])
    .filter((e) => e.category !== "Capital Contribution" && e.category !== "Partner Withdrawal")
    .reduce((a, e) => a + (Number(e.amount) || 0), 0);

  let purchasesGross = 0, purchaseReturnsTotal = 0, purchasesNet = 0, purchasesFromSalesCash = 0, purchasesFromNewInvestment = 0;
  for (const pur of (db.purchases || [])) {
    const g = Number(pur.totalAmount) || 0;
    const prRef = (pur.returns || []).reduce((a, r) => a + (Number(r.returnAmount) || 0), 0);
    const netP = Math.max(0, g - prRef);
    purchasesGross += g;
    purchaseReturnsTotal += prRef;
    purchasesNet += netP;
    if ((pur.fundingSource || "available_cash") === "new_investment") purchasesFromNewInvestment += netP;
    else purchasesFromSalesCash += netP;
  }

  const stockUnits = (db.products || []).reduce((a, p) => a + Math.max(0, Number(p.qty) || 0), 0);
  const stockCost = (db.products || []).reduce((a, p) => a + Math.max(0, Number(p.qty) || 0) * (Number(p.cost) || 0), 0);
  const stockRetail = (db.products || []).reduce((a, p) => a + Math.max(0, Number(p.qty) || 0) * (Number(p.price) || 0), 0);
  const netProfit = revenue - cogs - expenses;
  const wallets = computeSisterCashWallets();
  return {
    salesGross, returnsTotal, revenue, cogs, received, due, expenses,
    purchasesGross, purchaseReturnsTotal, purchasesNet, purchasesFromSalesCash, purchasesFromNewInvestment,
    stockUnits, stockCost, stockRetail, netProfit,
    vaheedaCash: wallets.vaheeda.availableCash,
    balkeesCash: wallets.balkees.availableCash,
    totalAvailableCash: wallets.vaheeda.availableCash + wallets.balkees.availableCash,
    wallets
  };
}

window.viewSalePaymentScreenshot = async function(saleId) {
  const s = (db.sales || []).find((x) => x.id === saleId);
  if (!s || !s.paymentScreenshotId) return showToast("No payment screenshot attached");
  let im = imgMap.get(s.paymentScreenshotId);
  if (!im || !im.data) {
    showToast("Fetching UPI screenshot…");
    try {
      const remoteIm = await fbGet(`shops/${FIREBASE_CFG.shopId}/data/images/${s.paymentScreenshotId}`);
      if (remoteIm && remoteIm.data) {
        await putLocalImage(s.paymentScreenshotId, remoteIm.data, remoteIm.at || Date.now(), true);
        im = imgMap.get(s.paymentScreenshotId);
      }
    } catch (e) {}
  }
  if (im && im.data) {
    openLightbox([im.data], 0);
  } else {
    showToast("Payment screenshot not found on server");
  }
};

window.toggleSalePaymentVerified = function(saleId) {
  const s = (db.sales || []).find((x) => x.id === saleId);
  if (!s) return;
  const now = Date.now();
  const paidSum = (s.pays || []).reduce((a, p) => a + (Number(p.amount) || 0), 0);
  const currentlyVerified = Boolean(s.paymentVerified) || paidSum >= (Number(s.total) || 0);

  if (currentlyVerified) {
    s.paymentVerified = false;
    s.pays = [];
    showToast("⏳ Marked as Payment Pending (Order Unconfirmed)");
  } else {
    s.paymentVerified = true;
    s.orderSeen = true;
    const total = Number(s.total) || 0;
    const isBalkeesUpi = String(s.upiId || "").toLowerCase().includes("balkees") || s.seller === "balkees";
    const recBy = isBalkeesUpi ? "balkees" : "vaheeda";
    s.pays = [{
      id: uid(),
      date: todayIso(),
      amount: total,
      method: s.upiId ? `UPI (${s.upiId})` : "UPI / GPay",
      receivedBy: recBy,
      vaheedaAmount: recBy === "vaheeda" ? total : 0,
      balkeesAmount: recBy === "balkees" ? total : 0,
      note: s.upiId ? `Verified UPI payment to ${s.upiId}` : "Verified payment"
    }];
    showToast(`✅ Payment Received! Order Confirmed & credited to ${recBy === "balkees" ? "Balkees" : "Vaheeda"}`);
  }
  s._u = now;
  saveLocalDb();
  outbox.add(`sales/${s.id}`);
  saveOutbox();
  renderApp();
  pushOutboxToFirebase();
};

window.markSingleWebOrderSeen = function(saleId) {
  const s = db.sales.find((x) => x.id === saleId);
  if (!s) return;
  s.orderSeen = true;
  s._u = Date.now();

};

window.markAllWebOrdersSeen = function() {
  const now = Date.now();
  (db.sales || []).forEach((s) => {

function getEffectivePurchaseItems(pur) {
  if (Array.isArray(pur.items) && pur.items.length > 0) {
    return pur.items;
  }
  return [{
    id: pur.id + "_0",
    productId: pur.productId || "",
    productName: pur.productName || pur.itemsSummary || pur.title || "Stock Purchase",
    sku: pur.sku || "",
    category: pur.category || "Kurti",
    sizes: pur.sizes || "",
    colors: pur.colors || "",
    variantStock: pur.variantStock || {},
    photoIds: pur.photoIds || [],
    photoColorMap: pur.photoColorMap || {},
    qty: Number(pur.qty) || 1,
    unitCost: Number(pur.unitCost) || 0,
    sellingPrice: Number(pur.sellingPrice) || 0
  }];
}

// ---- Reports & Diagrams Page (Financial-Friendly P&L + Cash Wallets + 8 Diagrams) ----
function renderReportsTab() {
  const t = computeTotals();
  const hidePriv = db.settings.privacy;
  const palette = ["#c85f83", "#b8860b", "#237a57", "#5b4b8a", "#d96b27", "#2b7a9b"];

  // 1. Sister Contributions (Vaheeda vs Balkees)
  const wV = t.wallets.vaheeda;
  const wB = t.wallets.balkees;

  function sisterStats(sisId, w) {
    const salesBy = db.sales.filter((s) => s.seller === sisId).reduce((a, s) => a + (Number(s.total) || 0), 0);
    const stockOwned = db.products.filter((p) => p.owner === sisId).reduce((a, p) => a + (Number(p.cost) || 0) * Math.max(0, Number(p.qty) || 0), 0);
    const netContrib = w.totalOutOfPocketInvested + stockOwned - w.capitalWithdrawn;
    return {
      capIn: w.totalOutOfPocketInvested,
      expPaid: w.expensesFromAvailableCash + w.expensesNewInvestment,
      withdrawn: w.capitalWithdrawn,
      salesBy,
      stockOwned,
      netContrib,
      availableCash: w.availableCash
    };
  }
  const vah = sisterStats("vaheeda", wV);
  const bal = sisterStats("balkees", wB);
  const totContrib = Math.max(1, Math.max(0, vah.netContrib) + Math.max(0, bal.netContrib));
  const vahPct = Math.round((Math.max(0, vah.netContrib) / totContrib) * 100);

  // 2. Sales by Source / Channel
  const chanMap = {};
  db.sales.forEach((s) => { const ch = s.channel || "Instagram"; chanMap[ch] = (chanMap[ch] || 0) + (Number(s.total) || 0); });
  const chanEntries = Object.entries(chanMap).sort((a, b) => b[1] - a[1]);

  // 3. Payment Modes
  const payMap = {};
  db.sales.forEach((s) => {
    const paid = (s.pays || []).reduce((a, p) => {
      const m = p.method || "UPI / GPay";
      payMap[m] = (payMap[m] || 0) + (Number(p.amount) || 0);
      return a + (Number(p.amount) || 0);
    }, 0);
    const due = Math.max(0, (Number(s.total) || 0) - paid);
    if (due > 0) payMap["Pending Due"] = (payMap["Pending Due"] || 0) + due;
  });
  const payEntries = Object.entries(payMap).sort((a, b) => b[1] - a[1]);

  // 4. Expenses by Category
  const expMap = {};
  db.expenses.forEach((e) => { const c = e.category || "Other"; expMap[c] = (expMap[c] || 0) + (Number(e.amount) || 0); });
  const expEntries = Object.entries(expMap).sort((a, b) => b[1] - a[1]);

  // 5. Stock Value by Dress Category
  const catStockMap = {};
  db.products.forEach((p) => { const c = p.category || "Kurti"; catStockMap[c] = (catStockMap[c] || 0) + Math.max(0, Number(p.qty) || 0) * (Number(p.price) || 0); });
  const catStockEntries = Object.entries(catStockMap).sort((a, b) => b[1] - a[1]);

  function buildDonutHtml(entries, centerLabel) {
    const total = entries.reduce((a, x) => a + x[1], 0);
    if (total <= 0) return `<p style="color:var(--muted);font-size:13px;margin:0;">No data recorded yet.</p>`;
    let accDeg = 0;
    const stops = entries.map(([k, v], i) => {
      const deg = (v / total) * 360;
      const start = accDeg;
      accDeg += deg;
      return `${palette[i % palette.length]} ${start.toFixed(1)}deg ${accDeg.toFixed(1)}deg`;
    }).join(", ");
    return `
      <div class="donut-wrap">
        <div class="donut-ring" style="background:conic-gradient(${stops});">
          <div class="donut-hole">
            <span style="color:var(--muted);font-size:9.5px;">${esc(centerLabel)}</span>
            <span>${money(total)}</span>
          </div>
        </div>
        <div class="legend-list">
          ${entries.map(([k, v], i) => `
            <div class="legend-item">
              <span><span class="legend-dot" style="background:${palette[i % palette.length]}"></span>${esc(k)}</span>
              <b>${money(v)} (${Math.round((v / total) * 100)}%)</b>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  return `
    ${renderSistersCashWalletCardHtml(false)}

    <!-- Financial-Friendly Statement Card -->
    <div class="card">
      <h3 style="margin:0 0 10px;">📑 Financial Statement (P&L + Cash Flow Overview)</h3>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:13px;">
        <div style="display:flex;justify-content:space-between;"><span>Gross Sales Revenue:</span><b>${hidePriv ? "••••" : money(t.salesGross)}</b></div>
        <div style="display:flex;justify-content:space-between;color:var(--red);"><span>Less: Sales Returns / Refunds:</span><b>−${hidePriv ? "••••" : money(t.returnsTotal)}</b></div>

let _cropState = null;

window.openCropRotateModal = function(srcDataUrl, defaultAspect = "square", onSaveCallback, titleText = "✂️ Crop & Rotate Photo") {
  if (!srcDataUrl) return;
  const img = new Image();
  img.onload = () => {
    _cropState = {
      img,
      srcDataUrl,
      rotation: 0,
      flipH: false,
      aspect: defaultAspect, // "square" | "portrait" | "free"
      zoom: 1,
      panX: 0,
      panY: 0,
      dragging: false,
      lastX: 0,
      lastY: 0,
      onSave: onSaveCallback,
      prevModalHtml: document.getElementById("modalRoot")?.innerHTML || ""
    };
    renderCropRotateModalDom(titleText);
  };
  img.src = srcDataUrl;
};

function renderCropRotateModalDom(titleText = "✂️ Crop & Rotate Photo") {

  const modalRoot = document.getElementById("modalRoot");
  modalRoot.innerHTML = `

        </div>
        <div style="display:flex;justify-content:center;background:#141115;border-radius:16px;padding:12px;overflow:hidden;touch-action:none;">
          <canvas id="cropCanvas" width="320" height="320" style="max-width:100%;border-radius:10px;cursor:grab;touch-action:none;"></canvas>
        </div>

        <div style="display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" onclick="cropRotateAction('rotL')">↺ -90°</button>
          <button class="btn btn-outline btn-sm" onclick="cropRotateAction('rotR')">↻ +90°</button>
          <button class="btn btn-outline btn-sm" onclick="cropRotateAction('flip')">↔ Flip</button>

          <button id="aspBtn_portrait" class="btn btn-sm ${_cropState.aspect === 'portrait' ? 'btn-primary' : 'btn-soft'}" onclick="cropSetAspect('portrait')">4:5 Outfit</button>
          <button id="aspBtn_free" class="btn btn-sm ${_cropState.aspect === 'free' ? 'btn-primary' : 'btn-soft'}" onclick="cropSetAspect('free')">Free</button>

          <input type="range" min="100" max="300" value="${Math.round(_cropState.zoom * 100)}" oninput="cropSetZoom(this.value)" style="flex:1;padding:0;">

  drawCropPreviewCanvas();

function setupCropCanvasInteractions() {
  const canvas = document.getElementById("cropCanvas");
  if (!canvas || !_cropState) return;
  const startDrag = (x, y) => {
    _cropState.dragging = true;
    _cropState.lastX = x;
    _cropState.lastY = y;
  };
  const moveDrag = (x, y) => {
    if (!_cropState || !_cropState.dragging) return;
    const dx = (x - _cropState.lastX) / canvas.width;
    const dy = (y - _cropState.lastY) / canvas.height;
    _cropState.lastX = x;
    _cropState.lastY = y;
    _cropState.panX = Math.max(-0.5, Math.min(0.5, _cropState.panX + dx));
    _cropState.panY = Math.max(-0.5, Math.min(0.5, _cropState.panY + dy));
    drawCropPreviewCanvas();
  };
  const endDrag = () => { if (_cropState) _cropState.dragging = false; };

  canvas.addEventListener("mousedown", (e) => startDrag(e.clientX, e.clientY));
  window.addEventListener("mousemove", (e) => moveDrag(e.clientX, e.clientY));
  window.addEventListener("mouseup", endDrag);

  canvas.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
      e.preventDefault();
      startDrag(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: false });
  canvas.addEventListener("touchmove", (e) => {
    if (e.touches.length === 1) {
      e.preventDefault();
      moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: false });
  canvas.addEventListener("touchend", endDrag);
}

function drawCropPreviewCanvas() {
  const canvas = document.getElementById("cropCanvas");
  if (!canvas || !_cropState) return;
  const st = _cropState;
  const rot = ((st.rotation % 360) + 360) % 360;
  const swapped = rot === 90 || rot === 270;
  const srcW = swapped ? st.img.height : st.img.width;
  const srcH = swapped ? st.img.width : st.img.height;

  let cW = 300, cH = 300;
  if (st.aspect === "portrait") { cW = 264; cH = 330; }
  else if (st.aspect === "free") {
    const ratio = srcW / Math.max(1, srcH);
    if (ratio >= 1) { cW = 310; cH = Math.max(180, Math.round(310 / ratio)); }
    else { cH = 320; cW = Math.max(180, Math.round(320 * ratio)); }
  }
  canvas.width = cW;
  canvas.height = cH;

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#19151b";
  ctx.fillRect(0, 0, cW, cH);

  ctx.save();
  ctx.translate(cW / 2 + st.panX * cW, cH / 2 + st.panY * cH);
  ctx.rotate((rot * Math.PI) / 180);
  ctx.scale(st.flipH ? -st.zoom : st.zoom, st.zoom);

  const scaleCover = Math.max(cW / Math.max(1, srcW), cH / Math.max(1, srcH));
  const drawW = st.img.width * scaleCover;
  const drawH = st.img.height * scaleCover;
  ctx.drawImage(st.img, -drawW / 2, -drawH / 2, drawW, drawH);
  ctx.restore();

  // Rule-of-thirds crop guide lines
  ctx.strokeStyle = "rgba(255,255,255,0.38)";
  ctx.lineWidth = 1;
  for (let i = 1; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo((cW * i) / 3, 0);
    ctx.lineTo((cW * i) / 3, cH);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, (cH * i) / 3);
    ctx.lineTo(cW, (cH * i) / 3);
    ctx.stroke();
  }
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, cW - 2, cH - 2);
}

window.cropRotateAction = function(act) {
  if (!_cropState) return;
  if (act === "rotL") _cropState.rotation = (_cropState.rotation - 90) % 360;
  if (act === "rotR") _cropState.rotation = (_cropState.rotation + 90) % 360;
  if (act === "flip") _cropState.flipH = !_cropState.flipH;
  if (act === "reset") {
    _cropState.rotation = 0;
    _cropState.flipH = false;
    _cropState.zoom = 1;
    _cropState.panX = 0;
    _cropState.panY = 0;
  }
  drawCropPreviewCanvas();
};

window.cropSetAspect = function(asp) {
  if (!_cropState) return;
  _cropState.aspect = asp;
  ["square", "portrait", "free"].forEach((k) => {
    const b = document.getElementById("aspBtn_" + k);
    if (b) b.className = `btn btn-sm ${k === asp ? "btn-primary" : "btn-soft"}`;
  });
  drawCropPreviewCanvas();
};

window.cropSetZoom = function(val) {
  if (!_cropState) return;
  _cropState.zoom = Math.max(1, Math.min(3, Number(val) / 100));
  const lbl = document.getElementById("cropZoomLbl");
  if (lbl) lbl.textContent = `${Math.round(_cropState.zoom * 100)}%`;
  drawCropPreviewCanvas();
};

window.cancelCropRotateModal = function() {
  const prev = _cropState?.prevModalHtml || "";
  _cropState = null;
  const modalRoot = document.getElementById("modalRoot");
  if (modalRoot) modalRoot.innerHTML = prev;
};

window.applyCropRotateModal = function() {
  if (!_cropState) return;
  const st = _cropState;
  const rot = ((st.rotation % 360) + 360) % 360;
  const swapped = rot === 90 || rot === 270;
  const srcW = swapped ? st.img.height : st.img.width;
  const srcH = swapped ? st.img.width : st.img.height;

  let outW = 720, outH = 720;
  if (st.aspect === "portrait") { outW = 720; outH = 900; }
  else if (st.aspect === "free") {
    const ratio = srcW / Math.max(1, srcH);
    if (ratio >= 1) { outW = 840; outH = Math.max(320, Math.round(840 / ratio)); }
    else { outH = 840; outW = Math.max(320, Math.round(840 * ratio)); }
  }

  const outCanvas = document.createElement("canvas");
  outCanvas.width = outW;
  outCanvas.height = outH;
  const ctx = outCanvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, outW, outH);

  ctx.save();
  ctx.translate(outW / 2 + st.panX * outW, outH / 2 + st.panY * outH);
  ctx.rotate((rot * Math.PI) / 180);
  ctx.scale(st.flipH ? -st.zoom : st.zoom, st.zoom);

  const scaleCover = Math.max(outW / Math.max(1, srcW), outH / Math.max(1, srcH));
  const drawW = st.img.width * scaleCover;
  const drawH = st.img.height * scaleCover;
  ctx.drawImage(st.img, -drawW / 2, -drawH / 2, drawW, drawH);
  ctx.restore();

  const finalDataUrl = outCanvas.toDataURL("image/jpeg", 0.84);
  const cb = st.onSave;
  const prev = st.prevModalHtml || "";
  _cropState = null;
  const modalRoot = document.getElementById("modalRoot");
  if (modalRoot) modalRoot.innerHTML = prev;
  if (typeof cb === "function") cb(finalDataUrl);
};

function triggerDownload(filename, content, mime = "text/plain;charset=utf-8") {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

    exportedAt: nowIso(),
    db,
    images: imagesObj
  };
  triggerDownload(`SISORA-backup-${todayIso()}.json`, JSON.stringify(payload, null, 2), "application/json");
  showToast("Backup exported 💾");

window.restoreBackupFromJson = function(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      const src = parsed.db || parsed;
      if (!src || typeof src !== "object") throw new Error("Invalid backup file");
      if (Array.isArray(src.products)) db.products = src.products;
      if (Array.isArray(src.sales)) db.sales = src.sales;
      if (Array.isArray(src.purchases)) db.purchases = src.purchases;
      if (Array.isArray(src.expenses)) db.expenses = src.expenses;
      if (Array.isArray(src.customers)) db.customers = src.customers;
      if (Array.isArray(src.settlements)) db.settlements = src.settlements;
      if (src.settings) {
        db.settings = { ...DEFAULT_SETTINGS, ...src.settings, sisters: FIXED_SISTERS };
      }
      if (parsed.images && typeof parsed.images === "object") {
        for (const [k, v] of Object.entries(parsed.images)) {
          const dataUrl = typeof v === "string" ? v : v?.data;
          const at = (typeof v === "object" && v?.at) ? v.at : Date.now();
          if (dataUrl) await putLocalImage(k, dataUrl, at, false);
        }
      }
      saveLocalDb();
      renderApp();
      showToast("Backup restored ✨");
    } catch (e) {
      showToast("Could not restore backup");
    }
  };
  reader.readAsText(file);
};

window.exportCsv = function(kind) {
  const csvEsc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  let rows = [];
  if (kind === "sales") {
    rows.push(["Date", "Product", "Qty", "Unit Price", "Discount", "Total", "Paid", "Customer", "Phone", "Channel", "Status", "Sold By"]);
    db.sales.forEach((s) => {
      const total = (Number(s.qty) || 1) * (Number(s.unitPrice) || 0) - (Number(s.discount) || 0);
      rows.push([s.date, s.productName, s.qty, s.unitPrice, s.discount || 0, total, s.paidAmount || 0, s.customer, s.customerPhone || s.phone, s.channel, s.status, s.soldBy]);
    });
  } else if (kind === "stock") {
    rows.push(["Code", "Name", "Category", "Sizes", "Colours", "Cost", "Selling Price", "Qty", "Low Alert", "Archived"]);
    db.products.forEach((p) => {
      rows.push([p.code, p.name, p.category, p.variant, p.color, p.cost, p.price, p.qty, p.low, Boolean(p.archived)]);
    });
  } else if (kind === "expenses") {
    rows.push(["Date", "Title", "Category", "Type", "Amount", "Paid By", "Notes"]);
    db.expenses.forEach((e) => {
      rows.push([e.date, e.title, e.category, e.type || "expense", e.amount, e.paidBy, e.notes]);
    });
  } else if (kind === "customers") {
    rows.push(["Name", "Phone", "City", "Notes"]);
    db.customers.forEach((c) => {
      rows.push([c.name, c.phone, c.city, c.notes]);
    });
  }
  const csv = rows.map((r) => r.map(csvEsc).join(",")).join("\n");
  triggerDownload(`SISORA-${kind}-${todayIso()}.csv`, csv, "text/csv;charset=utf-8");
  showToast(`Exported ${kind} CSV 📄`);
};

window.changeMyOwnPin = function() {

  if (cur !== expected) return showToast("Current PIN is incorrect");

  pushOutboxToFirebase();

};

// ---- Split Payment Popup Modal (Both Sisters Vaheeda & Balkees) ----
let _splitPopupState = null;

window.openSplitAmountPopup = function(titleText, totalAmt, initVaheeda, initBalkees, onConfirm) {
  const tot = Math.max(0, Number(totalAmt) || 0);
  let vAmt = Number(initVaheeda) || 0;
  let bAmt = Number(initBalkees) || 0;
  if (vAmt + bAmt <= 0 && tot > 0) {
    vAmt = Math.round((tot / 2) * 100) / 100;
    bAmt = Math.max(0, Math.round((tot - vAmt) * 100) / 100);
  }
  _splitPopupState = {
    titleText: titleText || "👭 Split Amount Between Vaheeda & Balkees",
    totalAmt: tot,
    vAmt,
    bAmt,
    onConfirm,
    prevHtml: document.getElementById("modalRoot")?.innerHTML || ""
  };
  renderSplitAmountPopupDom();
};

function renderSplitAmountPopupDom() {
  if (!_splitPopupState) return;
  const st = _splitPopupState;
  const wallets = computeSisterCashWallets();
  const modalRoot = document.getElementById("modalRoot");
  modalRoot.innerHTML = `
    <div class="modal-backdrop" style="z-index:270;">
      <div class="modal-sheet" style="max-width:440px;">
        <div class="modal-head">
          <h3>${esc(st.titleText)}</h3>
          <button onclick="cancelSplitAmountPopup()" style="font-size:20px;">✕</button>
        </div>

        <div class="card" style="background:var(--accent-soft);margin-bottom:12px;padding:10px 12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:12px;font-weight:800;">Total Amount to Split:</span>
            <span style="font-size:17px;font-weight:900;color:var(--accent);">${money(st.totalAmt)}</span>
          </div>
          <div style="display:flex;gap:6px;margin-top:8px;">
            <button class="btn btn-soft btn-sm" style="flex:1;" onclick="setSplitPreset(0.5)">50% / 50% Equal</button>
            <button class="btn btn-outline btn-sm" onclick="setSplitPreset(1)">100% Vaheeda</button>
            <button class="btn btn-outline btn-sm" onclick="setSplitPreset(0)">100% Balkees</button>
          </div>
        </div>

        <div class="field">
          <label>🌷 Vaheeda Amount (Available Cash: ${money(wallets.vaheeda.availableCash)})</label>
          <input id="splitVahInput" type="number" inputmode="decimal" value="${st.vAmt}" oninput="onSplitInputChanged('vaheeda', this.value)">
        </div>

        <div class="field">
          <label>🌸 Balkees Amount (Available Cash: ${money(wallets.balkees.availableCash)})</label>
          <input id="splitBalInput" type="number" inputmode="decimal" value="${st.bAmt}" oninput="onSplitInputChanged('balkees', this.value)">
        </div>

        <div id="splitSumStatus" style="font-size:12.5px;font-weight:800;color:var(--green);margin-bottom:12px;">
          Sum: ${money(st.vAmt + st.bAmt)} (Vaheeda: ${money(st.vAmt)} + Balkees: ${money(st.bAmt)})
        </div>

        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline" onclick="cancelSplitAmountPopup()">Cancel</button>
          <button class="btn btn-primary" style="flex:1;" onclick="confirmSplitAmountPopup()">✓ Confirm Split</button>
        </div>
      </div>
    </div>
  `;
}

window.setSplitPreset = function(vahRatio) {
  if (!_splitPopupState) return;
  const tot = _splitPopupState.totalAmt || (Number(document.getElementById("splitVahInput")?.value || 0) + Number(document.getElementById("splitBalInput")?.value || 0));
  _splitPopupState.vAmt = Math.round(tot * vahRatio * 100) / 100;
  _splitPopupState.bAmt = Math.max(0, Math.round((tot - _splitPopupState.vAmt) * 100) / 100);
  renderSplitAmountPopupDom();
};

window.onSplitInputChanged = function(who, val) {
  if (!_splitPopupState) return;
  const num = Math.max(0, Number(val) || 0);
  const tot = _splitPopupState.totalAmt;
  if (who === "vaheeda") {
    _splitPopupState.vAmt = num;
    if (tot > 0) {
      _splitPopupState.bAmt = Math.max(0, Math.round((tot - num) * 100) / 100);
      const bEl = document.getElementById("splitBalInput");
      if (bEl) bEl.value = _splitPopupState.bAmt;
    }
  } else {
    _splitPopupState.bAmt = num;
    if (tot > 0) {
      _splitPopupState.vAmt = Math.max(0, Math.round((tot - num) * 100) / 100);
      const vEl = document.getElementById("splitVahInput");
      if (vEl) vEl.value = _splitPopupState.vAmt;
    }
  }
  const stEl = document.getElementById("splitSumStatus");
  if (stEl) {
    const sum = _splitPopupState.vAmt + _splitPopupState.bAmt;
    stEl.textContent = `Sum: ${money(sum)} (Vaheeda: ${money(_splitPopupState.vAmt)} + Balkees: ${money(_splitPopupState.bAmt)})`;
  }
};

window.cancelSplitAmountPopup = function() {
  const prev = _splitPopupState?.prevHtml || "";
  _splitPopupState = null;
  const modalRoot = document.getElementById("modalRoot");
  if (modalRoot) modalRoot.innerHTML = prev;
};

window.confirmSplitAmountPopup = function() {
  if (!_splitPopupState) return;
  const v = Math.max(0, Number(document.getElementById("splitVahInput")?.value) || 0);
  const b = Math.max(0, Number(document.getElementById("splitBalInput")?.value) || 0);
  if (v + b <= 0) return showToast("Enter split amounts for Vaheeda & Balkees");
  const cb = _splitPopupState.onConfirm;
  const prev = _splitPopupState.prevHtml || "";
  _splitPopupState = null;
  const modalRoot = document.getElementById("modalRoot");
  if (modalRoot) modalRoot.innerHTML = prev;
  if (typeof cb === "function") cb(v, b);
};

window.openProductModal = function(prodId = null) {
  editingProdId = prodId;
  const existing = prodId ? db.products.find((x) => x.id === prodId) : null;
  const baseId = existing ? existing.id : uid();
  window._draftProdBaseId = baseId;

  draftPhotos = [];
  _draftProdVariantStock = {};
  _draftProdVideoData = null;
  _draftProdVideoUrl = existing?.videoUrl || "";
  _draftProdVideoDeleted = false;

  if (existing) {
    if (existing.videoId) {
      const vIm = imgMap.get(existing.videoId);
      if (vIm && vIm.data) _draftProdVideoData = vIm.data;
    }
    const ids = Array.isArray(existing.photoIds) && existing.photoIds.length ? existing.photoIds : (existing.imgAt ? [existing.id] : []);
    const pColMap = (existing.photoColorMap && typeof existing.photoColorMap === "object") ? existing.photoColorMap : {};

      if (im && im.data) draftPhotos.push({ id: pid, data: im.data, color: pColMap[pid] || "" });

};

window.onProdVariantMatrixChanged = function(colName, szName, val) {
  const key = makeVariantKey(colName, szName);

  const sum = Object.values(_draftProdVariantStock).reduce((a, v) => a + (Number(v) || 0), 0);
  const totEl = document.getElementById("pTotalQtyBadge");
  if (totEl) totEl.textContent = `${sum} pcs`;
};

function mergeCsvTokensJs(...csvs) {
  const seen = new Set();
  const out = [];
  for (const csv of csvs) {
    for (const raw of String(csv || "").split(",")) {
      const tok = raw.trim();
      if (tok && !seen.has(tok.toLowerCase())) {
        seen.add(tok.toLowerCase());
        out.push(tok);
      }
    }
  }
  return out.join(", ");
}

function mergeVariantStockMapsJs(a, b) {
  const out = {};
  for (const [k, v] of Object.entries(a || {})) {
    const q = Math.max(0, Number(v) || 0);
    if (q > 0) out[k] = q;
  }
  for (const [k, v] of Object.entries(b || {})) {
    const q = Math.max(0, Number(v) || 0);
    const next = (out[k] || 0) + q;
    if (next > 0) out[k] = next;
  }
  return out;
}

window.saveProductFromModal = async function() {
  const name = (document.getElementById("pName")?.value || "").trim();
  if (!name) return showToast("Please enter an outfit name");
  const now = Date.now();
  const id = window._draftProdBaseId;
  const codeStr = (document.getElementById("pCode")?.value || "").trim();

  const existingById = db.products.find((x) => x.id === id);
  const existingByCode = (!existingById && codeStr)
    ? db.products.find((x) => String(x.code || "").trim().toLowerCase() === codeStr.toLowerCase())
    : null;

  if (draftPhotos.length > 0 && !existingByCode && draftPhotos[0].id !== id) {
    draftPhotos[0].id = id;
  }
  const photoIds = draftPhotos.map((x) => x.id);
  const photoColorMap = {};
  for (const ph of draftPhotos) {
    await putLocalImage(ph.id, ph.data, now, false);
    if (ph.color) photoColorMap[ph.id] = ph.color;
  }

  const variantStr = (document.getElementById("pVar")?.value || "").trim() || "Free Size";
  const colorStr = (document.getElementById("pCol")?.value || "").trim() || "As Shown";
  const sizes = variantStr.split(",").map((x) => x.trim()).filter(Boolean);
  const colors = colorStr.split(",").map((x) => x.trim()).filter(Boolean);

  const cleanVariantStock = {};
  let totalQty = 0;
  (colors.length ? colors : ["As Shown"]).forEach((cl) => {
    (sizes.length ? sizes : ["Free Size"]).forEach((sz) => {
      const k = makeVariantKey(cl, sz);
      const v = Math.max(0, Number(_draftProdVariantStock[k]) || 0);
      if (v > 0) cleanVariantStock[k] = v;
      totalQty += v;
    });
  });

  const parsedCost = Number(document.getElementById("pCost")?.value) || 0;
  const parsedPrice = Number(document.getElementById("pPrice")?.value) || 0;

  let targetId = id;
  if (existingByCode && !existingById) {
    // Same SKU/code entered as a new product -> consolidate into the existing product for that code
    const mergedSizes = mergeCsvTokensJs(existingByCode.variant, variantStr) || existingByCode.variant;
    const mergedColors = mergeCsvTokensJs(existingByCode.color, colorStr) || existingByCode.color;
    const mergedMatrix = mergeVariantStockMapsJs(existingByCode.variantStock, cleanVariantStock);
    const mergedQty = Object.values(mergedMatrix).reduce((a, v) => a + (Number(v) || 0), 0) || ((Number(existingByCode.qty) || 0) + totalQty);
    const mergedPhotos = [...new Set([...(existingByCode.photoIds || []), ...photoIds])];
    existingByCode.name = name || existingByCode.name;
    existingByCode.category = document.getElementById("pCat")?.value || existingByCode.category;
    existingByCode.variant = mergedSizes;
    existingByCode.color = mergedColors;
    if (parsedCost > 0) existingByCode.cost = parsedCost;
    if (parsedPrice > 0) existingByCode.price = parsedPrice;
    existingByCode.qty = mergedQty;
    existingByCode.variantStock = mergedMatrix;
    existingByCode.photoIds = mergedPhotos;
    existingByCode.photoColorMap = { ...(existingByCode.photoColorMap || {}), ...photoColorMap };
    if (mergedPhotos.length) existingByCode.imgAt = now;
    const videoUrl = (document.getElementById("pVideoUrl")?.value || _draftProdVideoUrl || "").trim();
    existingByCode.videoUrl = videoUrl;
    if (_draftProdVideoData) {
      const vId = `vid_${targetId}`;
      await putLocalImage(vId, _draftProdVideoData, now, false);
      existingByCode.videoId = vId;
    } else if (_draftProdVideoDeleted) {
      existingByCode.videoId = "";
    }
    existingByCode.updatedAt = nowIso();
    existingByCode._u = now;
    targetId = existingByCode.id;
  } else {
    const videoUrl = (document.getElementById("pVideoUrl")?.value || _draftProdVideoUrl || "").trim();
    let videoId = existingById?.videoId || "";
    if (_draftProdVideoData) {
      videoId = `vid_${id}`;
      await putLocalImage(videoId, _draftProdVideoData, now, false);
    } else if (_draftProdVideoDeleted) {
      videoId = "";
    }

    const item = {
      id,
      name,
      code: codeStr,
      category: document.getElementById("pCat")?.value || "Kurti",
      variant: variantStr,
      color: colorStr,
      videoUrl,
      videoId,
      cost: parsedCost,
      price: parsedPrice,
      qty: totalQty,
      low: 2,
      owner: document.getElementById("pOwner")?.value || "vaheeda",
      archived: Boolean(document.getElementById("pArchived")?.checked),
      variantStock: cleanVariantStock,
      photoColorMap,
      notes: "",
      imgAt: photoIds.length ? now : 0,
      photoIds,
      createdAt: existingById?.createdAt || nowIso(),
      updatedAt: nowIso(),
      _u: now
    };
    const idx = db.products.findIndex((x) => x.id === id);
    if (idx >= 0) db.products[idx] = item;
    else db.products.unshift(item);
  }

  saveLocalDb();
  outbox.add(`products/${targetId}`);
  saveOutbox();
  closeModal();
  renderApp();
  pushOutboxToFirebase();
  showToast(existingByCode && !existingById ? `Merged into code #${codeStr} ✨` : "Outfit & selling price saved ✨");
};

// ---- Delete Approval Workflow (Admin Approval or Admin PIN Required) ----
let _pendingDeleteTarget = null;

function executeApprovedDeletion(targetType, targetId) {
  const now = Date.now();
  if (targetType === "product") {
    db.products = db.products.filter((x) => x.id !== targetId);
    db.tombs.push({ c: "products", id: targetId, _u: now });
    outbox.add(`products/${targetId}`);
  } else if (targetType === "sale") {
    db.sales = db.sales.filter((x) => x.id !== targetId);
    db.tombs.push({ c: "sales", id: targetId, _u: now });
    outbox.add(`sales/${targetId}`);
  } else if (targetType === "purchase") {
    const pur = (db.purchases || []).find((x) => x.id === targetId);
    if (pur) {
      const effItems = getEffectivePurchaseItems(pur);
      effItems.forEach((item) => {
        const pIdx = db.products.findIndex((pr) => (item.productId && pr.id === item.productId) || (item.sku && String(pr.code || "").trim().toLowerCase() === String(item.sku).trim().toLowerCase()));
        if (pIdx >= 0) {
          const pr = db.products[pIdx];
          const revVarStock = { ...(pr.variantStock || {}) };
          if (item.variantStock && typeof item.variantStock === "object") {
            Object.entries(item.variantStock).forEach(([k, q]) => {
              const curQ = Number(revVarStock[k]) || 0;
              const nxtQ = curQ - Number(q || 0);
              if (nxtQ > 0) revVarStock[k] = nxtQ; else delete revVarStock[k];
            });
          }
          const itemPcs = Number(item.qty) || 1;
          const newQty = Math.max(0, (Number(pr.qty) || 0) - itemPcs);
          const finalQty = Object.keys(revVarStock).length > 0 ? Object.values(revVarStock).reduce((a, v) => a + (Number(v) || 0), 0) : newQty;
          pr.qty = finalQty;
          pr.variantStock = revVarStock;
          pr._u = now;
          outbox.add(`products/${pr.id}`);
        }
      });
    }
    db.purchases = (db.purchases || []).filter((x) => x.id !== targetId);
    db.tombs.push({ c: "purchases", id: targetId, _u: now });
    outbox.add(`purchases/${targetId}`);
  } else if (targetType === "expense") {
    db.expenses = db.expenses.filter((x) => x.id !== targetId);
    db.tombs.push({ c: "expenses", id: targetId, _u: now });
    outbox.add(`expenses/${targetId}`);
  }
  db.settings.pendingDeletes = (db.settings.pendingDeletes || []).filter(
    (r) => !(r.targetType === targetType && r.targetId === targetId)
  );
  db.settings._u = now;
  outbox.add("settings");
  saveLocalDb();
  saveOutbox();
  closeModal();
  renderApp();
  pushOutboxToFirebase();
}
