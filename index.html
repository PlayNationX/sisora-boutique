window.submitDeleteRequestForAdmin = function() {
  if (!_pendingDeleteTarget) return;
  const list = Array.isArray(db.settings.pendingDeletes) ? [...db.settings.pendingDeletes] : [];
  const filtered = list.filter((r) => !(r.targetType === _pendingDeleteTarget.targetType && r.targetId === _pendingDeleteTarget.targetId));
  filtered.unshift(_pendingDeleteTarget);
  db.settings.pendingDeletes = filtered;
  db.settings._u = Date.now();
  _pendingDeleteTarget = null;
  saveLocalDb();
  outbox.add("settings");
  saveOutbox();
  closeModal();
  renderApp();
  pushOutboxToFirebase();
  showToast("Delete request sent for Admin approval 🛡️");
};

window.confirmDeleteWithApproval = function() {
  if (!_pendingDeleteTarget) return;
  const isAdmin = currentAccount && currentAccount.isAdmin;
  if (!isAdmin) {
    const pin = (document.getElementById("delAdminPinInput")?.value || "").trim();
    const expectedAdminPin = String((db.settings.pins && db.settings.pins.admin) || "5603");
    if (pin !== expectedAdminPin) {
      return showToast("Invalid Admin PIN — or tap 'Send Delete Request to Admin'");
    }
  }
  const { targetType, targetId, targetLabel } = _pendingDeleteTarget;
  _pendingDeleteTarget = null;
  executeApprovedDeletion(targetType, targetId);
  showToast(`Deleted: ${targetLabel} ✓`);
};

window.approvePendingDeleteItem = function(reqId) {
  if (!currentAccount || !currentAccount.isAdmin) return showToast("Only Admin can approve delete requests");
  const list = Array.isArray(db.settings.pendingDeletes) ? db.settings.pendingDeletes : [];
  const req = list.find((r) => r.id === reqId);
  if (!req) return;
  executeApprovedDeletion(req.targetType, req.targetId);

};

window.rejectPendingDeleteItem = function(reqId) {
  const list = Array.isArray(db.settings.pendingDeletes) ? db.settings.pendingDeletes : [];

  showToast("Delete request dismissed — item kept 🛡️");

window.executeCustomerShare = async function(prodId, shareId, tempUrl) {
  const p = db.products.find((x) => x.id === prodId);
  if (!p) return;
  const expHours = Number(document.getElementById("shareExpHours")?.value) || 48;
  const now = Date.now();
  const payload = {
    shareId,
    productId: p.id,
    shopName: db.settings.shopName,
    name: p.name,
    code: p.code || "",
    category: p.category || "Kurti",
    price: money(p.price),
    rawPrice: p.price,
    availableSizes: p.variant || "Free Size",
    availableColors: p.color || "As Shown",
    inStock: (Number(p.qty) || 0) > 0,
    qty: Number(p.qty) || 0,
    notes: p.notes || "",
    photoIds: Array.isArray(p.photoIds) && p.photoIds.length ? p.photoIds : [p.id],
    createdAt: now,
    expiresAt: now + expHours * 3600000
  };

  showToast("Publishing temporary link…");
  try {
    await fbPut(`shops/${FIREBASE_CFG.shopId}/data/shares/${shareId}`, payload);
  } catch (e) {}

  const text = document.getElementById("sharePreviewBox")?.innerText || tempUrl;
  closeModal();

  if (navigator.share) {
    try {
      const files = [];
      for (const pid of payload.photoIds) {
        const im = imgMap.get(pid);
        if (im && im.data) {
          const res = await fetch(im.data);
          const blob = await res.blob();
          files.push(new File([blob], `${p.name.replace(/\W+/g, "_")}_${pid}.jpg`, { type: "image/jpeg" }));
        }
      }
      if (files.length > 0 && navigator.canShare && navigator.canShare({ files })) {
        await navigator.share({ title: p.name, text, files });
        return;
      }
      await navigator.share({ title: p.name, text, url: tempUrl });
      return;
    } catch (e) {}
  }
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
};

// ============================================================================
// Multi-Dress Purchase Invoice Modal:
// - Supports MULTIPLE dresses in a single purchase invoice (+ Add Another Dress)
// - Same SKU/Code items are consolidated as ONE item (auto-calculates total count
//   by adding quantities across all sizes & colours, e.g., 2 Blue M + 5 Green L + 3 Red M + 2 Red L = 12)
// - Unique Cost & Selling Price per code on purchase (Selling Price can be changed
//   individually later in Stock -> Edit anytime)
// ============================================================================
let _draftPurState = null;

function calcDraftDressItemQtyAndMatrix(dItem) {
  const sizeCols = String(dItem.sizes || "Free Size").split(",").map((x) => x.trim()).filter(Boolean);
  const colorRows = String(dItem.colors || "As Shown").split(",").map((x) => x.trim()).filter(Boolean);
  const sList = sizeCols.length ? sizeCols : ["Free Size"];
  const cList = colorRows.length ? colorRows : ["As Shown"];
  const activeMatrix = {};
  const breakdownParts = [];
  let sumQty = 0;
  cList.forEach((cl) => {
    sList.forEach((sz) => {
      const k = makeVariantKey(cl, sz);
      const q = Math.max(0, Number((dItem.variantStock || {})[k]) || 0);
      if (q > 0) {
        activeMatrix[k] = q;
        breakdownParts.push(`${q} ${cl} ${sz}`);
        sumQty += q;
      }
    });
  });
  return {
    sList,
    cList,
    activeMatrix,
    sumQty,
    breakdownText: breakdownParts.length ? `${breakdownParts.join(" + ")} = ${sumQty} pcs` : ""
  };
}

function consolidateDraftPurchaseItemsByCodeJs(items) {
  const byCode = new Map();
  const result = [];
  for (const raw of (items || [])) {
    const codeKey = String(raw.sku || "").trim().toUpperCase();
    const { activeMatrix, sumQty } = calcDraftDressItemQtyAndMatrix(raw);
    const normItem = {
      ...raw,
      sku: String(raw.sku || "").trim(),
      variantStock: activeMatrix,
      qty: sumQty
    };
    if (!codeKey) {
      result.push(normItem);
      continue;
    }
    const existingIdx = byCode.get(codeKey);
    if (existingIdx === undefined) {
      byCode.set(codeKey, result.length);
      result.push(normItem);
    } else {
      const prev = result[existingIdx];
      const mergedSizes = mergeCsvTokensJs(prev.sizes, normItem.sizes);
      const mergedColors = mergeCsvTokensJs(prev.colors, normItem.colors);
      const mergedStock = mergeVariantStockMapsJs(prev.variantStock, normItem.variantStock);
      const mergedQty = Object.values(mergedStock).reduce((a, v) => a + (Number(v) || 0), 0);
      const seenPhotoIds = new Set();
      const mergedPhotos = [];
      for (const ph of [...(prev.prodPhotos || []), ...(normItem.prodPhotos || [])]) {
        if (ph && ph.id && !seenPhotoIds.has(ph.id)) {
          seenPhotoIds.add(ph.id);
          mergedPhotos.push(ph);
        }
      }
      result[existingIdx] = {
        ...prev,
        productId: prev.productId || normItem.productId,
        productName: prev.productName || normItem.productName,
        category: normItem.category || prev.category,
        sizes: mergedSizes,
        colors: mergedColors,
        variantStock: mergedStock,
        qty: mergedQty,
        unitCost: Number(normItem.unitCost) > 0 ? normItem.unitCost : prev.unitCost,
        sellingPrice: Number(normItem.sellingPrice) > 0 ? normItem.sellingPrice : prev.sellingPrice,
        prodPhotos: mergedPhotos,
        isExpanded: true
      };
    }
  }
  return result;
}

window.openPurchaseModal = function(purId = null) {
  const existing = purId ? (db.purchases || []).find((x) => x.id === purId) : null;
  const baseId = existing ? existing.id : ("pur_" + uid());
  const invoices = [];
  if (existing && Array.isArray(existing.invoicePhotoIds)) {
    existing.invoicePhotoIds.forEach((iid) => {
      const im = imgMap.get(iid);
      if (im && im.data) invoices.push({ id: iid, data: im.data });
    });
  }

  let draftItems = [];
  if (existing) {
    const eff = getEffectivePurchaseItems(existing);
    draftItems = eff.map((it, idx) => {
      const pMap = (it.photoColorMap && typeof it.photoColorMap === "object") ? it.photoColorMap : (existing.photoColorMap || {});
      const pIds = Array.isArray(it.photoIds) ? it.photoIds : [];
      const itemPhotos = [];
      pIds.forEach((pid) => {
        const im = imgMap.get(pid);
        if (im && im.data) itemPhotos.push({ id: pid, data: im.data, color: pMap[pid] || "" });
      });
      return {
        id: it.id || uid(),
        productId: it.productId || "",
        productName: it.productName || "",
        sku: it.sku || "",
        category: it.category || "Kurti",
        sizes: it.sizes || "M, L",
        colors: it.colors || "Red, Green, Blue",
        variantStock: (it.variantStock && typeof it.variantStock === "object") ? { ...it.variantStock } : {},
        unitCost: it.unitCost || "",
        sellingPrice: it.sellingPrice || "",
        prodPhotos: itemPhotos,
        isExpanded: idx === 0 || eff.length <= 2
      };
    });
  } else {
    draftItems = [{
      id: uid(),
      productId: "",
      productName: "",
      sku: "",
      category: (db.settings.categories && db.settings.categories[0]) || "Kurti",
      sizes: "M, L",
      colors: "Red, Green, Blue",
      variantStock: {},
      unitCost: "",
      sellingPrice: "",
      prodPhotos: [],
      isExpanded: true
    }];
  }

  _draftPurState = {
    isEdit: Boolean(existing),
    id: baseId,
    items: draftItems,
    paidBy: existing?.paidBy || (currentAccount?.id === "balkees" ? "balkees" : "vaheeda"),
    vaheedaPaid: existing?.vaheedaPaid || 0,
    balkeesPaid: existing?.balkeesPaid || 0,
    supplier: existing?.supplier || "",
    invoiceNo: existing?.invoiceNo || "",
    totalAmount: existing?.totalAmount ?? existing?.amount ?? "",
    amountManual: Boolean(existing),
    fundingSource: existing?.fundingSource || "available_cash",
    method: existing?.method || "UPI / GPay",
    date: existing?.date || todayIso(),
    notes: existing?.notes || "",
    invoices
  };
  renderPurchaseModalDom();
};

function recalcPurchaseQtyAndTotalInDom(skipDomWrite = false) {
  if (!_draftPurState) return;
  let grandPcs = 0;
  let grandCost = 0;
  (_draftPurState.items || []).forEach((dItem, dIdx) => {
    const { sumQty, breakdownText } = calcDraftDressItemQtyAndMatrix(dItem);
    const uc = Number(document.getElementById(`purUnitCost_${dIdx}`)?.value ?? dItem.unitCost) || 0;
    const lineCost = Math.round(sumQty * uc * 100) / 100;
    grandPcs += sumQty;
    grandCost += lineCost;
    if (!skipDomWrite) {
      const badge = document.getElementById(`purMatrixTotalBadge_${dIdx}`);
      if (badge) badge.textContent = `Auto Count: ${sumQty} pcs`;
      const fBox = document.getElementById(`purMatrixFormula_${dIdx}`);
      if (fBox) fBox.textContent = breakdownText ? `🧮 ${breakdownText}` : "Enter quantities in the Colour × Size cells below";
      const hdrSub = document.getElementById(`purDressHdrSub_${dIdx}`);
      if (hdrSub) hdrSub.textContent = `Auto Count: ${sumQty} pcs · Line Cost: ${money(lineCost)}`;
    }
  });
  grandCost = Math.round(grandCost * 100) / 100;
  if (grandCost > 0) {
    _draftPurState.totalAmount = grandCost;
    if (!skipDomWrite) {
      const amtEl = document.getElementById("purAmt");
      if (amtEl) amtEl.value = grandCost;
    }
  }
  if (!skipDomWrite) {
    const sumBanner = document.getElementById("purInvoiceTopSummary");
    if (sumBanner) {
      sumBanner.textContent = `${_draftPurState.items.length} Dress Entry(s) · Auto Total Count: ${grandPcs} pcs`;
    }
  }
}

                      ${breakdownText ? `🧮 ${esc(breakdownText)}` : "Enter quantities in the Colour × Size cells below (auto-sums total count)"}

                    <div style="overflow-x:auto;">
                      <table style="width:100%;border-collapse:collapse;font-size:12px;">
                        <thead>
                          <tr>
                            <th style="text-align:left;padding:5px;border-bottom:1px solid var(--line);">Colour \\ Size</th>
                            ${sList.map((sz) => `<th style="text-align:center;padding:5px;border-bottom:1px solid var(--line);">📏 ${esc(sz)}</th>`).join("")}
                          </tr>
                        </thead>
                        <tbody>
                          ${cList.map((cl) => `
                            <tr>
                              <td style="padding:5px;font-weight:800;border-bottom:1px solid var(--line);">🎨 ${esc(cl)}</td>
                              ${sList.map((sz) => {
                                const k = makeVariantKey(cl, sz);
                                const v = Math.max(0, Number(dItem.variantStock[k]) || 0);
                                return `
                                  <td style="padding:4px;text-align:center;border-bottom:1px solid var(--line);">

                                  </td>
                                `;
                              }).join("")}
                            </tr>
                          `).join("")}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <!-- 7. Unique Cost & 8. Unique Selling Price -->
                  <div class="field-row">
                    <div class="field">
                      <label>7. Unique Cost / pc (₹) *</label>
                      <input id="purUnitCost_${dIdx}" type="number" inputmode="decimal" value="${dItem.unitCost}" placeholder="0" oninput="onPurUnitCostChanged(${dIdx}, this.value)">
                    </div>
                    <div class="field">
                      <label>8. Selling Price / pc (₹) *</label>
                      <input id="purSellPrice_${dIdx}" type="number" inputmode="decimal" value="${dItem.sellingPrice}" placeholder="0" oninput="onPurSellPriceChanged(${dIdx}, this.value)">
                    </div>
                  </div>
                  <div style="font-size:11px;color:var(--muted);">
                    💡 Cost & Selling Price are unique per SKU/code on purchase. You can change Selling Price individually later in Stock → Edit anytime.
                  </div>
                </div>
              ` : ""}
            </div>
          `;
        }).join("")}

        <button type="button" class="btn btn-gold" style="width:100%;margin-bottom:12px;" onclick="addAnotherDressToPurchaseModal()">
          ＋ Add Another Dress to this Purchase Invoice
        </button>

        <!-- 9. Owner / Paid By (Vaheeda / Balkees / Split) -->
        <div class="field">
          <label>9. Owner / Paid By (Vaheeda / Balkees / Split)</label>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
            <button type="button" class="btn btn-sm ${st.paidBy === 'vaheeda' ? 'btn-primary' : 'btn-outline'}" onclick="selectPurchasePaidBy('vaheeda')">🌷 Vaheeda</button>
            <button type="button" class="btn btn-sm ${st.paidBy === 'balkees' ? 'btn-primary' : 'btn-outline'}" onclick="selectPurchasePaidBy('balkees')">🌸 Balkees</button>

            <div style="margin-top:6px;padding:8px 10px;background:var(--bg);border-radius:10px;display:flex;justify-content:space-between;align-items:center;font-size:12px;">
              <span>🌷 Vaheeda: <b>${money(st.vaheedaPaid)}</b> · 🌸 Balkees: <b>${money(st.balkeesPaid)}</b></span>
              <button type="button" class="btn btn-soft btn-sm" onclick="selectPurchasePaidBy('split')">✏️ Edit Split</button>
            </div>
          ` : ""}
        </div>

        <div class="field-row">
          <div class="field">
            <label>Grand Total Purchase Bill (₹) *</label>
            <input id="purAmt" type="number" inputmode="decimal" value="${st.totalAmount || grandAutoBill || ''}" placeholder="Auto-summed from all dresses">
          </div>
          <div class="field">
            <label>💎 Funding Source</label>
            <select id="purFundSrc">
              <option value="available_cash" ${st.fundingSource === 'available_cash' ? 'selected' : ''}>💰 Sales Cash Wallet</option>
              <option value="new_investment" ${st.fundingSource === 'new_investment' ? 'selected' : ''}>💎 New Investment</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Supplier / Wholesaler</label>
            <input id="purSupplier" value="${esc(st.supplier)}" placeholder="e.g. Surat Textile Hub">
          </div>
          <div class="field">
            <label>Invoice / Bill No.</label>
            <input id="purInvNo" value="${esc(st.invoiceNo)}" placeholder="e.g. INV-204">
          </div>
        </div>

        <!-- Invoice Upload -->
        <div class="field">
          <label>🧾 Upload Supplier Invoice / Bill Photos (${st.invoices.length})</label>
          <div style="display:flex;gap:8px;overflow-x:auto;align-items:center;padding-bottom:4px;">
            <label class="btn btn-soft btn-sm" style="height:64px;min-width:88px;flex-direction:column;">
              <span>📸 Upload Bill</span>
              <input type="file" accept="image/*" multiple style="display:none;" onchange="handlePurchaseInvoiceFiles(this.files)">
            </label>
            ${st.invoices.map((inv, idx) => `
              <div style="position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1.5px solid var(--accent);flex-shrink:0;">
                <img src="${inv.data}" style="width:100%;height:100%;object-fit:cover;" onclick="openLightbox(['${inv.data}'], 0)">
                <button type="button" onclick="cropPurchaseInvoiceAtIndex(${idx})" style="position:absolute;bottom:2px;left:2px;background:rgba(200,95,131,0.9);color:#fff;font-size:9px;padding:1px 4px;border-radius:4px;">✂️</button>
                <button type="button" onclick="removePurchaseInvoiceAtIndex(${idx})" style="position:absolute;top:2px;right:2px;background:rgba(180,30,50,0.9);color:#fff;width:16px;height:16px;border-radius:50%;font-size:9px;">✕</button>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Payment Mode</label>
            <select id="purMethod">
              ${(db.settings.payMethods || DEFAULT_SETTINGS.payMethods).map((m) => `<option value="${esc(m)}" ${st.method === m ? 'selected' : ''}>${esc(m)}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label>Date</label>
            <input id="purDate" type="date" value="${esc(st.date)}">
          </div>
        </div>

        <div style="display:flex;gap:8px;margin-top:12px;">
          ${st.isEdit ? `<button type="button" class="btn btn-danger" onclick="deletePurchaseItem('${st.id}')">🗑️ Delete Purchase Invoice</button>` : ""}
          <button class="btn btn-primary" style="flex:1;" onclick="savePurchaseFromModal()">💾 ${st.isEdit ? "Update" : "Save"} Purchase Invoice & Sync Stock</button>
        </div>
      </div>
    </div>
  `;
}

window.selectPurchasePaidBy = function(mode) {
  syncDraftPurFieldsFromDom();
  if (!_draftPurState) return;
  if (mode === "split") {
    const tot = Number(_draftPurState.totalAmount) || 0;
    openSplitAmountPopup(
      "👭 Split Purchase Between Vaheeda & Balkees",
      tot,
      _draftPurState.vaheedaPaid,
      _draftPurState.balkeesPaid,
      (vAmt, bAmt) => {
        _draftPurState.paidBy = "split";
        _draftPurState.vaheedaPaid = vAmt;
        _draftPurState.balkeesPaid = bAmt;
        if (!Number(_draftPurState.totalAmount)) _draftPurState.totalAmount = vAmt + bAmt;
        renderPurchaseModalDom();
      }
    );
  } else {
    _draftPurState.paidBy = mode;
    renderPurchaseModalDom();
  }
};

window.handlePurchaseInvoiceFiles = async function(fileList) {
  if (!fileList || !fileList.length || !_draftPurState) return;
  syncDraftPurFieldsFromDom();
  for (const file of Array.from(fileList)) {
    const dataUrl = await compressImageFile(file, 1080, 0.85);
    const invId = `inv_${_draftPurState.id}_${uid().slice(-4)}`;
    _draftPurState.invoices.push({ id: invId, data: dataUrl });
  }
  renderPurchaseModalDom();
  showToast("Invoice photo added 🧾");
};

window.cropPurchaseInvoiceAtIndex = function(idx) {
  if (!_draftPurState || !_draftPurState.invoices[idx]) return;
  syncDraftPurFieldsFromDom();
  const inv = _draftPurState.invoices[idx];
  openCropRotateModal(inv.data, "free", (croppedUrl) => {
    _draftPurState.invoices[idx].data = croppedUrl;
    renderPurchaseModalDom();
  }, "✂️ Crop & Rotate Invoice");
};

window.removePurchaseInvoiceAtIndex = function(idx) {
  if (!_draftPurState) return;
  syncDraftPurFieldsFromDom();
  _draftPurState.invoices.splice(idx, 1);
  renderPurchaseModalDom();
};

window.savePurchaseFromModal = async function() {
  syncDraftPurFieldsFromDom();
  const st = _draftPurState;
  if (!st) return;

  const validDrafts = (st.items || []).filter((it) => String(it.productName || "").trim() || String(it.sku || "").trim());
  if (!validDrafts.length) return showToast("Please enter at least 1 Dress Name or SKU/Code");

  // Consolidate same-code items within the invoice into a single item per code
  const consolidated = consolidateDraftPurchaseItemsByCodeJs(validDrafts);
  for (const cItem of consolidated) {
    if ((Number(cItem.qty) || 0) <= 0) {
      return showToast(`Please enter colour/size quantities (> 0) for ${cItem.productName || '#' + cItem.sku}`);
    }
  }

  const totalPurchasedQty = consolidated.reduce((a, it) => a + (Number(it.qty) || 0), 0);
  const autoSumBill = Math.round(consolidated.reduce((a, it) => a + (Number(it.qty) || 0) * (Number(it.unitCost) || 0), 0) * 100) / 100;
  const totalAmount = Math.max(0, Number(st.totalAmount) || autoSumBill);
  if (totalAmount <= 0) return showToast("Please enter Unit Cost or Grand Total Purchase Bill Amount");

  const now = Date.now();
  const invoicePhotoIds = st.invoices.map((x) => x.id);
  for (const inv of st.invoices) {
    await putLocalImage(inv.id, inv.data, now, false);
  }

  let vPaid = 0, bPaid = 0;
  if (st.paidBy === "split") {
    vPaid = Number(st.vaheedaPaid) || (totalAmount / 2);
    bPaid = Number(st.balkeesPaid) || (totalAmount - vPaid);
  } else if (st.paidBy === "balkees") {
    bPaid = totalAmount;
  } else {
    vPaid = totalAmount;
  }

  // If editing an existing purchase, reverse its previous quantities first
  const existing = (db.purchases || []).find((x) => x.id === st.id);
  if (existing) {
    for (const oldItem of getEffectivePurchaseItems(existing)) {
      const oldProd = oldItem.productId
        ? db.products.find((p) => p.id === oldItem.productId)
        : (oldItem.sku ? db.products.find((p) => String(p.code || "").trim().toLowerCase() === String(oldItem.sku).trim().toLowerCase()) : (existing.productId ? db.products.find((p) => p.id === existing.productId) : null));
      if (oldProd) {
        const revMatrix = { ...(oldProd.variantStock || {}) };
        for (const [k, q] of Object.entries(oldItem.variantStock || {})) {
          const nextQ = (Number(revMatrix[k]) || 0) - (Number(q) || 0);
          if (nextQ > 0) revMatrix[k] = nextQ;
          else delete revMatrix[k];
        }
        oldProd.variantStock = revMatrix;
        oldProd.qty = Object.keys(revMatrix).length > 0
          ? Object.values(revMatrix).reduce((a, v) => a + (Number(v) || 0), 0)
          : Math.max(0, (Number(oldProd.qty) || 0) - (Number(oldItem.qty) || 0));
        oldProd._u = now;
        oldProd.updatedAt = nowIso();
        outbox.add(`products/${oldProd.id}`);
      }
    }
  }

  const savedItems = [];
  for (const cItem of consolidated) {
    const cleanName = String(cItem.productName || "").trim() || `Dress #${cItem.sku}`;
    const cleanSku = String(cItem.sku || "").trim();
    const itemCost = Math.max(0, Number(cItem.unitCost) || 0) || Math.round((totalAmount / Math.max(1, totalPurchasedQty)) * 100) / 100;
    const itemSell = Math.max(0, Number(cItem.sellingPrice) || 0) || itemCost;

    const itemPhotoIds = [];
    const itemPhotoColorMap = {};
    for (const ph of (cItem.prodPhotos || [])) {
      await putLocalImage(ph.id, ph.data, now, false);
      itemPhotoIds.push(ph.id);
      if (ph.color) itemPhotoColorMap[ph.id] = ph.color;
    }

    // Match existing product in stock: check linked productId first, then SKU, then Name
    let targetProd = cItem.productId ? db.products.find((p) => p.id === cItem.productId) : null;
    if (!targetProd && cleanSku) {
      targetProd = db.products.find((p) => String(p.code || "").trim().toLowerCase() === cleanSku.toLowerCase());
    }
    if (!targetProd && cleanName) {
      targetProd = db.products.find((p) => String(p.name || "").trim().toLowerCase() === cleanName.toLowerCase());
    }

    if (targetProd) {
      const mergedMatrix = mergeVariantStockMapsJs(targetProd.variantStock, cItem.variantStock);
      targetProd.name = cleanName || targetProd.name;
      if (cleanSku) targetProd.code = cleanSku;
      if (cItem.category) targetProd.category = cItem.category;
      targetProd.price = itemSell; // Always sync updated selling price to product so catalogue reflects immediately
      if (itemCost > 0) targetProd.cost = itemCost;
      targetProd.owner = st.paidBy || targetProd.owner;
      targetProd.variantStock = mergedMatrix;
      targetProd.qty = Object.keys(mergedMatrix).length > 0
        ? Object.values(mergedMatrix).reduce((a, v) => a + (Number(v) || 0), 0)
        : Math.max(0, (Number(targetProd.qty) || 0) + (Number(cItem.qty) || 0));

      // Recompute active colors and sizes so deleted variants are cleanly removed from catalogue filters
      const activeColors = Object.keys(mergedMatrix).map((k) => k.split("|")[0].trim()).filter(Boolean);
      const parsedColors = String(cItem.colors || "").split(",").map((x) => x.trim()).filter(Boolean);
      const finalColors = [...new Set([...activeColors, ...parsedColors])].filter(Boolean);
      targetProd.color = finalColors.length ? finalColors.join(", ") : (cItem.colors || targetProd.color || "As Shown");

      const activeSizes = Object.keys(mergedMatrix).map((k) => k.split("|")[1]?.trim()).filter(Boolean);
      const parsedSizes = String(cItem.sizes || "").split(",").map((x) => x.trim()).filter(Boolean);
      const finalSizes = [...new Set([...activeSizes, ...parsedSizes])].filter(Boolean);
      targetProd.variant = finalSizes.length ? finalSizes.join(", ") : (cItem.sizes || targetProd.variant || "Free Size");

      if (itemPhotoIds.length > 0) {
        const existingIds = Array.isArray(targetProd.photoIds) ? targetProd.photoIds : [];
        targetProd.photoIds = [...new Set([...existingIds, ...itemPhotoIds])];
        targetProd.photoColorMap = { ...(targetProd.photoColorMap || {}), ...itemPhotoColorMap };
        targetProd.imgAt = now;
      }
      targetProd.updatedAt = nowIso();
      targetProd._u = now;
      outbox.add(`products/${targetProd.id}`);
    } else {
      const newProdId = uid();
      if (itemPhotoIds.length > 0 && cItem.prodPhotos && cItem.prodPhotos[0]) {
        await putLocalImage(newProdId, cItem.prodPhotos[0].data, now, false);
        if (cItem.prodPhotos[0].color) itemPhotoColorMap[newProdId] = cItem.prodPhotos[0].color;
        itemPhotoIds[0] = newProdId;
      }
      targetProd = {
        id: newProdId,
        name: cleanName,
        code: cleanSku,
        category: cItem.category || "Kurti",
        variant: cItem.sizes || "Free Size",
        color: cItem.colors || "As Shown",
        cost: itemCost,
        price: itemSell,
        qty: cItem.qty,
        low: 2,
        owner: st.paidBy || "vaheeda",
        archived: false,
        videoUrl: "",
        videoId: "",
        variantStock: cItem.variantStock,
        photoColorMap: itemPhotoColorMap,
        notes: "",
        imgAt: itemPhotoIds.length ? now : 0,
        photoIds: itemPhotoIds,
        createdAt: nowIso(),
        updatedAt: nowIso(),
        _u: now
      };
      db.products.unshift(targetProd);
      outbox.add(`products/${targetProd.id}`);
    }

    savedItems.push({
      id: cItem.id || uid(),
      productId: targetProd.id,
      productName: targetProd.name,
      sku: targetProd.code || cleanSku,
      category: targetProd.category || "Kurti",
      sizes: cItem.sizes || "",
      colors: cItem.colors || "",
      variantStock: cItem.variantStock,
      photoIds: itemPhotoIds,
      photoColorMap: itemPhotoColorMap,
      qty: cItem.qty,
      unitCost: itemCost,
      sellingPrice: itemSell
    });
  }

  const first = savedItems[0];
  const summaryTitle = savedItems.length > 1
    ? `${first.productName} + ${savedItems.length - 1} more`
    : first.productName;
  const allSkus = [...new Set(savedItems.map((it) => it.sku).filter(Boolean))].join(", ");
  const allPhotoIds = [...new Set(savedItems.flatMap((it) => it.photoIds || []))];
  const allPhotoColorMap = Object.assign({}, ...savedItems.map((it) => it.photoColorMap || {}));

  const record = {
    id: st.id,
    supplier: (st.supplier || "").trim() || "Wholesale Supplier",
    invoiceNo: (st.invoiceNo || "").trim(),
    title: summaryTitle,
    productId: first.productId,
    productName: summaryTitle,
    sku: allSkus,
    category: first.category || "Kurti",
    sizes: first.sizes || "",
    colors: first.colors || "",
    variantStock: first.variantStock || {},
    photoIds: allPhotoIds,
    photoColorMap: allPhotoColorMap,
    itemsSummary: `${summaryTitle}${allSkus ? " (#" + allSkus + ")" : ""}`,
    qty: totalPurchasedQty,
    unitCost: first.unitCost,
    sellingPrice: first.sellingPrice,
    amount: totalAmount,
    totalAmount,
    paidBy: st.paidBy,
    vaheedaPaid: vPaid,
    balkeesPaid: bPaid,
    fundingSource: st.fundingSource || "available_cash",
    method: st.method || "UPI / GPay",
    date: st.date || todayIso(),
    notes: st.notes || "",
    items: savedItems,
    invoicePhotoIds,
    returns: existing?.returns || [],
    createdAt: existing?.createdAt || nowIso(),
    _u: now
  };

  const idx = db.purchases.findIndex((x) => x.id === st.id);
  if (idx >= 0) db.purchases[idx] = record;
  else db.purchases.unshift(record);

  _draftPurState = null;
  saveLocalDb();
  outbox.add(`purchases/${record.id}`);
  saveOutbox();
  closeModal();
  renderApp();
  await pushOutboxToFirebase();
  showToast(`Purchase invoice (${savedItems.length} dress code(s), ${totalPurchasedQty} pcs) saved 📦✨`);
};

window.savePurchaseReturnFromModal = async function() {
  if (!_purReturnState) return;
  const pur = (db.purchases || []).find((x) => x.id === _purReturnState.purId);
  if (!pur) return;
  const effItems = getEffectivePurchaseItems(pur);
  const selItem = effItems[_purReturnState.itemIdx] || effItems[0] || {};
  const qty = Math.max(1, Number(document.getElementById("prQty")?.value) || 1);
  const returnAmount = Math.max(0, Number(document.getElementById("prAmt")?.value) || 0);
  if (returnAmount <= 0) return showToast("Enter return amount");
  const mode = document.getElementById("prCashMode")?.value || _purReturnState.cashFlowMode;
  const deduct = Boolean(document.getElementById("prDeduct")?.checked);
  const reason = (document.getElementById("prReason")?.value || "").trim();
  const variantKey = _purReturnState.variantKey || "";
  const now = Date.now();

  let vRef = 0, bRef = 0;
  if (mode === "cash_refund_split") {
    vRef = _purReturnState.vaheedaRefund || (returnAmount / 2);
    bRef = _purReturnState.balkeesRefund || (returnAmount - vRef);
  } else if (mode === "cash_refund_vaheeda") vRef = returnAmount;
  else if (mode === "cash_refund_balkees") bRef = returnAmount;

  // Deduct stock if requested
  let targetProd = selItem.productId ? db.products.find((p) => p.id === selItem.productId) : null;
  if (!targetProd && selItem.sku) {
    targetProd = db.products.find((p) => String(p.code || "").trim().toLowerCase() === String(selItem.sku).trim().toLowerCase());
  }
  if (!targetProd && pur.productId) {
    targetProd = db.products.find((p) => p.id === pur.productId);
  }

  const deductedVariants = {};
  if (deduct && targetProd) {
    targetProd.variantStock = { ...(targetProd.variantStock || {}) };
    if (variantKey && targetProd.variantStock[variantKey] !== undefined) {
      const curQ = Number(targetProd.variantStock[variantKey]) || 0;
      const take = Math.min(curQ, qty);
      if (curQ - take > 0) targetProd.variantStock[variantKey] = curQ - take;
      else delete targetProd.variantStock[variantKey];
      deductedVariants[variantKey] = take;
    } else if (Object.keys(targetProd.variantStock).length > 0) {
      let rem = qty;
      for (const [vk, curQ] of Object.entries(targetProd.variantStock)) {
        if (rem <= 0) break;
        const take = Math.min(Number(curQ) || 0, rem);
        if (take > 0) {
          const next = (Number(curQ) || 0) - take;
          if (next > 0) targetProd.variantStock[vk] = next;
          else delete targetProd.variantStock[vk];
          deductedVariants[vk] = take;
          rem -= take;
        }
      }
    }
    targetProd.qty = Object.keys(targetProd.variantStock).length > 0
      ? Object.values(targetProd.variantStock).reduce((a, v) => a + (Number(v) || 0), 0)
      : Math.max(0, (Number(targetProd.qty) || 0) - qty);

    targetProd._u = now;
    targetProd.updatedAt = nowIso();
    outbox.add(`products/${targetProd.id}`);
  }

  if (!Array.isArray(pur.returns)) pur.returns = [];
  pur.returns.push({
    id: uid(),
    date: todayIso(),
    qty,
    returnAmount,
    deductStock: deduct,
    cashFlowMode: mode,
    vaheedaRefund: vRef,
    balkeesRefund: bRef,
    reason,
    productId: targetProd?.id || selItem.productId || "",
    productName: targetProd?.name || selItem.productName || "",
    sku: targetProd?.code || selItem.sku || "",
    variantKey,
    deductedVariants
  });
  pur._u = now;
  outbox.add(`purchases/${pur.id}`);

  _purReturnState = null;
  saveLocalDb();
  saveOutbox();
  closeModal();
  renderApp();
  await pushOutboxToFirebase();
  showToast("Purchase return recorded & live stock updated ↩️");
};

window.undoPurchaseReturn = async function(purId, returnId) {
  const pur = (db.purchases || []).find((x) => x.id === purId);
  if (!pur || !Array.isArray(pur.returns)) return;
  const retIdx = pur.returns.findIndex((r) => r.id === returnId);
  if (retIdx < 0) return;
  const ret = pur.returns[retIdx];
  const now = Date.now();

  // Restore deducted stock if return had deducted stock
  if (ret.deductStock) {
    let targetProd = ret.productId ? db.products.find((p) => p.id === ret.productId) : null;
    if (!targetProd && ret.sku) {
      targetProd = db.products.find((p) => String(p.code || "").trim().toLowerCase() === String(ret.sku).trim().toLowerCase());
    }
    if (!targetProd && pur.productId) {
      targetProd = db.products.find((p) => p.id === pur.productId);
    }
    if (targetProd) {
      targetProd.variantStock = { ...(targetProd.variantStock || {}) };
      if (ret.deductedVariants && Object.keys(ret.deductedVariants).length > 0) {
        for (const [vk, q] of Object.entries(ret.deductedVariants)) {
          targetProd.variantStock[vk] = (Number(targetProd.variantStock[vk]) || 0) + (Number(q) || 0);
        }
      } else if (ret.variantKey) {
        targetProd.variantStock[ret.variantKey] = (Number(targetProd.variantStock[ret.variantKey]) || 0) + (Number(ret.qty) || 0);
      }
      targetProd.qty = Object.keys(targetProd.variantStock).length > 0
        ? Object.values(targetProd.variantStock).reduce((a, v) => a + (Number(v) || 0), 0)
        : ((Number(targetProd.qty) || 0) + (Number(ret.qty) || 0));
      targetProd._u = now;
      targetProd.updatedAt = nowIso();
      outbox.add(`products/${targetProd.id}`);
    }
  }

  pur.returns.splice(retIdx, 1);
  pur._u = now;
  outbox.add(`purchases/${pur.id}`);
  saveLocalDb();
  saveOutbox();
  renderApp();
  await pushOutboxToFirebase();
  showToast("Purchase return undone & stock restored ↩️✓");
};

            <label>Payment Method</label>
            <select id="recPayMethod">
              ${(db.settings.payMethods || DEFAULT_SETTINGS.payMethods).map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="field">
          <label>👭 Who Got the Payment?</label>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
            <button class="btn btn-primary btn-sm" onclick="confirmReceiveSalePayment('${s.id}', 'vaheeda')">🌷 Vaheeda</button>
            <button class="btn btn-primary btn-sm" onclick="confirmReceiveSalePayment('${s.id}', 'balkees')">🌸 Balkees</button>
            <button class="btn btn-gold btn-sm" onclick="confirmReceiveSalePayment('${s.id}', 'split')">👭 Split Popup</button>
          </div>
        </div>
      </div>
    </div>
  `;
};

window.confirmReceiveSalePayment = function(saleId, recBy) {
  const s = db.sales.find((x) => x.id === saleId);
  if (!s) return;
  const amt = Math.max(0, Number(document.getElementById("recPayAmt")?.value) || 0);
  const method = document.getElementById("recPayMethod")?.value || "UPI / GPay";
  if (amt <= 0) return showToast("Enter amount");

  const finalize = (vAmt, bAmt) => {
    if (!Array.isArray(s.pays)) s.pays = [];
    s.pays.push({
      id: uid(),
      date: todayIso(),
      amount: amt,
      method,
      receivedBy: recBy,
      vaheedaAmount: vAmt,
      balkeesAmount: bAmt,
      note: ""
    });
    s._u = Date.now();
    saveLocalDb();
    outbox.add(`sales/${s.id}`);
    saveOutbox();
    closeModal();
    renderApp();
    pushOutboxToFirebase();
    showToast("Payment recorded ✓");
  };

  if (recBy === "split") {
    openSplitAmountPopup("👭 Split Received Payment (Vaheeda & Balkees)", amt, amt / 2, amt / 2, (v, b) => finalize(v, b));
  } else if (recBy === "balkees") {
    finalize(0, amt);
  } else {
    finalize(amt, 0);
  }
};

// ---- Sales Return Modal with Cash Flow Options ----
let _salesReturnState = null;

window.openSalesReturnModal = function(saleId) {
  const s = db.sales.find((x) => x.id === saleId);
  if (!s) return;
  _salesReturnState = {
    saleId,
    restock: 1,
    refund: s.price || s.total || 0,
    cashFlowMode: s.seller === "balkees" ? "refund_by_balkees" : "refund_by_vaheeda",
    vaheedaRefund: 0,
    balkeesRefund: 0,
    reason: ""
  };
  renderSalesReturnModalDom();
};

function renderSalesReturnModalDom() {
  if (!_salesReturnState) return;
  const st = _salesReturnState;
  const s = db.sales.find((x) => x.id === st.saleId);
  if (!s) return;
  const modalRoot = document.getElementById("modalRoot");
  modalRoot.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal-sheet">
        <div class="modal-head">
          <h3>↩️ Sales Return & Cash Flow</h3>
          <button onclick="closeModal()" style="font-size:20px;">✕</button>
        </div>
        <div class="card" style="background:var(--bg);margin-bottom:10px;font-size:12.5px;">
          <b>${esc(s.productName)} × ${s.qty}</b> · Customer: <b>${esc(s.customer || "Walk-in")}</b> · Sale Total: <b>${money(s.total)}</b>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Restock Qty to Inventory</label>
            <input id="srRestock" type="number" min="0" value="${st.restock}">
          </div>
          <div class="field">
            <label>Refund / Return Amount (₹) *</label>
            <input id="srRefund" type="number" inputmode="decimal" value="${st.refund}">
          </div>
        </div>
        <div class="field">
          <label>💰 Cash Flow Option (Who refunded the customer?)</label>
          <select id="srCashMode" onchange="onSalesReturnCashModeChange(this.value)">
            <option value="refund_by_vaheeda" ${st.cashFlowMode === 'refund_by_vaheeda' ? 'selected' : ''}>🌷 Refunded from Vaheeda's Available Cash (−Vaheeda Cash)</option>
            <option value="refund_by_balkees" ${st.cashFlowMode === 'refund_by_balkees' ? 'selected' : ''}>🌸 Refunded from Balkees's Available Cash (−Balkees Cash)</option>
            <option value="refund_split" ${st.cashFlowMode === 'refund_split' ? 'selected' : ''}>👭 Split Refund by Both Sisters (Popup)</option>
            <option value="store_credit" ${st.cashFlowMode === 'store_credit' ? 'selected' : ''}>🏷️ Exchange / Store Credit / Unpaid Adjust (No Cash Out)</option>
          </select>
          ${st.cashFlowMode === "refund_split" ? `
            <div style="margin-top:6px;font-size:12px;color:var(--accent);font-weight:700;">
              Split Refund: Vaheeda ${money(st.vaheedaRefund)} · Balkees ${money(st.balkeesRefund)}
              <button class="btn btn-soft btn-sm" style="margin-left:6px;" onclick="onSalesReturnCashModeChange('refund_split')">Edit Split</button>
            </div>
          ` : ""}
        </div>
        <div class="field">
          <label>Reason / Exchange Note</label>
          <input id="srReason" value="${esc(st.reason)}" placeholder="e.g. Size exchange or customer refund">
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="saveSalesReturnFromModal()">✓ Confirm Sales Return</button>
      </div>
    </div>
  `;
}

window.onSalesReturnCashModeChange = function(mode) {
  if (!_salesReturnState) return;
  _salesReturnState.restock = Number(document.getElementById("srRestock")?.value) || 0;
  _salesReturnState.refund = Number(document.getElementById("srRefund")?.value) || 0;
  _salesReturnState.reason = document.getElementById("srReason")?.value || "";
  _salesReturnState.cashFlowMode = mode;
  if (mode === "refund_split") {
    openSplitAmountPopup("👭 Split Customer Refund (Vaheeda & Balkees)", _salesReturnState.refund, _salesReturnState.vaheedaRefund, _salesReturnState.balkeesRefund, (v, b) => {
      _salesReturnState.vaheedaRefund = v;
      _salesReturnState.balkeesRefund = b;
      renderSalesReturnModalDom();
    });
  } else {
    renderSalesReturnModalDom();
  }
};

window.saveSalesReturnFromModal = function() {
  if (!_salesReturnState) return;
  const s = db.sales.find((x) => x.id === _salesReturnState.saleId);
  if (!s) return;
  const restock = Math.max(0, Number(document.getElementById("srRestock")?.value) || 0);
  const refund = Math.max(0, Number(document.getElementById("srRefund")?.value) || 0);
  const mode = document.getElementById("srCashMode")?.value || _salesReturnState.cashFlowMode;
  const reason = (document.getElementById("srReason")?.value || "").trim();
  const now = Date.now();

  let vRef = 0, bRef = 0;
  if (mode === "refund_split") {
    vRef = _salesReturnState.vaheedaRefund || (refund / 2);
    bRef = _salesReturnState.balkeesRefund || (refund - vRef);
  } else if (mode === "refund_by_vaheeda") vRef = refund;
  else if (mode === "refund_by_balkees") bRef = refund;

  if (!Array.isArray(s.returns)) s.returns = [];
  s.returns.push({
    id: uid(),
    date: todayIso(),
    type: mode === "store_credit" ? "exchange" : "return",
    refund,
    restock,
    cashFlowMode: mode,
    vaheedaRefund: vRef,
    balkeesRefund: bRef,
    reason
  });
  s._u = now;

  if (restock > 0 && s.productId) {
    const p = db.products.find((x) => x.id === s.productId);
    if (p) {
      p.qty = (Number(p.qty) || 0) + restock;
      p._u = now;
      outbox.add(`products/${p.id}`);
    }
  }

  _salesReturnState = null;
  saveLocalDb();
  outbox.add(`sales/${s.id}`);
  saveOutbox();
  closeModal();
  renderApp();
  pushOutboxToFirebase();
  showToast("Sales return recorded ↩️");
};

// ---- Send Live Status to Customer via WhatsApp ----
window.sendLiveOrderStatusWhatsApp = function(saleId, statusKey) {
  const s = db.sales.find((x) => x.id === saleId);
  if (!s) return;
  const now = Date.now();
  s.status = statusKey;
  s.orderSeen = true;
  s._u = now;
  saveLocalDb();
  outbox.add(`sales/${s.id}`);
  saveOutbox();
  renderApp();
  pushOutboxToFirebase();

  const shop = db.settings.shopName || "SISORA Ethnic Wear";
  const custName = s.customer || "Customer";
  const item = `${s.productName} × ${s.qty}`;
  let msg = "";
  if (statusKey === "ordered") {
    msg = `Hi ${custName}! 🌸\nYour order for *${item}* (${money(s.total)}) has been *RECEIVED* by *${shop}*! ✅\nWe are getting your outfit ready and will share live updates soon. 💕`;
  } else if (statusKey === "packed") {
    msg = `Hi ${custName}! ✨\nGreat news — your order for *${item}* is *PREPARED & PACKED* with love at *${shop}*! 🎁👗\nIt will be handed over to the courier shortly.`;
  } else if (statusKey === "shipped") {
    const trackInfo = s.courier || s.tracking ? `\n🚚 Courier: *${s.courier || "Express"}* ${s.tracking ? `(Tracking: *${s.tracking}*)` : ""}` : "";
    msg = `Hi ${custName}! 🚚💨\nYour order for *${item}* from *${shop}* has been *DISPATCHED / COURIER DONE*!${trackInfo}\nThank you for shopping with us! 💖`;
  } else {
    msg = `Hi ${custName}! 🎉🌷\nYour order for *${item}* from *${shop}* has been marked as *DELIVERED*! ✨\nWe hope you love wearing it! Please share your feedback with us. 💕`;
  }

  let rawPhone = s.customerPhone || (db.customers.find((c) => c.id === s.customerId)?.phone) || "";
  let digits = String(rawPhone).replace(/\D/g, "");
  const cc = String(db.settings.waCountry || "91").replace(/\D/g, "");
  if (digits.length === 10 && cc) digits = cc + digits;
  const waUrl = digits
    ? `https://wa.me/${digits}?text=${encodeURIComponent(msg)}`
    : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(waUrl, "_blank");
};

window.updateSaleStatus = function(saleId, status) {
  const s = db.sales.find((x) => x.id === saleId);
  if (!s) return;
  s.status = status;
  s.orderSeen = true;
  s._u = Date.now();
  saveLocalDb();
  outbox.add(`sales/${s.id}`);
  saveOutbox();
  renderApp();
  pushOutboxToFirebase();
  showToast("Order status updated");
};

window.deleteSaleItem = function(saleId) {
  const s = db.sales.find((x) => x.id === saleId);
  if (!s) return;
  requestDeleteApproval("sale", saleId, `${s.productName} × ${s.qty} (${s.customer || "Walk-in"} · ${money(s.total)})`);
};

window.deleteExpenseItem = function(expId) {
  const e = db.expenses.find((x) => x.id === expId);
  if (!e) return;
  requestDeleteApproval("expense", expId, `${e.title} (${money(e.amount)})`);
};

// ---- Expense / Contribution Modal (with Split Popup & Funding Source) ----
let _draftExpState = null;

window.openExpenseModal = function(mode = "expense") {
  const isCap = mode === "capital";
  _draftExpState = {
    isCap,
    title: "",
    amount: "",
    category: isCap ? "Capital Contribution" : ((db.settings.expCats || DEFAULT_SETTINGS.expCats)[0] || "Courier & Shipping"),
    paidBy: currentAccount?.id === "balkees" ? "balkees" : "vaheeda",
    vaheedaPaid: 0,
    balkeesPaid: 0,
    fundingSource: isCap ? "new_investment" : "available_cash"
  };
  renderExpenseModalDom();
};

function renderExpenseModalDom() {
  if (!_draftExpState) return;
  const st = _draftExpState;
  const wallets = computeSisterCashWallets();
  const modalRoot = document.getElementById("modalRoot");
  modalRoot.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal-sheet">
        <div class="modal-head">
          <h3>${st.isCap ? "💰 Add Sister Contribution" : "🧾 Add Expense (Single or Split)"}</h3>
          <button onclick="closeModal()" style="font-size:20px;">✕</button>
        </div>

        <div class="card" style="background:var(--accent-soft);padding:8px 12px;margin-bottom:10px;font-size:12px;">
          <b>💰 Available Sales Cash:</b> Vaheeda: <b>${money(wallets.vaheeda.availableCash)}</b> · Balkees: <b>${money(wallets.balkees.availableCash)}</b>
        </div>

        <div class="field">
          <label>Description *</label>
          <input id="eTitle" value="${esc(st.title)}" placeholder="${st.isCap ? 'e.g. Eid Stock Capital Injection' : 'e.g. Courier & Packaging'}">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Total Amount (₹) *</label>
            <input id="eAmt" type="number" inputmode="decimal" value="${st.amount}" placeholder="0">
          </div>
          <div class="field">
            <label>Category</label>
            <select id="eCat">
              ${st.isCap
                ? `<option value="Capital Contribution" ${st.category === 'Capital Contribution' ? 'selected' : ''}>Capital Contribution</option><option value="Partner Withdrawal" ${st.category === 'Partner Withdrawal' ? 'selected' : ''}>Partner Withdrawal</option>`
                : (db.settings.expCats || DEFAULT_SETTINGS.expCats).map((c) => `<option value="${esc(c)}" ${st.category === c ? 'selected' : ''}>${esc(c)}</option>`).join("")
              }
            </select>
          </div>
        </div>

        ${!st.isCap ? `
          <div class="field">
            <label>💎 Paid From (Funding Source)</label>
            <select id="eFundSrc">
              <option value="available_cash" ${st.fundingSource === 'available_cash' ? 'selected' : ''}>💰 Available Cash via Sales (Deducts from Sister's Cash Wallet)</option>
              <option value="new_investment" ${st.fundingSource === 'new_investment' ? 'selected' : ''}>💎 New Investment — Out of Pocket (Adds to Sister's Capital)</option>
            </select>
          </div>
        ` : ""}

        <div class="field">
          <label>👭 Paid By Sister (Select Split to open popup with both names)</label>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
            <button type="button" class="btn btn-sm ${st.paidBy === 'vaheeda' ? 'btn-primary' : 'btn-outline'}" onclick="selectExpensePaidBy('vaheeda')">🌷 Vaheeda</button>
            <button type="button" class="btn btn-sm ${st.paidBy === 'balkees' ? 'btn-primary' : 'btn-outline'}" onclick="selectExpensePaidBy('balkees')">🌸 Balkees</button>
            <button type="button" class="btn btn-sm ${st.paidBy === 'split' ? 'btn-primary' : 'btn-gold'}" onclick="selectExpensePaidBy('split')">👭 Split Popup</button>
          </div>
          ${st.paidBy === "split" ? `
            <div style="margin-top:6px;padding:8px 10px;background:var(--bg);border-radius:10px;display:flex;justify-content:space-between;align-items:center;font-size:12px;">
              <span>🌷 Vaheeda: <b>${money(st.vaheedaPaid)}</b> · 🌸 Balkees: <b>${money(st.balkeesPaid)}</b></span>
              <button type="button" class="btn btn-soft btn-sm" onclick="selectExpensePaidBy('split')">✏️ Edit Split</button>
            </div>
          ` : ""}
        </div>

        <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="saveExpenseFromModal()">💾 Save Entry</button>
      </div>
    </div>
  `;
}

window.selectExpensePaidBy = function(mode) {
  if (!_draftExpState) return;
  _draftExpState.title = document.getElementById("eTitle")?.value || "";
  _draftExpState.amount = document.getElementById("eAmt")?.value || "";
  _draftExpState.category = document.getElementById("eCat")?.value || _draftExpState.category;
  if (document.getElementById("eFundSrc")) _draftExpState.fundingSource = document.getElementById("eFundSrc").value;

  if (mode === "split") {
    const tot = Number(_draftExpState.amount) || 0;
    openSplitAmountPopup("👭 Split Expense Between Vaheeda & Balkees", tot, _draftExpState.vaheedaPaid, _draftExpState.balkeesPaid, (v, b) => {
      _draftExpState.paidBy = "split";
      _draftExpState.vaheedaPaid = v;
      _draftExpState.balkeesPaid = b;
      if (!Number(_draftExpState.amount)) _draftExpState.amount = v + b;
      renderExpenseModalDom();
    });
  } else {
    _draftExpState.paidBy = mode;
    renderExpenseModalDom();
  }
};

window.saveExpenseFromModal = function() {
  if (!_draftExpState) return;
  const title = (document.getElementById("eTitle")?.value || "").trim() || "Boutique Entry";
  const amount = Number(document.getElementById("eAmt")?.value) || 0;
  if (amount <= 0) return showToast("Enter a valid amount");
  const category = document.getElementById("eCat")?.value || _draftExpState.category || "Other";
  const paidBy = _draftExpState.paidBy || "vaheeda";
  const fundingSource = document.getElementById("eFundSrc")?.value || _draftExpState.fundingSource || "available_cash";
  const now = Date.now();

  let vPaid = 0, bPaid = 0;
  if (paidBy === "split") {
    vPaid = Number(_draftExpState.vaheedaPaid) || (amount / 2);
    bPaid = Number(_draftExpState.balkeesPaid) || (amount - vPaid);
  } else if (paidBy === "balkees") {
    bPaid = amount;
  } else {
    vPaid = amount;
  }

  const exp = {
    id: uid(),
    title,
    category,
    amount,
    paidBy,
    vaheedaPaid: vPaid,
    balkeesPaid: bPaid,
    fundingSource,
    date: todayIso(),
    notes: "",
    createdAt: nowIso(),
    _u: now
  };
  _draftExpState = null;
  db.expenses.unshift(exp);
  saveLocalDb();
  outbox.add(`expenses/${exp.id}`);
  saveOutbox();
  closeModal();
  renderApp();
  pushOutboxToFirebase();
  showToast("Entry saved ✨");
};

// ---- Boot Application ----
(async function boot() {
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
  const params = new URLSearchParams(window.location.search);
  const catalogueParam = params.get("catalogue");
  if (catalogueParam) {
    await renderCustomerLiveCatalogueMode();
    return;
  }
  const shareItem = params.get("item");
  if (shareItem) {
    await renderCustomerShareMode(shareItem);
    return;
  }
  await loadAllImagesFromIdb();
  renderApp();
  await pullFromFirebase();
  setInterval(() => {
    if (!document.hidden) pullFromFirebase();
  }, 12000);
})();
</script>
