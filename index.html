<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff8f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SISORA">

<title>SISORA — Boutique</title>
<style>
:root {
  --bg: #fff8f6;
  --paper: #ffffff;
  --ink: #35272d;
  --muted: #86727a;
  --line: #f0e2e6;
  --accent: #c85f83;
  --accent-soft: #fce8ef;
  --accent-deep: #983b5c;
  --gold: #b8860b;
  --gold-soft: #fff6db;
  --green: #237a57;
  --green-soft: #e6f6ee;
  --amber: #9c6516;
  --amber-soft: #fff2db;
  --red: #b9384f;
  --red-soft: #ffe8ec;
  --radius: 18px;
  --shadow: 0 10px 30px rgba(85, 35, 55, 0.08);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {
  --bg: #171215;
  --paper: #231b20;
  --ink: #f8eef2;
  --muted: #b09aa3;
  --line: #362a31;
  --accent-soft: #3d212d;
  --gold-soft: #362b14;
  --green-soft: #173328;
  --amber-soft: #382812;
  --red-soft: #3b1b22;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  font-size: 15px; line-height: 1.45;
  min-height: 100dvh;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
input, select, textarea {
  width: 100%; padding: 11px 13px;
  border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--paper); color: var(--ink);
  outline: none; transition: border-color .15s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
.app-shell {
  max-width: 680px; margin: 0 auto;
  min-height: 100dvh;
  padding-bottom: calc(92px + var(--safe-bottom));
}
.topbar {
  position: sticky; top: 0; z-index: 30;
  padding: calc(12px + var(--safe-top)) 16px 12px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.brand-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.shop-logo {
  width: 42px; height: 42px; border-radius: 13px;
  background: linear-gradient(135deg, var(--accent), var(--accent-deep));
  color: #fff; font-weight: 800; font-size: 19px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(200,95,131,0.28);
}
.shop-logo img { width: 100%; height: 100%; object-fit: cover; }
.brand-text h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-text p { margin: 0; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.sync-pill {
  font-size: 11px; font-weight: 700; padding: 5px 9px; border-radius: 99px;
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--green-soft); color: var(--green);
}
.sync-pill.syncing { background: var(--amber-soft); color: var(--amber); }
.sync-pill.offline { background: var(--red-soft); color: var(--red); }
.acct-chip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 4px; border-radius: 99px;
  background: var(--paper); border: 1px solid var(--line);
  font-size: 12px; font-weight: 700;
}
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--gold));
  color: #fff; font-weight: 800; font-size: 12px;
  display: inline-flex; align-items: center; justify-content: center;
  overflow: hidden; flex-shrink: 0;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.lg { width: 54px; height: 54px; font-size: 21px; }
.avatar.xl { width: 68px; height: 68px; font-size: 26px; }

.container { padding: 14px 15px; display: flex; flex-direction: column; gap: 14px; }
.card {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 15px;
  box-shadow: var(--shadow);
}
.hero-card {
  background: linear-gradient(135deg, var(--accent), var(--accent-deep));
  color: #fff; border: 0; position: relative; overflow: hidden;
}
.hero-card h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
.hero-card p { margin: 0; opacity: 0.9; font-size: 13px; }
.kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kpi-box {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: 15px; padding: 12px 13px;
}
.kpi-label { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.kpi-val { font-size: 19px; font-weight: 800; margin-top: 3px; }
.kpi-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 15px; border-radius: 12px; font-weight: 700; font-size: 13.5px;
  transition: transform .1s, opacity .15s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-gold { background: linear-gradient(135deg, #c7911b, #9b6c08); color: #fff; }
.btn-soft { background: var(--accent-soft); color: var(--accent-deep); }
[data-theme="dark"] .btn-soft { color: #ff9ebb; }
.btn-outline { background: var(--paper); border: 1.5px solid var(--line); color: var(--ink); }
.btn-danger { background: var(--red-soft); color: var(--red); }
.btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 9px; }

/* Blurred Product Tile Card */
.prod-tile {
  position: relative; overflow: hidden;
  border-radius: var(--radius); border: 1px solid var(--line);
  box-shadow: var(--shadow); background: var(--paper);
}
.prod-blur-bg {
  position: absolute; inset: -18px;
  background-size: cover; background-position: center;
  filter: blur(22px) saturate(1.3) brightness(0.92);
  transform: scale(1.12);
  z-index: 0; opacity: 0.42;
}
[data-theme="dark"] .prod-blur-bg { filter: blur(22px) saturate(1.3) brightness(0.55); opacity: 0.55; }
.prod-scrim {
  position: relative; z-index: 1;
  background: color-mix(in srgb, var(--paper) 74%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: 13px;
}
.prod-row { display: flex; gap: 13px; align-items: flex-start; }
.prod-thumb {
  width: 84px; height: 102px; border-radius: 13px;
  background: var(--accent-soft); overflow: hidden; flex-shrink: 0;
  position: relative; display: flex; align-items: center; justify-content: center;
  font-size: 28px; border: 1px solid rgba(255,255,255,0.4);
  cursor: pointer;
}
.prod-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-count-badge {
  position: absolute; bottom: 5px; right: 5px;
  background: rgba(0,0,0,0.68); color: #fff;
  font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 99px;
}
.prod-info { flex: 1; min-width: 0; }
.prod-title { font-weight: 800; font-size: 15.5px; margin: 0 0 3px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.prod-meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.pill-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.pill {
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent-deep);
}
[data-theme="dark"] .pill { color: #ff9ebb; }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.red { background: var(--red-soft); color: var(--red); }
.prod-actions {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-top: 8px; padding-top: 8px;
  border-top: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
  flex-wrap: wrap;
}

/* Bottom Navigation Bar */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 35;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + var(--safe-bottom));
}
.bottom-nav-inner {
  max-width: 680px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 6px 2px; border-radius: 12px; color: var(--muted);
  font-size: 10.5px; font-weight: 700; gap: 2px;
}
.nav-item .ico { font-size: 18px; line-height: 1.1; }
.nav-item.active { color: var(--accent); background: var(--accent-soft); }

/* Modals */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(20, 12, 16, 0.58);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center;
}
.modal-sheet {
  width: 100%; max-width: 640px; max-height: 92dvh;
  background: var(--paper); border-radius: 24px 24px 0 0;
  padding: 18px 18px calc(22px + var(--safe-bottom));
  overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.22);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
}
.modal-head h3 { margin: 0; font-size: 17px; font-weight: 800; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Login Screen */
.auth-screen {
  min-height: 100dvh; display: flex; flex-direction: column;
  justify-content: center; padding: calc(24px + var(--safe-top)) 18px calc(24px + var(--safe-bottom));
  max-width: 480px; margin: 0 auto;
}
.acct-card {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-radius: 18px;
  background: var(--paper); border: 1.5px solid var(--line);
  margin-bottom: 11px; text-align: left; width: 100%;
  box-shadow: var(--shadow); transition: transform .12s, border-color .15s;
}
.acct-card:active { transform: scale(0.98); border-color: var(--accent); }
.pin-dots { display: flex; justify-content: center; gap: 12px; margin: 16px 0; }
.pin-dot {
  width: 15px; height: 15px; border-radius: 50%;
  border: 2px solid var(--accent); background: transparent;
}
.pin-dot.filled { background: var(--accent); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 290px; margin: 0 auto; }
.key-btn {
  height: 54px; border-radius: 15px; background: var(--bg);
  border: 1px solid var(--line); font-size: 20px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.key-btn:active { background: var(--accent-soft); }

/* Diagrams & Charts */
.chart-bar-row { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding: 12px 4px 4px; border-bottom: 1px solid var(--line); }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 4px; }
.bar-pair { display: flex; align-items: flex-end; gap: 3px; width: 100%; justify-content: center; height: 115px; }
.bar-v { width: 12px; border-radius: 4px 4px 0 0; min-height: 3px; }
.donut-wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.donut-ring { width: 116px; height: 116px; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.donut-hole { width: 70px; height: 70px; border-radius: 50%; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; text-align: center; }
.legend-list { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 6px; }
.legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 7px; }

.toast {
  position: fixed; bottom: calc(84px + var(--safe-bottom)); left: 50%; transform: translateX(-50%);
  background: #23181d; color: #fff; padding: 10px 18px; border-radius: 99px;
  font-size: 13px; font-weight: 700; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  pointer-events: none; opacity: 0; transition: opacity .2s;
}
.toast.show { opacity: 1; }
.ios-install-banner {
  background: var(--gold-soft); border: 1px solid #e6c97a; color: #6e4e08;
  border-radius: 14px; padding: 11px 13px; font-size: 12.5px; margin-top: 12px;
}
/* Expandable Settings Blocks */
details.set-block {
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
details.set-block > summary {
  list-style: none; padding: 14px 16px; font-weight: 800; font-size: 15px;
  cursor: pointer; display: flex; align-items: center; justify-content: space-between;
  user-select: none;
}
details.set-block > summary::-webkit-details-marker { display: none; }
details.set-block > summary::after {
  content: "▾"; color: var(--muted); font-size: 14px; transition: transform .2s;
}
details.set-block[open] > summary { border-bottom: 1px solid var(--line); }
details.set-block[open] > summary::after { transform: rotate(180deg); }
.set-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 11px; }
.toggle-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 6px 0; border-bottom: 1px dashed var(--line);
}
.toggle-row:last-of-type { border-bottom: none; }
.chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
.chip-item {
  display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft);
  color: var(--accent); padding: 5px 10px; border-radius: 99px; font-size: 12px; font-weight: 700;
}
.chip-del {
  width: 18px; height: 18px; border-radius: 50%; background: var(--paper); color: var(--accent);
  display: inline-flex; align-items: center; justify-content: center; font-weight: 800; cursor: pointer;
}
.swatch-row { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 4px; }
.swatch-dot {
  width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
  border: 2px solid var(--line); transition: transform .12s;
}
.swatch-dot.active { border: 3px solid var(--ink); transform: scale(1.08); }
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>
// ============================================================================
// SISORA iPhone iOS App (PWA) + Customer Temporary Link Viewer
// Connected live to Firebase project: sisora-boutique
// ============================================================================
const FIREBASE_CFG = {
  apiKey: "AIzaSyDgeINcFut3Aq7BR4nbI1gLRyH9ajdUvG8",
  authDomain: "sisora-boutique.firebaseapp.com",
  databaseURL: "https://sisora-boutique-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sisora-boutique",
  shopId: "sisora-boutique-main",
  syncEmail: "sisoraboutique@sisora.app",
  syncPass: "Sisora#Boutique2026!"
};

const FIXED_ACCOUNTS = [
  { id: "admin", displayName: "Admin", subtitle: "Full Shop & Cloud Admin", defaultPin: "5603", isAdmin: true, emoji: "👑" },
  { id: "vaheeda", displayName: "Vaheeda", subtitle: "Sister Partner · Boutique", defaultPin: "2515", isAdmin: false, emoji: "🌷" },
  { id: "balkees", displayName: "Balkees", subtitle: "Sister Partner · Boutique", defaultPin: "8305", isAdmin: false, emoji: "🌸" }
];

const FIXED_SISTERS = [
  { id: "vaheeda", name: "Vaheeda" },
  { id: "balkees", name: "Balkees" }
];

const CURRENCY_SYMBOLS = {
  INR: "₹", AED: "AED ", SAR: "SAR ", QAR: "QAR ", OMR: "OMR ", KWD: "KWD ", BHD: "BHD ",
  USD: "$", EUR: "€", GBP: "£", PKR: "Rs ", BDT: "৳", LKR: "Rs "
};

const DEFAULT_SETTINGS = {
  shopName: "SISORA Ethnic Wear",
  brand: "SISORA",
  tagline: "Vaheeda & Balkees Boutique",
  greeting: "Hello, Vaheeda & Balkees! 🌷",
  logo: "S",
  logoAt: 0,
  pins: { admin: "5603", vaheeda: "2515", balkees: "8305" },
  profilePhotosAt: {},
  pendingDeletes: [],
  currency: "INR",
  dateFmt: "short",
  defaultLow: 2,
  defaultPayment: "paid",
  defaultStatus: "ordered",
  defaultChannel: "",
  dueDays: 7,
  waCountry: "",
  msgRemind: "Hi {name}, a gentle reminder that {amount} is pending for {item}. Thank you! 💕 – {shop}",
  msgShipped: "Hi {name}, your order ({item}) is on its way with {courier}. Tracking: {tracking}. Thank you! 💕 – {shop}",
  theme: "light",
  accent: "#c85f83",
  font: "system",
  textSize: 100,
  radius: "classic",
  compact: false,
  privacy: false,
  confirmDelete: true,
  showHero: true,
  showStats: true,
  showQuick: true,
  showLow: true,
  showNotice: true,
  lowCount: 3,
  categories: ["Kurti", "Kurti Set", "Salwar Suit", "Anarkali", "Lehenga", "Saree", "Abaya / Kaftan", "Dupatta / Stole", "Co-ord Set", "Gown / Party Wear", "Fabric / Unstitched", "Accessories"],
  channels: ["Instagram", "WhatsApp", "Walk-in", "Reference", "Exhibition", "Reseller"],
  payMethods: ["UPI / GPay", "Cash", "Bank transfer", "Card", "Other"],
  expCats: ["Stock Purchase", "Packaging", "Courier / Shipping", "Stitching / Tailor", "Marketing / Ads", "Travel", "Rent / Utilities", "Other"],
  sisters: FIXED_SISTERS,
  _u: 0
};

// ---- Local Storage & IndexedDB Image Cache ----
const LS_DB_KEY = "sisora_ios_db_v3";
const LS_ACCT_KEY = "sisora_ios_acct_v3";
const LS_OUTBOX_KEY = "sisora_ios_outbox_v3";

let db = loadLocalDb();
let currentAccount = loadLocalAccount();
let activeTab = "home";
let syncStatus = "offline"; // "live", "syncing", "offline"
let idToken = "";
let refreshToken = "";
let imgMap = new Map(); // id -> { at, data }
let outbox = new Set(JSON.parse(localStorage.getItem(LS_OUTBOX_KEY) || "[]"));

// Filter states
let stockQuery = "";
let stockCategory = "All";
let salesQuery = "";
let salesFilter = "All";

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function todayIso() {
  return new Date().toISOString().slice(0, 10);
}
function nowIso() {
  return new Date().toISOString();
}
function money(n) {
  const val = Number(n) || 0;
  const cur = (db && db.settings && db.settings.currency) || "INR";
  const sym = CURRENCY_SYMBOLS[cur] || (cur + " ");
  return sym + val.toLocaleString("en-IN", { maximumFractionDigits: 2 });
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function showToast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function loadLocalDb() {
  try {
    const raw = JSON.parse(localStorage.getItem(LS_DB_KEY) || "null");
    if (raw && typeof raw === "object") {
      return {
        products: Array.isArray(raw.products) ? raw.products : [],
        sales: Array.isArray(raw.sales) ? raw.sales : [],
        expenses: Array.isArray(raw.expenses) ? raw.expenses : [],
        customers: Array.isArray(raw.customers) ? raw.customers : [],
        settlements: Array.isArray(raw.settlements) ? raw.settlements : [],
        tombs: Array.isArray(raw.tombs) ? raw.tombs : [],
        settings: {
          ...DEFAULT_SETTINGS,
          ...(raw.settings || {}),
          sisters: FIXED_SISTERS,
          pins: { ...DEFAULT_SETTINGS.pins, ...((raw.settings && raw.settings.pins) || {}) },
          pendingDeletes: Array.isArray(raw.settings && raw.settings.pendingDeletes) ? raw.settings.pendingDeletes : []
        }
      };
    }
  } catch (e) {}
  return {
    products: [], sales: [], expenses: [], customers: [], settlements: [], tombs: [],
    settings: { ...DEFAULT_SETTINGS }
  };
}

function saveLocalDb() {
  try {
    localStorage.setItem(LS_DB_KEY, JSON.stringify(db));
  } catch (e) {}
  applyTheme();
}

function saveOutbox() {
  try {
    localStorage.setItem(LS_OUTBOX_KEY, JSON.stringify([...outbox]));
  } catch (e) {}
}

function loadLocalAccount() {
  try {
    const a = JSON.parse(localStorage.getItem(LS_ACCT_KEY) || "null");
    if (a && FIXED_ACCOUNTS.some((x) => x.id === a.id)) return a;
  } catch (e) {}
  return null;
}

function applyTheme() {
  const s = db.settings || DEFAULT_SETTINGS;
  const sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark = s.theme === "dark" || s.theme === "oled" || ((s.theme === "auto" || s.theme === "autooled") && sysDark);
  document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
  if (s.accent) {
    document.documentElement.style.setProperty("--accent", s.accent);
  }
  const radMap = { sharp: "8px", classic: "18px", pillow: "26px" };
  document.documentElement.style.setProperty("--radius", radMap[s.radius] || "18px");
  document.documentElement.style.fontSize = ((Number(s.textSize) || 100) / 100 * 16) + "px";
}

// ---- IndexedDB for Product & Profile Images ----
function openImgDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("sisora_images_idb", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("imgs", { keyPath: "id" });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function loadAllImagesFromIdb() {
  try {
    const idb = await openImgDb();
    return new Promise((resolve) => {
      const tx = idb.transaction("imgs", "readonly");
      const req = tx.objectStore("imgs").getAll();
      req.onsuccess = () => {
        (req.result || []).forEach((row) => {
          if (row && row.id && row.data) imgMap.set(row.id, { at: row.at || 0, data: row.data });
        });
        resolve();
      };
      req.onerror = () => resolve();
    });
  } catch (e) {}
}

async function putLocalImage(id, data, at = Date.now(), fromRemote = false) {
  imgMap.set(id, { at, data });
  try {
    const idb = await openImgDb();
    const tx = idb.transaction("imgs", "readwrite");
    tx.objectStore("imgs").put({ id, at, data });
  } catch (e) {}
  if (!fromRemote) {
    outbox.add("img/" + id);
    saveOutbox();
    pushOutboxToFirebase();
  }
}

async function deleteLocalImage(id) {
  imgMap.delete(id);
  try {
    const idb = await openImgDb();
    const tx = idb.transaction("imgs", "readwrite");
    tx.objectStore("imgs").delete(id);
  } catch (e) {}
}

function compressImageFile(file, maxDim = 920, quality = 0.78) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        const ctx = cv.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---- Firebase REST Client (100% compatible with Android APK CloudSyncClient.kt) ----
async function ensureFirebaseAuth() {
  if (idToken) return idToken;
  const url = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(FIREBASE_CFG.apiKey)}`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email: FIREBASE_CFG.syncEmail,
      password: FIREBASE_CFG.syncPass,
      returnSecureToken: true
    })
  });
  if (!res.ok) throw new Error("Firebase Auth failed");
  const data = await res.json();
  idToken = data.idToken;
  refreshToken = data.refreshToken || "";
  return idToken;
}

async function fbGet(path) {
  const token = await ensureFirebaseAuth();
  const url = `${FIREBASE_CFG.databaseURL}/${path}.json?auth=${encodeURIComponent(token)}`;
  const res = await fetch(url);
  if (res.status === 401) {
    idToken = "";
    const retryToken = await ensureFirebaseAuth();
    const res2 = await fetch(`${FIREBASE_CFG.databaseURL}/${path}.json?auth=${encodeURIComponent(retryToken)}`);
    return res2.ok ? res2.json() : null;
  }
  return res.ok ? res.json() : null;
}

async function fbPut(path, payload) {
  const token = await ensureFirebaseAuth();
  const url = `${FIREBASE_CFG.databaseURL}/${path}.json?auth=${encodeURIComponent(token)}`;
  const res = await fetch(url, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  return res.ok ? res.json() : null;
}

const COLLECTIONS = ["products", "sales", "expenses", "customers", "settlements"];

async function pullFromFirebase() {
  try {
    syncStatus = "syncing";
    updateSyncPill();
    const shopId = FIREBASE_CFG.shopId;
    const [prodObj, salesObj, expObj, custObj, setObj, settingsObj] = await Promise.all([
      fbGet(`shops/${shopId}/data/products`),
      fbGet(`shops/${shopId}/data/sales`),
      fbGet(`shops/${shopId}/data/expenses`),
      fbGet(`shops/${shopId}/data/customers`),
      fbGet(`shops/${shopId}/data/settlements`),
      fbGet(`shops/${shopId}/data/settings`)
    ]);

    const colMap = { products: prodObj, sales: salesObj, expenses: expObj, customers: custObj, settlements: setObj };
    let changed = false;

    for (const col of COLLECTIONS) {
      const remoteCol = colMap[col];
      if (!remoteCol || typeof remoteCol !== "object") continue;
      for (const [id, wrapper] of Object.entries(remoteCol)) {
        if (!wrapper) continue;
        const ru = Number(wrapper._u) || 0;
        const idx = db[col].findIndex((x) => x.id === id);
        const localItem = idx >= 0 ? db[col][idx] : null;
        const tomb = db.tombs.find((t) => t.c === col && t.id === id);
        const lu = localItem ? (Number(localItem._u) || 0) : (tomb ? (Number(tomb._u) || 0) : -1);

        if (ru > lu) {
          db.tombs = db.tombs.filter((t) => !(t.c === col && t.id === id));
          if (wrapper.deleted) {
            if (idx >= 0) db[col].splice(idx, 1);
            db.tombs.push({ c: col, id, _u: ru });
          } else if (wrapper.j) {
            try {
              const parsed = typeof wrapper.j === "string" ? JSON.parse(wrapper.j) : wrapper.j;
              parsed._u = ru;
              if (idx >= 0) db[col][idx] = parsed;
              else db[col].unshift(parsed);
            } catch (e) {}
          }
          outbox.delete(`${col}/${id}`);
          changed = true;
        }
      }
    }

    if (settingsObj && settingsObj.j) {
      const ru = Number(settingsObj._u) || 0;
      const lu = Number(db.settings._u) || 0;
      if (ru > lu) {
        try {
          const remoteSettings = typeof settingsObj.j === "string" ? JSON.parse(settingsObj.j) : settingsObj.j;
          db.settings = {
            ...db.settings,
            ...remoteSettings,
            sisters: FIXED_SISTERS,
            pins: { ...DEFAULT_SETTINGS.pins, ...(db.settings.pins || {}), ...(remoteSettings.pins || {}) },
            profilePhotosAt: { ...(db.settings.profilePhotosAt || {}), ...(remoteSettings.profilePhotosAt || {}) },
            _u: ru
          };
          outbox.delete("settings");
          changed = true;
        } catch (e) {}
      }
    }

    if (changed) {
      saveLocalDb();
      saveOutbox();
      renderApp();
    }

    // Fetch any missing product or profile images
    const neededImgs = new Set();
    for (const p of db.products) {
      const ids = Array.isArray(p.photoIds) && p.photoIds.length ? p.photoIds : (p.imgAt ? [p.id] : []);
      for (const pid of ids) {
        const localIm = imgMap.get(pid);
        if (!localIm || (p.imgAt && localIm.at < p.imgAt)) neededImgs.add(pid);
      }
    }
    const profAt = db.settings.profilePhotosAt || {};
    for (const acc of FIXED_ACCOUNTS) {
      const ts = Number(profAt[acc.id]) || 0;
      const imgId = "profile_" + acc.id;
      const localIm = imgMap.get(imgId);
      if (ts > 0 && (!localIm || localIm.at < ts)) neededImgs.add(imgId);
    }
    if (db.settings.logoAt && (!imgMap.get("logo") || imgMap.get("logo").at < db.settings.logoAt)) {
      neededImgs.add("logo");
    }

    for (const imgId of neededImgs) {
      try {
        const imObj = await fbGet(`shops/${shopId}/data/images/${imgId}`);
        if (imObj && imObj.data) {
          await putLocalImage(imgId, imObj.data, imObj.at || Date.now(), true);
        }
      } catch (e) {}
    }
    if (neededImgs.size > 0) renderApp();

    syncStatus = "live";
    updateSyncPill();
  } catch (e) {
    syncStatus = "offline";
    updateSyncPill();
  }
}

async function pushOutboxToFirebase() {
  if (outbox.size === 0) return;
  try {
    syncStatus = "syncing";
    updateSyncPill();
    const shopId = FIREBASE_CFG.shopId;
    const keys = [...outbox];
    for (const key of keys) {
      if (key === "settings") {
        const u = db.settings._u || Date.now();
        await fbPut(`shops/${shopId}/data/settings`, { _u: u, j: JSON.stringify(db.settings) });
        outbox.delete(key);
      } else if (key.startsWith("img/")) {
        const imgId = key.slice(4);
        const im = imgMap.get(imgId);
        if (im && im.data) {
          await fbPut(`shops/${shopId}/data/images/${imgId}`, { at: im.at || Date.now(), data: im.data });
        }
        outbox.delete(key);
      } else if (key.includes("/")) {
        const [col, id] = key.split("/");
        const item = (db[col] || []).find((x) => x.id === id);
        const tomb = db.tombs.find((t) => t.c === col && t.id === id);
        if (item) {
          await fbPut(`shops/${shopId}/data/${col}/${id}`, { _u: item._u || Date.now(), j: JSON.stringify(item) });
        } else if (tomb) {
          await fbPut(`shops/${shopId}/data/${col}/${id}`, { _u: tomb._u || Date.now(), deleted: true });
        }
        outbox.delete(key);
      }
    }
    saveOutbox();
    syncStatus = "live";
    updateSyncPill();
  } catch (e) {
    syncStatus = "offline";
    updateSyncPill();
  }
}

function updateSyncPill() {
  const el = document.getElementById("syncPill");
  if (!el) return;
  if (syncStatus === "live") {
    el.className = "sync-pill";
    el.textContent = "● Live Sync";
  } else if (syncStatus === "syncing") {
    el.className = "sync-pill syncing";
    el.textContent = "↻ Syncing…";
  } else {
    el.className = "sync-pill offline";
    el.textContent = "○ Offline Ready";
  }
}

// ============================================================================
// MODE 1A: Customer Live Catalogue Storefront (?catalogue=live)
// Supports clickable multi-photo lightbox, single & multiple item selection,
// size/colour/quantity pickers, and direct customer ordering into Firebase!
// ============================================================================
let catProducts = [];
let catPhotosMap = {}; // prodId -> [dataUrl, ...]
let catShopSettings = { ...DEFAULT_SETTINGS };
let catSearch = "";
let catCategory = "All";
// Selected items map: prodId -> { selected: boolean, qty: number, size: string, color: string }
let catSelections = {};

function getCatItemState(p) {
  if (!catSelections[p.id]) {
    const sizes = String(p.variant || "Free Size").split(",").map((x) => x.trim()).filter(Boolean);
    const colors = String(p.color || "As Shown").split(",").map((x) => x.trim()).filter(Boolean);
    catSelections[p.id] = {
      selected: false,
      qty: 1,
      size: sizes[0] || "Free Size",
      color: colors[0] || "As Shown"
    };
  }
  return catSelections[p.id];
}

async function renderCustomerLiveCatalogueMode(preselectProdId = null) {
  const root = document.getElementById("app");
  root.innerHTML = `
    <div class="auth-screen" style="text-align:center;">
      <div class="card" style="padding:28px 20px;">
        <div style="font-size:38px;margin-bottom:10px;">👗</div>
        <h2 style="margin:0 0 6px;">Loading Live Collection…</h2>
        <p style="color:var(--muted);margin:0;">Fetching current in-stock outfits & photos from SISORA…</p>
      </div>
    </div>
  `;

  try {
    const shopId = FIREBASE_CFG.shopId;
    const [rawSettings, rawProducts] = await Promise.all([
      fbGet(`shops/${shopId}/data/settings`),
      fbGet(`shops/${shopId}/data/products`)
    ]);

    if (rawSettings && rawSettings.j) {
      const parsedSet = typeof rawSettings.j === "string" ? JSON.parse(rawSettings.j) : rawSettings.j;
      catShopSettings = { ...DEFAULT_SETTINGS, ...parsedSet };
      db.settings = catShopSettings;
      applyTheme();
    }

    const inStockList = [];
    if (rawProducts && typeof rawProducts === "object") {
      for (const [pid, wrap] of Object.entries(rawProducts)) {
        if (!wrap || wrap.deleted || !wrap.j) continue;
        const p = typeof wrap.j === "string" ? JSON.parse(wrap.j) : wrap.j;
        if (p && Number(p.qty) > 0) {
          inStockList.push(p);
        }
      }
    }
    inStockList.sort((a, b) => (Number(b._u) || 0) - (Number(a._u) || 0));
    catProducts = inStockList;

    if (preselectProdId) {
      const found = catProducts.find((x) => x.id === preselectProdId);
      if (found) {
        const st = getCatItemState(found);
        st.selected = true;
      }
    }

    renderLiveCatalogueDom();

    // Load product photos progressively in parallel
    await Promise.all(
      catProducts.map(async (p) => {
        const ids = Array.isArray(p.photoIds) && p.photoIds.length ? p.photoIds : (p.imgAt ? [p.id] : []);
        const urls = [];
        for (const imgId of ids) {
          const im = await fbGet(`shops/${shopId}/data/images/${imgId}`);
          if (im && im.data) urls.push(im.data);
        }
        if (urls.length) {
          catPhotosMap[p.id] = urls;
          renderLiveCatalogueDom();
        }
      })
    );
  } catch (err) {
    root.innerHTML = `
      <div class="auth-screen" style="text-align:center;">
        <div class="card" style="padding:28px 20px;">
          <h2>Unable to load live catalogue</h2>
          <p style="color:var(--muted);">${esc(err.message)}</p>
        </div>
      </div>
    `;
  }
}

};
window.updateCatItemOption = (prodId, field, value) => {
  const p = catProducts.find((x) => x.id === prodId);
  if (!p) return;
  const st = getCatItemState(p);
  st[field] = value;
};
window.changeCatItemQty = (prodId, delta) => {
  const p = catProducts.find((x) => x.id === prodId);
  if (!p) return;
  const st = getCatItemState(p);
  const maxQty = Math.max(1, Number(p.qty) || 1);
  st.qty = Math.max(1, Math.min(maxQty, (st.qty || 1) + delta));
  st.selected = true;
  renderLiveCatalogueDom();
};
window.toggleCatItemSelect = (prodId) => {
  const p = catProducts.find((x) => x.id === prodId);
  if (!p) return;
  const st = getCatItemState(p);
  st.selected = !st.selected;
  renderLiveCatalogueDom();
};
window.orderSingleCatItemNow = (prodId) => {
  const p = catProducts.find((x) => x.id === prodId);
  if (!p) return;
  const st = getCatItemState(p);
  st.selected = true;
  renderLiveCatalogueDom();
  window.openCustomerCheckoutModal();
};

window.submitCustomerCatalogueOrder = async () => {
  const name = (document.getElementById("custOrdName")?.value || "").trim();
  const phone = (document.getElementById("custOrdPhone")?.value || "").trim();
  const address = (document.getElementById("custOrdAddress")?.value || "").trim();
  const payPref = document.getElementById("custOrdPayMethod")?.value || "UPI / GPay";
  const extraNotes = (document.getElementById("custOrdNotes")?.value || "").trim();

  if (!name) return showToast("Please enter your name");
  if (!phone) return showToast("Please enter your WhatsApp / phone number");
  if (!address) return showToast("Please enter your delivery address");

  const selectedItems = catProducts.filter((p) => getCatItemState(p).selected);
  if (!selectedItems.length) return;

  const btn = document.getElementById("placeCustOrderBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Submitting your order…"; }

  try {
    const shopId = FIREBASE_CFG.shopId;
    const now = Date.now();
    const custId = "cust_" + phone.replace(/\D/g, "").slice(-10) + "_" + uid().slice(-3);

    // 1. Save customer record in Firebase
    const custRecord = {
      id: custId,
      name,
      phone,
      address,
      birthday: "",
      size: selectedItems.map((p) => getCatItemState(p).size).join(", "),
      notes: "Ordered via Live Customer Catalogue",
      createdAt: nowIso(),
      updatedAt: nowIso(),
      _u: now
    };
    await fbPut(`shops/${shopId}/data/customers/${custId}`, { _u: now, j: JSON.stringify(custRecord) });

    // 2. Create a Sale order record for each selected outfit and decrement live stock
    let grandTotal = 0;
    const orderLines = [];

    for (const p of selectedItems) {
      const st = getCatItemState(p);
      const orderQty = Math.max(1, Math.min(Number(p.qty) || 1, Number(st.qty) || 1));
      const lineTotal = orderQty * (Number(p.price) || 0);
      grandTotal += lineTotal;

      const saleId = uid();
      const itemNote = `Size: ${st.size} · Colour: ${st.color} · Phone: ${phone} · Pay Pref: ${payPref}${extraNotes ? " · " + extraNotes : ""}`;
      const newSale = {
        id: saleId,
        productId: p.id,
        productName: p.name,
        qty: orderQty,
        price: Number(p.price) || 0,
        costAtSale: Number(p.cost) || 0,
        owner: p.owner || "joint",
        customer: name,
        customerId: custId,
        seller: p.owner === "balkees" ? "balkees" : "vaheeda",
        channel: "WhatsApp",
        date: todayIso(),
        notes: itemNote,
        total: lineTotal,
        status: "ordered",
        courier: "",
        tracking: "",
        address,
        pays: [],
        returns: [],
        createdAt: nowIso(),
        _u: now
      };
      await fbPut(`shops/${shopId}/data/sales/${saleId}`, { _u: now, j: JSON.stringify(newSale) });

      // Update product stock in Firebase
      p.qty = Math.max(0, (Number(p.qty) || 0) - orderQty);
      p._u = now;
      await fbPut(`shops/${shopId}/data/products/${p.id}`, { _u: now, j: JSON.stringify(p) });

      orderLines.push(`• *${p.name}* × ${orderQty} (Size: ${st.size}, Colour: ${st.color}) — ${money(lineTotal)}`);
    }

    const waSummary = [
      `🛍️ *New Live Catalogue Order — ${catShopSettings.shopName}*`,
      `👤 Customer: *${name}*`,
      `📞 Phone: ${phone}`,
      `📍 Address: ${address}`,
      `💳 Payment Preference: ${payPref}`,
      extraNotes ? `📝 Note: ${extraNotes}` : "",
      ``,
      `*Ordered Outfits:*`,
      ...orderLines,
      ``,
      `💖 *Total Order Amount: ${money(grandTotal)}*`
    ].filter(Boolean).join("\n");

    const waNum = String(catShopSettings.waCountry || "").replace(/\D/g, "");
    const waUrl = `https://wa.me/${waNum}?text=${encodeURIComponent(waSummary)}`;

    // Clear selections and refresh live stock
    catProducts = catProducts.filter((p) => Number(p.qty) > 0);
    catSelections = {};
    renderLiveCatalogueDom();

    const modalRoot = document.getElementById("modalRoot");
    modalRoot.innerHTML = `
      <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
        <div class="modal-sheet" style="text-align:center;">
          <div style="font-size:46px;margin-bottom:6px;">🎉</div>
          <h3 style="margin:0 0 6px;font-size:21px;">Order Placed Successfully!</h3>
          <p style="color:var(--muted);font-size:13px;margin:0 0 12px;">
            Thank you, <b>${esc(name)}</b>! Your order has been sent directly to <b>${esc(catShopSettings.shopName)}</b> and live stock has been reserved for you.
          </p>
          <div class="card" style="background:var(--bg);text-align:left;font-size:12.5px;white-space:pre-wrap;margin-bottom:14px;">${esc(waSummary)}</div>
          <a href="${waUrl}" target="_blank" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;text-decoration:none;margin-bottom:8px;">
            💬 Send Order Confirmation on WhatsApp
          </a>
          <button class="btn btn-soft" style="width:100%;" onclick="closeModal()">Continue Browsing</button>
        </div>
      </div>
    `;
  } catch (e) {
    showToast("Could not submit order: " + e.message);
    if (btn) { btn.disabled = false; btn.textContent = "✅ Place Order Now"; }
  }
};

async function renderCustomerShareMode(shareId) {
  const root = document.getElementById("app");

      <div class="card" style="padding:28px 20px;">

  try {
    const shopId = FIREBASE_CFG.shopId;
    let shareData = await fbGet(`shops/${shopId}/data/shares/${shareId}`);

    // If share record wasn't written yet or needs full product fallback, match from products collection
    const prodCol = await fbGet(`shops/${shopId}/data/products`);
    let matchedProd = null;
    if (prodCol && typeof prodCol === "object") {
      for (const [pid, wrap] of Object.entries(prodCol)) {
        if (!wrap || wrap.deleted || !wrap.j) continue;
        const p = typeof wrap.j === "string" ? JSON.parse(wrap.j) : wrap.j;
        if (pid === shareId || pid.endsWith(prefix) || (shareData && shareData.productId === pid)) {
          matchedProd = p;
          break;

      }

    if (!shareData && !matchedProd) {
      root.innerHTML = `

          <div class="card" style="padding:28px 20px;">
            <div style="font-size:40px;margin-bottom:10px;">🌷</div>

      return;
    }

    const expiresAt = (shareData && shareData.expiresAt) ? Number(shareData.expiresAt) : (Date.now() + 48 * 3600000);
    if (Date.now() > expiresAt) {
      root.innerHTML = `
        <div class="auth-screen" style="text-align:center;">
          <div class="card" style="padding:28px 20px;">
            <div style="font-size:42px;margin-bottom:10px;">⏳</div>

          </div>
        </div>
      `;
      return;
    }

    const name = (shareData && shareData.name && shareData.name !== "Test Share") ? shareData.name : (matchedProd ? matchedProd.name : "SISORA Outfit");
    const code = (shareData && shareData.code) || (matchedProd && matchedProd.code) || "";
    const category = (shareData && shareData.category) || (matchedProd && matchedProd.category) || "Boutique Collection";
    const priceStr = (shareData && shareData.rawPrice) ? money(shareData.rawPrice) : (matchedProd ? money(matchedProd.price) : ((shareData && shareData.price) || ""));

    const colors = (shareData && shareData.availableColors) || (matchedProd && matchedProd.color) || "As Shown in Photos";

    const qty = matchedProd ? Number(matchedProd.qty) : (shareData && shareData.qty ? Number(shareData.qty) : 1);
    const notes = (shareData && shareData.notes) || (matchedProd && matchedProd.notes) || "";

    let photoIds = [];

      photoIds = shareData.photoIds;
    } else if (matchedProd) {
      photoIds = (Array.isArray(matchedProd.photoIds) && matchedProd.photoIds.length) ? matchedProd.photoIds : [matchedProd.id];

            <div class="brand-text">
              <h1>SISORA Ethnic Wear</h1>
              <p>Vaheeda & Balkees Boutique · Exclusive Preview</p>
            </div>
          </div>
          <span class="pill amber">⏳ Valid ${hoursLeft}h</span>
        </div>

        <div class="container">
          <div class="prod-tile">
            ${coverImg ? `<div class="prod-blur-bg" style="background-image:url('${coverImg}')"></div>` : ""}
            <div class="prod-scrim" style="padding:16px;">

let pinEntryAcc = null;
let pinBuffer = "";

window.openPinModal = function(accId) {
  pinEntryAcc = FIXED_ACCOUNTS.find((a) => a.id === accId);
  pinBuffer = "";
  renderPinModal();
};

function renderPinModal() {
  if (!pinEntryAcc) return;
  const modalRoot = document.getElementById("modalRoot");
  const dots = [0, 1, 2, 3].map((i) => `<div class="pin-dot ${pinBuffer.length > i ? 'filled' : ''}"></div>`).join("");
  modalRoot.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal-sheet" style="text-align:center;">
        <div style="margin-bottom:8px;">${getAccountAvatarHtml(pinEntryAcc.id, "xl")}</div>
        <h3 style="margin:6px 0 2px;font-size:19px;">Hi, ${esc(pinEntryAcc.displayName)} ${pinEntryAcc.emoji}</h3>
        <p style="margin:0;color:var(--muted);font-size:13px;">Enter your 4-digit PIN code to unlock</p>
        <div class="pin-dots">${dots}</div>
        <div class="keypad">
          ${[1,2,3,4,5,6,7,8,9].map((n) => `<button class="key-btn" onclick="pressPinDigit('${n}')">${n}</button>`).join("")}
          <button class="key-btn" style="font-size:13px;color:var(--muted);" onclick="closeModal()">Cancel</button>
          <button class="key-btn" onclick="pressPinDigit('0')">0</button>
          <button class="key-btn" onclick="pressPinBack()">⌫</button>
        </div>
      </div>
    </div>
  `;
}

window.pressPinDigit = function(d) {
  if (pinBuffer.length >= 6) return;
  pinBuffer += d;
  renderPinModal();
  const expected = String((db.settings.pins && db.settings.pins[pinEntryAcc.id]) || pinEntryAcc.defaultPin);
  if (pinBuffer === expected) {
    currentAccount = pinEntryAcc;
    localStorage.setItem(LS_ACCT_KEY, JSON.stringify(currentAccount));
    closeModal();
    showToast(`Welcome, ${currentAccount.displayName}! ${currentAccount.emoji}`);
    renderApp();
    pullFromFirebase();
  } else if (pinBuffer.length >= expected.length) {
    setTimeout(() => {
      showToast("Incorrect PIN for " + pinEntryAcc.displayName);
      pinBuffer = "";
      renderPinModal();
    }, 180);
  }
};

window.pressPinBack = function() {

function computeTotals() {
  let revenue = 0, cogs = 0, received = 0, due = 0;
  for (const s of db.sales) {
    const retRefund = (s.returns || []).reduce((a, r) => a + (Number(r.refund) || 0), 0);
    const retRestock = (s.returns || []).reduce((a, r) => a + (Number(r.restock) || 0), 0);
    const netTot = Math.max(0, (Number(s.total) || 0) - retRefund);
    const paid = (s.pays || []).reduce((a, p) => a + (Number(p.amount) || 0), 0);
    revenue += netTot;
    cogs += (Number(s.costAtSale) || 0) * Math.max(0, (Number(s.qty) || 1) - retRestock);
    received += paid;
    due += Math.max(0, netTot - paid);
  }
  const expenses = db.expenses
    .filter((e) => e.category !== "Capital Contribution" && e.category !== "Partner Withdrawal")
    .reduce((a, e) => a + (Number(e.amount) || 0), 0);
  const stockUnits = db.products.reduce((a, p) => a + Math.max(0, Number(p.qty) || 0), 0);
  const stockCost = db.products.reduce((a, p) => a + Math.max(0, Number(p.qty) || 0) * (Number(p.cost) || 0), 0);
  const stockRetail = db.products.reduce((a, p) => a + Math.max(0, Number(p.qty) || 0) * (Number(p.price) || 0), 0);
  const netProfit = revenue - cogs - expenses;
  return { revenue, cogs, received, due, expenses, stockUnits, stockCost, stockRetail, netProfit };
}

function renderReportsTab() {
  const t = computeTotals();
  const palette = ["#c85f83", "#b8860b", "#237a57", "#5b4b8a", "#d96b27", "#2b7a9b"];

  // 1. Sister Contributions (Vaheeda vs Balkees)
  function sisterStats(sisId) {
    const capIn = db.expenses.filter((e) => e.paidBy === sisId && e.category === "Capital Contribution").reduce((a, e) => a + (Number(e.amount) || 0), 0);
    const expPaid = db.expenses.filter((e) => e.paidBy === sisId && e.category !== "Capital Contribution" && e.category !== "Partner Withdrawal").reduce((a, e) => a + (Number(e.amount) || 0), 0);
    const withdrawn = db.expenses.filter((e) => e.paidBy === sisId && e.category === "Partner Withdrawal").reduce((a, e) => a + (Number(e.amount) || 0), 0);
    const salesBy = db.sales.filter((s) => s.seller === sisId).reduce((a, s) => a + (Number(s.total) || 0), 0);
    const stockOwned = db.products.filter((p) => p.owner === sisId).reduce((a, p) => a + (Number(p.cost) || 0) * Math.max(0, Number(p.qty) || 0), 0);
    const netContrib = capIn + expPaid + stockOwned - withdrawn;
    return { capIn, expPaid, withdrawn, salesBy, stockOwned, netContrib };
  }
  const vah = sisterStats("vaheeda");
  const bal = sisterStats("balkees");
  const totContrib = Math.max(1, vah.netContrib + bal.netContrib);
  const vahPct = Math.round((vah.netContrib / totContrib) * 100);

  // 2. Sales by Source / Channel
  const chanMap = {};
  db.sales.forEach((s) => { const ch = s.channel || "Instagram"; chanMap[ch] = (chanMap[ch] || 0) + (Number(s.total) || 0); });
  const chanEntries = Object.entries(chanMap).sort((a, b) => b[1] - a[1]);

  // 3. Payment Modes
  const payMap = {};
  db.sales.forEach((s) => {
    const paid = (s.pays || []).reduce((a, p) => {
      const m = p.method || "UPI / GPay";
      payMap[m] = (payMap[m] || 0) + (Number(p.amount) || 0);
      return a + (Number(p.amount) || 0);
    }, 0);
    const due = Math.max(0, (Number(s.total) || 0) - paid);
    if (due > 0) payMap["Pending Due"] = (payMap["Pending Due"] || 0) + due;
  });
  const payEntries = Object.entries(payMap).sort((a, b) => b[1] - a[1]);

  // 4. Expenses by Category
  const expMap = {};
  db.expenses.forEach((e) => { const c = e.category || "Other"; expMap[c] = (expMap[c] || 0) + (Number(e.amount) || 0); });
  const expEntries = Object.entries(expMap).sort((a, b) => b[1] - a[1]);

  // 5. Stock Value by Dress Category
  const catStockMap = {};
  db.products.forEach((p) => { const c = p.category || "Kurti"; catStockMap[c] = (catStockMap[c] || 0) + Math.max(0, Number(p.qty) || 0) * (Number(p.price) || 0); });
  const catStockEntries = Object.entries(catStockMap).sort((a, b) => b[1] - a[1]);

  // Helper for Donut HTML
  function buildDonutHtml(entries, centerLabel) {
    const total = entries.reduce((a, x) => a + x[1], 0);
    if (total <= 0) return `<p style="color:var(--muted);font-size:13px;margin:0;">No data recorded yet.</p>`;
    let accDeg = 0;
    const stops = entries.map(([k, v], i) => {
      const deg = (v / total) * 360;
      const start = accDeg;
      accDeg += deg;
      return `${palette[i % palette.length]} ${start.toFixed(1)}deg ${accDeg.toFixed(1)}deg`;
    }).join(", ");
    return `
      <div class="donut-wrap">
        <div class="donut-ring" style="background:conic-gradient(${stops});">
          <div class="donut-hole">
            <span style="color:var(--muted);font-size:9.5px;">${esc(centerLabel)}</span>
            <span>${money(total)}</span>
          </div>
        </div>
        <div class="legend-list">
          ${entries.map(([k, v], i) => `
            <div class="legend-item">
              <span><span class="legend-dot" style="background:${palette[i % palette.length]}"></span>${esc(k)}</span>
              <b>${money(v)} (${Math.round((v / total) * 100)}%)</b>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  return `
    <div class="card">
      <h3 style="margin:0 0 10px;">👭 Vaheeda vs Balkees Contributions & Sales</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
        <div class="kpi-box">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            ${getAccountAvatarHtml("vaheeda")}
            <b>Vaheeda</b>
          </div>

let _cropState = null;

window.openCropRotateModal = function(srcDataUrl, defaultAspect = "square", onSaveCallback, titleText = "✂️ Crop & Rotate Photo") {
  if (!srcDataUrl) return;
  const img = new Image();
  img.onload = () => {
    _cropState = {
      img,
      srcDataUrl,
      rotation: 0,
      flipH: false,
      aspect: defaultAspect, // "square" | "portrait" | "free"
      zoom: 1,
      panX: 0,
      panY: 0,
      dragging: false,
      lastX: 0,
      lastY: 0,
      onSave: onSaveCallback,
      prevModalHtml: document.getElementById("modalRoot")?.innerHTML || ""
    };
    renderCropRotateModalDom(titleText);
  };
  img.src = srcDataUrl;
};

function renderCropRotateModalDom(titleText = "✂️ Crop & Rotate Photo") {

function setupCropCanvasInteractions() {
  const canvas = document.getElementById("cropCanvas");
  if (!canvas || !_cropState) return;
  const startDrag = (x, y) => {
    _cropState.dragging = true;
    _cropState.lastX = x;
    _cropState.lastY = y;
  };
  const moveDrag = (x, y) => {
    if (!_cropState || !_cropState.dragging) return;
    const dx = (x - _cropState.lastX) / canvas.width;
    const dy = (y - _cropState.lastY) / canvas.height;
    _cropState.lastX = x;
    _cropState.lastY = y;
    _cropState.panX = Math.max(-0.5, Math.min(0.5, _cropState.panX + dx));
    _cropState.panY = Math.max(-0.5, Math.min(0.5, _cropState.panY + dy));
    drawCropPreviewCanvas();
  };
  const endDrag = () => { if (_cropState) _cropState.dragging = false; };

  canvas.addEventListener("mousedown", (e) => startDrag(e.clientX, e.clientY));
  window.addEventListener("mousemove", (e) => moveDrag(e.clientX, e.clientY));
  window.addEventListener("mouseup", endDrag);

  canvas.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
      e.preventDefault();
      startDrag(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: false });
  canvas.addEventListener("touchmove", (e) => {
    if (e.touches.length === 1) {
      e.preventDefault();
      moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: false });
  canvas.addEventListener("touchend", endDrag);
}

function drawCropPreviewCanvas() {
  const canvas = document.getElementById("cropCanvas");
  if (!canvas || !_cropState) return;
  const st = _cropState;
  const rot = ((st.rotation % 360) + 360) % 360;
  const swapped = rot === 90 || rot === 270;
  const srcW = swapped ? st.img.height : st.img.width;
  const srcH = swapped ? st.img.width : st.img.height;

  let cW = 300, cH = 300;
  if (st.aspect === "portrait") { cW = 264; cH = 330; }
  else if (st.aspect === "free") {
    const ratio = srcW / Math.max(1, srcH);
    if (ratio >= 1) { cW = 310; cH = Math.max(180, Math.round(310 / ratio)); }
    else { cH = 320; cW = Math.max(180, Math.round(320 * ratio)); }
  }
  canvas.width = cW;
  canvas.height = cH;

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#19151b";
  ctx.fillRect(0, 0, cW, cH);

  ctx.save();
  ctx.translate(cW / 2 + st.panX * cW, cH / 2 + st.panY * cH);
  ctx.rotate((rot * Math.PI) / 180);
  ctx.scale(st.flipH ? -st.zoom : st.zoom, st.zoom);

  const scaleCover = Math.max(cW / Math.max(1, srcW), cH / Math.max(1, srcH));
  const drawW = st.img.width * scaleCover;
  const drawH = st.img.height * scaleCover;
  ctx.drawImage(st.img, -drawW / 2, -drawH / 2, drawW, drawH);
  ctx.restore();

  // Rule-of-thirds crop guide lines
  ctx.strokeStyle = "rgba(255,255,255,0.38)";
  ctx.lineWidth = 1;
  for (let i = 1; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo((cW * i) / 3, 0);
    ctx.lineTo((cW * i) / 3, cH);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, (cH * i) / 3);
    ctx.lineTo(cW, (cH * i) / 3);
    ctx.stroke();
  }
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, cW - 2, cH - 2);
}

window.cropRotateAction = function(act) {
  if (!_cropState) return;
  if (act === "rotL") _cropState.rotation = (_cropState.rotation - 90) % 360;
  if (act === "rotR") _cropState.rotation = (_cropState.rotation + 90) % 360;
  if (act === "flip") _cropState.flipH = !_cropState.flipH;
  if (act === "reset") {
    _cropState.rotation = 0;
    _cropState.flipH = false;
    _cropState.zoom = 1;
    _cropState.panX = 0;
    _cropState.panY = 0;
  }
  drawCropPreviewCanvas();
};

window.cropSetAspect = function(asp) {
  if (!_cropState) return;
  _cropState.aspect = asp;
  ["square", "portrait", "free"].forEach((k) => {
    const b = document.getElementById("aspBtn_" + k);
    if (b) b.className = `btn btn-sm ${k === asp ? "btn-primary" : "btn-soft"}`;
  });
  drawCropPreviewCanvas();
};

window.cropSetZoom = function(val) {
  if (!_cropState) return;
  _cropState.zoom = Math.max(1, Math.min(3, Number(val) / 100));
  const lbl = document.getElementById("cropZoomLbl");
  if (lbl) lbl.textContent = `${Math.round(_cropState.zoom * 100)}%`;
  drawCropPreviewCanvas();
};

window.cancelCropRotateModal = function() {
  const prev = _cropState?.prevModalHtml || "";
  _cropState = null;
  const modalRoot = document.getElementById("modalRoot");
  if (modalRoot) modalRoot.innerHTML = prev;
};

window.applyCropRotateModal = function() {
  if (!_cropState) return;
  const st = _cropState;
  const rot = ((st.rotation % 360) + 360) % 360;
  const swapped = rot === 90 || rot === 270;
  const srcW = swapped ? st.img.height : st.img.width;
  const srcH = swapped ? st.img.width : st.img.height;

  let outW = 720, outH = 720;
  if (st.aspect === "portrait") { outW = 720; outH = 900; }
  else if (st.aspect === "free") {
    const ratio = srcW / Math.max(1, srcH);
    if (ratio >= 1) { outW = 840; outH = Math.max(320, Math.round(840 / ratio)); }
    else { outH = 840; outW = Math.max(320, Math.round(840 * ratio)); }
  }

  const outCanvas = document.createElement("canvas");
  outCanvas.width = outW;
  outCanvas.height = outH;
  const ctx = outCanvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, outW, outH);

  ctx.save();
  ctx.translate(outW / 2 + st.panX * outW, outH / 2 + st.panY * outH);
  ctx.rotate((rot * Math.PI) / 180);
  ctx.scale(st.flipH ? -st.zoom : st.zoom, st.zoom);

  const scaleCover = Math.max(outW / Math.max(1, srcW), outH / Math.max(1, srcH));
  const drawW = st.img.width * scaleCover;
  const drawH = st.img.height * scaleCover;
  ctx.drawImage(st.img, -drawW / 2, -drawH / 2, drawW, drawH);
  ctx.restore();

  const finalDataUrl = outCanvas.toDataURL("image/jpeg", 0.84);
  const cb = st.onSave;
  const prev = st.prevModalHtml || "";
  _cropState = null;
  const modalRoot = document.getElementById("modalRoot");
  if (modalRoot) modalRoot.innerHTML = prev;
  if (typeof cb === "function") cb(finalDataUrl);
};

function triggerDownload(filename, content, mime = "text/plain;charset=utf-8") {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

window.restoreBackupFromJson = function(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      const src = parsed.db || parsed;
      if (!src || typeof src !== "object") throw new Error("Invalid backup file");
      if (Array.isArray(src.products)) db.products = src.products;
      if (Array.isArray(src.sales)) db.sales = src.sales;
      if (Array.isArray(src.expenses)) db.expenses = src.expenses;
      if (Array.isArray(src.customers)) db.customers = src.customers;
      if (Array.isArray(src.settlements)) db.settlements = src.settlements;
      if (src.settings) {
        db.settings = { ...DEFAULT_SETTINGS, ...src.settings, sisters: FIXED_SISTERS };
      }
      if (parsed.images && typeof parsed.images === "object") {
        for (const [k, v] of Object.entries(parsed.images)) {
          const dataUrl = typeof v === "string" ? v : v?.data;
          const at = (typeof v === "object" && v?.at) ? v.at : Date.now();
          if (dataUrl) await putLocalImage(k, dataUrl, at, false);
        }
      }
      saveLocalDb();
      renderApp();
      showToast("Backup restored ✨");
    } catch (e) {
      showToast("Could not restore backup");
    }
  };
  reader.readAsText(file);
};

window.exportCsv = function(kind) {
  const csvEsc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  let rows = [];
  if (kind === "sales") {
    rows.push(["Date", "Product", "Qty", "Unit Price", "Discount", "Total", "Paid", "Customer", "Phone", "Channel", "Status", "Sold By"]);
    db.sales.forEach((s) => {
      const total = (Number(s.qty) || 1) * (Number(s.unitPrice) || 0) - (Number(s.discount) || 0);
      rows.push([s.date, s.productName, s.qty, s.unitPrice, s.discount || 0, total, s.paidAmount || 0, s.customer, s.phone, s.channel, s.status, s.soldBy]);
    });
  } else if (kind === "stock") {
    rows.push(["Code", "Name", "Category", "Sizes", "Colours", "Cost", "Selling Price", "Qty", "Low Alert"]);
    db.products.forEach((p) => {
      rows.push([p.code, p.name, p.category, p.variant, p.color, p.cost, p.price, p.qty, p.low]);
    });
  } else if (kind === "expenses") {
    rows.push(["Date", "Title", "Category", "Type", "Amount", "Paid By", "Notes"]);
    db.expenses.forEach((e) => {
      rows.push([e.date, e.title, e.category, e.type || "expense", e.amount, e.paidBy, e.notes]);
    });
  } else if (kind === "customers") {
    rows.push(["Name", "Phone", "City", "Notes"]);
    db.customers.forEach((c) => {
      rows.push([c.name, c.phone, c.city, c.notes]);
    });
  }
  const csv = rows.map((r) => r.map(csvEsc).join(",")).join("\n");
  triggerDownload(`SISORA-${kind}-${todayIso()}.csv`, csv, "text/csv;charset=utf-8");
  showToast(`Exported ${kind} CSV 📄`);
};

window.handleMultiPhotoSelect = async function(fileList) {
  if (!fileList || !fileList.length) return;
  const curState = readCurrentProductDraftForm();
  const files = Array.from(fileList);
  for (const file of files) {
    const dataUrl = await compressImageFile(file, 960, 0.85);
    const pid = draftPhotos.length === 0 ? window._draftProdBaseId : `${window._draftProdBaseId}_p${uid().slice(-4)}`;
    draftPhotos.push({ id: pid, data: dataUrl });
  }
  renderProductModalDom(curState);
  if (files.length === 1) {
    const lastIdx = draftPhotos.length - 1;
    window.cropDraftPhotoAtIndex(lastIdx);
  } else {
    showToast(`${files.length} photos added · Tap ✂️ on any photo to crop/rotate`);
  }
};

window.cropDraftPhotoAtIndex = function(idx) {
  const ph = draftPhotos[idx];
  if (!ph) return;
  const curState = readCurrentProductDraftForm();
  openCropRotateModal(ph.data, "portrait", (croppedDataUrl) => {
    draftPhotos[idx].data = croppedDataUrl;
    renderProductModalDom(curState);
    showToast("Photo cropped & rotated ✂️");
  }, `✂️ Crop & Rotate Outfit Photo #${idx + 1}`);
};

window.makeDraftPhotoCover = function(idx) {
  if (idx <= 0 || idx >= draftPhotos.length) return;
  const [chosen] = draftPhotos.splice(idx, 1);
  draftPhotos.unshift(chosen);
  renderProductModalDom(readCurrentProductDraftForm());
};

window.removeDraftPhoto = function(idx) {
  draftPhotos.splice(idx, 1);
  renderProductModalDom(readCurrentProductDraftForm());
};

window.saveProductFromModal = async function() {
  const name = (document.getElementById("pName")?.value || "").trim();
  if (!name) return showToast("Please enter an outfit name");
  const now = Date.now();
  const id = window._draftProdBaseId;

  // Ensure first photo uses product ID as key for backward compatibility with cover lookup
  if (draftPhotos.length > 0 && draftPhotos[0].id !== id) {
    draftPhotos[0].id = id;
  }
  const photoIds = draftPhotos.map((x) => x.id);
  for (const ph of draftPhotos) {
    await putLocalImage(ph.id, ph.data, now, false);
  }

  const item = {
    id,
    name,
    code: (document.getElementById("pCode")?.value || "").trim(),
    category: document.getElementById("pCat")?.value || "Kurti",
    variant: (document.getElementById("pVar")?.value || "").trim(),
    color: (document.getElementById("pCol")?.value || "").trim(),
    cost: Number(document.getElementById("pCost")?.value) || 0,
    price: Number(document.getElementById("pPrice")?.value) || 0,
    qty: Number(document.getElementById("pQty")?.value) || 0,
    low: 2,
    owner: document.getElementById("pOwner")?.value || "joint",
    notes: "",
    imgAt: photoIds.length ? now : 0,
    photoIds,
    createdAt: nowIso(),
    updatedAt: nowIso(),
    _u: now
  };

  const idx = db.products.findIndex((x) => x.id === id);
  if (idx >= 0) db.products[idx] = item;
  else db.products.unshift(item);

  saveLocalDb();
  outbox.add(`products/${id}`);
  saveOutbox();
  closeModal();
  renderApp();
  pushOutboxToFirebase();
  showToast("Outfit saved & synced ✨");
};

window.adjustProductQty = function(prodId, delta) {
  const p = db.products.find((x) => x.id === prodId);
  if (!p) return;
  p.qty = Math.max(0, (Number(p.qty) || 0) + delta);
  p._u = Date.now();
  saveLocalDb();
  outbox.add(`products/${p.id}`);
  saveOutbox();
  renderApp();
  pushOutboxToFirebase();
};

// ---- Delete Approval Workflow (Admin Approval or Admin PIN Required) ----
let _pendingDeleteTarget = null;

function executeApprovedDeletion(targetType, targetId) {
  const now = Date.now();
  if (targetType === "product") {
    db.products = db.products.filter((x) => x.id !== targetId);
    db.tombs.push({ c: "products", id: targetId, _u: now });
    outbox.add(`products/${targetId}`);
  } else if (targetType === "sale") {
    db.sales = db.sales.filter((x) => x.id !== targetId);
    db.tombs.push({ c: "sales", id: targetId, _u: now });
    outbox.add(`sales/${targetId}`);
  } else if (targetType === "expense") {
    db.expenses = db.expenses.filter((x) => x.id !== targetId);
    db.tombs.push({ c: "expenses", id: targetId, _u: now });
    outbox.add(`expenses/${targetId}`);
  }
  db.settings.pendingDeletes = (db.settings.pendingDeletes || []).filter(
    (r) => !(r.targetType === targetType && r.targetId === targetId)
  );
  db.settings._u = now;
  outbox.add("settings");
  saveLocalDb();
  saveOutbox();
  closeModal();
  renderApp();
  pushOutboxToFirebase();
}

window.submitDeleteRequestForAdmin = function() {
  if (!_pendingDeleteTarget) return;
  const list = Array.isArray(db.settings.pendingDeletes) ? [...db.settings.pendingDeletes] : [];
  const filtered = list.filter((r) => !(r.targetType === _pendingDeleteTarget.targetType && r.targetId === _pendingDeleteTarget.targetId));
  filtered.unshift(_pendingDeleteTarget);
  db.settings.pendingDeletes = filtered;
  db.settings._u = Date.now();
  _pendingDeleteTarget = null;
  saveLocalDb();
  outbox.add("settings");
  saveOutbox();
  closeModal();
  renderApp();
  pushOutboxToFirebase();
  showToast("Delete request sent for Admin approval 🛡️");
};

window.confirmDeleteWithApproval = function() {
  if (!_pendingDeleteTarget) return;
  const isAdmin = currentAccount && currentAccount.isAdmin;
  if (!isAdmin) {
    const pin = (document.getElementById("delAdminPinInput")?.value || "").trim();
    const expectedAdminPin = String((db.settings.pins && db.settings.pins.admin) || "5603");
    if (pin !== expectedAdminPin) {
      return showToast("Invalid Admin PIN — or tap 'Send Delete Request to Admin'");
    }
  }
  const { targetType, targetId, targetLabel } = _pendingDeleteTarget;
  _pendingDeleteTarget = null;
  executeApprovedDeletion(targetType, targetId);
  showToast(`Deleted: ${targetLabel} ✓`);
};

window.approvePendingDeleteItem = function(reqId) {
  if (!currentAccount || !currentAccount.isAdmin) return showToast("Only Admin can approve delete requests");
  const list = Array.isArray(db.settings.pendingDeletes) ? db.settings.pendingDeletes : [];
  const req = list.find((r) => r.id === reqId);
  if (!req) return;
  executeApprovedDeletion(req.targetType, req.targetId);
  showToast(`Approved deletion: ${req.targetLabel} ✓`);
};

window.rejectPendingDeleteItem = function(reqId) {
  const list = Array.isArray(db.settings.pendingDeletes) ? db.settings.pendingDeletes : [];
  db.settings.pendingDeletes = list.filter((r) => r.id !== reqId);
  db.settings._u = Date.now();
  saveLocalDb();
  outbox.add("settings");
  saveOutbox();
  renderApp();
  pushOutboxToFirebase();
  showToast("Delete request dismissed — item kept 🛡️");
};

window.deleteProductById = function(prodId) {
  const p = db.products.find((x) => x.id === prodId);
  if (!p) return;
  requestDeleteApproval("product", prodId, `${p.name} (${money(p.price)})`);
};

window.executeCustomerShare = async function(prodId, shareId, tempUrl) {
  const p = db.products.find((x) => x.id === prodId);
  if (!p) return;
  const expHours = Number(document.getElementById("shareExpHours")?.value) || 48;
  const now = Date.now();
  const payload = {
    shareId,
    productId: p.id,
    shopName: db.settings.shopName,
    name: p.name,
    code: p.code || "",
    category: p.category || "Kurti",
    price: money(p.price),
    rawPrice: p.price,
    availableSizes: p.variant || "Free Size",
    availableColors: p.color || "As Shown",
    inStock: (Number(p.qty) || 0) > 0,
    qty: Number(p.qty) || 0,
    notes: p.notes || "",
    photoIds: Array.isArray(p.photoIds) && p.photoIds.length ? p.photoIds : [p.id],
    createdAt: now,
    expiresAt: now + expHours * 3600000
  };

  showToast("Publishing temporary link…");
  try {
    await fbPut(`shops/${FIREBASE_CFG.shopId}/data/shares/${shareId}`, payload);
  } catch (e) {}

  const text = document.getElementById("sharePreviewBox")?.innerText || tempUrl;
  closeModal();

  // Try native iOS Web Share API with photos if supported
  if (navigator.share) {
    try {
      const files = [];
      for (const pid of payload.photoIds) {
        const im = imgMap.get(pid);
        if (im && im.data) {
          const res = await fetch(im.data);
          const blob = await res.blob();
          files.push(new File([blob], `${p.name.replace(/\W+/g, "_")}_${pid}.jpg`, { type: "image/jpeg" }));
        }
      }
      if (files.length > 0 && navigator.canShare && navigator.canShare({ files })) {
        await navigator.share({ title: p.name, text, files });
        return;
      }
      await navigator.share({ title: p.name, text, url: tempUrl });
      return;
    } catch (e) {}
  }
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
};

            <select id="sPayMethod">
              ${(db.settings.payMethods || DEFAULT_SETTINGS.payMethods).map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join("")}
              <option value="PENDING">⏳ Pending / Unpaid</option>
            </select>
          </div>
        </div>
        <button class="btn btn-gold" style="width:100%;margin-top:8px;" onclick="saveSaleFromModal()">✓ Complete Sale</button>
      </div>
    </div>
  `;
};
window.getProdPrice = (id) => db.products.find((x) => x.id === id)?.price || "";

window.saveSaleFromModal = function() {
  const prodId = document.getElementById("sProd")?.value;
  const prod = db.products.find((x) => x.id === prodId);
  if (!prod) return showToast("Add a product first");
  const qty = Math.max(1, Number(document.getElementById("sQty")?.value) || 1);
  const price = Number(document.getElementById("sPrice")?.value) || prod.price;
  const total = qty * price;
  const payMethod = document.getElementById("sPayMethod")?.value || "UPI / GPay";
  const now = Date.now();
  const sale = {
    id: uid(),
    productId: prod.id,
    productName: prod.name,
    qty,
    price,
    costAtSale: prod.cost || 0,
    owner: prod.owner || "joint",
    customer: (document.getElementById("sCust")?.value || "").trim(),
    customerId: "",
    seller: document.getElementById("sSeller")?.value || "vaheeda",
    channel: document.getElementById("sChan")?.value || "Instagram",
    date: todayIso(),
    notes: "",
    total,
    status: "ordered",
    courier: "",
    tracking: "",
    address: "",
    pays: payMethod === "PENDING" ? [] : [{ id: uid(), date: todayIso(), amount: total, method: payMethod, note: "" }],
    returns: [],
    createdAt: nowIso(),
    _u: now
  };
  prod.qty = Math.max(0, (Number(prod.qty) || 0) - qty);
  prod._u = now;
  db.sales.unshift(sale);
  saveLocalDb();
  outbox.add(`sales/${sale.id}`);
  outbox.add(`products/${prod.id}`);
  saveOutbox();
  closeModal();
  renderApp();
  pushOutboxToFirebase();
  showToast("Sale recorded 🎉");
};

window.updateSaleStatus = function(saleId, status) {
  const s = db.sales.find((x) => x.id === saleId);
  if (!s) return;
  s.status = status;
  s._u = Date.now();
  saveLocalDb();
  outbox.add(`sales/${s.id}`);
  saveOutbox();
  renderApp();
  pushOutboxToFirebase();
  showToast("Order status updated");
};

window.markSalePaid = function(saleId) {
  const s = db.sales.find((x) => x.id === saleId);
  if (!s) return;
  s.pays = [{ id: uid(), date: todayIso(), amount: s.total, method: "UPI / GPay", note: "" }];
  s._u = Date.now();
  saveLocalDb();
  outbox.add(`sales/${s.id}`);
  saveOutbox();
  renderApp();
  pushOutboxToFirebase();
  showToast("Marked as Paid ✓");
};

window.deleteSaleItem = function(saleId) {
  const s = db.sales.find((x) => x.id === saleId);
  if (!s) return;
  requestDeleteApproval("sale", saleId, `${s.productName} × ${s.qty} (${s.customer || "Walk-in"} · ${money(s.total)})`);
};

window.deleteExpenseItem = function(expId) {
  const e = db.expenses.find((x) => x.id === expId);
  if (!e) return;
  requestDeleteApproval("expense", expId, `${e.title} (${money(e.amount)})`);
};

// ---- Expense / Contribution Modal ----
window.openExpenseModal = function(mode = "expense") {
  const isCap = mode === "capital";
  const modalRoot = document.getElementById("modalRoot");
  modalRoot.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal-sheet">
        <div class="modal-head">
          <h3>${isCap ? "💰 Add Sister Contribution" : "🧾 Add Expense"}</h3>
          <button onclick="closeModal()" style="font-size:20px;">✕</button>
        </div>
        <div class="field">
          <label>Description</label>
          <input id="eTitle" placeholder="${isCap ? 'e.g. Eid Stock Capital Injection' : 'e.g. Courier & Packaging'}">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Amount (₹)</label>
            <input id="eAmt" type="number" inputmode="decimal" placeholder="0">
          </div>
          <div class="field">
            <label>Sister</label>
            <select id="ePaidBy">
              <option value="vaheeda">🌷 Vaheeda</option>
              <option value="balkees">🌸 Balkees</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Category</label>
          <select id="eCat">
            ${isCap
              ? `<option value="Capital Contribution">Capital Contribution</option><option value="Partner Withdrawal">Partner Withdrawal</option>`
              : (db.settings.expCats || DEFAULT_SETTINGS.expCats).map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("")
            }
          </select>
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="saveExpenseFromModal()">💾 Save Entry</button>
      </div>
    </div>
  `;
};

window.saveExpenseFromModal = function() {
  const title = (document.getElementById("eTitle")?.value || "").trim() || "Boutique Entry";
  const amount = Number(document.getElementById("eAmt")?.value) || 0;
  if (amount <= 0) return showToast("Enter a valid amount");
  const now = Date.now();
  const exp = {
    id: uid(),
    title,
    category: document.getElementById("eCat")?.value || "Other",
    amount,
    paidBy: document.getElementById("ePaidBy")?.value || "vaheeda",
    date: todayIso(),
    notes: "",
    createdAt: nowIso(),
    _u: now
  };
  db.expenses.unshift(exp);
  saveLocalDb();
  outbox.add(`expenses/${exp.id}`);
  saveOutbox();
  closeModal();
  renderApp();
  pushOutboxToFirebase();
  showToast("Entry saved ✨");
};

// ---- Boot Application ----
(async function boot() {
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
  const params = new URLSearchParams(window.location.search);
  const catalogueParam = params.get("catalogue");
  if (catalogueParam) {
    await renderCustomerLiveCatalogueMode();
    return;
  }
  const shareItem = params.get("item");
  if (shareItem) {
    await renderCustomerShareMode(shareItem);
    return;
  }
  await loadAllImagesFromIdb();
  renderApp();
  await pullFromFirebase();
  setInterval(() => {
    if (!document.hidden) pullFromFirebase();
  }, 12000);
})();
</script>
