</style>

<script>

const FIXED_ACCOUNTS = [

const DEFAULT_SETTINGS = {

  currency: "INR",
  defaultLow: 2,
  theme: "light",
  accent: "#c85f83",
  compact: false,
  privacy: false,
  showHero: true,
  showStats: true,
  showQuick: true,
  showLow: true,
  categories: ["Kurti", "Kurti Set", "Salwar Suit", "Anarkali", "Lehenga", "Saree", "Abaya / Kaftan", "Dupatta / Stole", "Co-ord Set", "Gown / Party Wear", "Fabric / Unstitched", "Accessories"],
  channels: ["Instagram", "WhatsApp", "Walk-in", "Reference", "Exhibition", "Reseller"],
  payMethods: ["UPI / GPay", "Cash", "Bank transfer", "Card", "Other"],
  expCats: ["Stock Purchase", "Packaging", "Courier / Shipping", "Stitching / Tailor", "Marketing / Ads", "Travel", "Rent / Utilities", "Other"],
  sisters: FIXED_SISTERS,
  _u: 0
};

// ---- Local Storage & IndexedDB Image Cache ----
const LS_DB_KEY = "sisora_ios_db_v3";
const LS_ACCT_KEY = "sisora_ios_acct_v3";
const LS_OUTBOX_KEY = "sisora_ios_outbox_v3";

let db = loadLocalDb();
let currentAccount = loadLocalAccount();
let activeTab = "home";
let syncStatus = "offline"; // "live", "syncing", "offline"
let idToken = "";
let refreshToken = "";
let imgMap = new Map(); // id -> { at, data }
let outbox = new Set(JSON.parse(localStorage.getItem(LS_OUTBOX_KEY) || "[]"));

// Filter states
let stockQuery = "";
let stockCategory = "All";
let salesQuery = "";
let salesFilter = "All";

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function todayIso() {
  return new Date().toISOString().slice(0, 10);
}
function nowIso() {
  return new Date().toISOString();
}
function money(n) {
  const val = Number(n) || 0;
  return "₹" + val.toLocaleString("en-IN", { maximumFractionDigits: 0 });
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function showToast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function loadLocalDb() {
  try {
    const raw = JSON.parse(localStorage.getItem(LS_DB_KEY) || "null");
    if (raw && typeof raw === "object") {
      return {
        products: Array.isArray(raw.products) ? raw.products : [],
        sales: Array.isArray(raw.sales) ? raw.sales : [],
        expenses: Array.isArray(raw.expenses) ? raw.expenses : [],
        customers: Array.isArray(raw.customers) ? raw.customers : [],
        settlements: Array.isArray(raw.settlements) ? raw.settlements : [],
        tombs: Array.isArray(raw.tombs) ? raw.tombs : [],
        settings: { ...DEFAULT_SETTINGS, ...(raw.settings || {}), sisters: FIXED_SISTERS, pins: { ...DEFAULT_SETTINGS.pins, ...((raw.settings && raw.settings.pins) || {}) } }
      };
    }
  } catch (e) {}
  return {
    products: [], sales: [], expenses: [], customers: [], settlements: [], tombs: [],
    settings: { ...DEFAULT_SETTINGS }
  };
}

function saveLocalDb() {
  try {
    localStorage.setItem(LS_DB_KEY, JSON.stringify(db));
  } catch (e) {}
  applyTheme();
}

function saveOutbox() {
  try {
    localStorage.setItem(LS_OUTBOX_KEY, JSON.stringify([...outbox]));
  } catch (e) {}
}

function loadLocalAccount() {
  try {
    const a = JSON.parse(localStorage.getItem(LS_ACCT_KEY) || "null");
    if (a && FIXED_ACCOUNTS.some((x) => x.id === a.id)) return a;
  } catch (e) {}
  return null;
}

function applyTheme() {
  const s = db.settings || DEFAULT_SETTINGS;
  document.documentElement.setAttribute("data-theme", s.theme === "dark" ? "dark" : "light");
  if (s.accent) {
    document.documentElement.style.setProperty("--accent", s.accent);
  }
}

// ---- IndexedDB for Product & Profile Images ----
function openImgDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("sisora_images_idb", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("imgs", { keyPath: "id" });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function loadAllImagesFromIdb() {
  try {
    const idb = await openImgDb();
    return new Promise((resolve) => {
      const tx = idb.transaction("imgs", "readonly");
      const req = tx.objectStore("imgs").getAll();
      req.onsuccess = () => {
        (req.result || []).forEach((row) => {
          if (row && row.id && row.data) imgMap.set(row.id, { at: row.at || 0, data: row.data });
        });
        resolve();
      };
      req.onerror = () => resolve();
    });
  } catch (e) {}
}

async function putLocalImage(id, data, at = Date.now(), fromRemote = false) {
  imgMap.set(id, { at, data });
  try {
    const idb = await openImgDb();
    const tx = idb.transaction("imgs", "readwrite");
    tx.objectStore("imgs").put({ id, at, data });
  } catch (e) {}
  if (!fromRemote) {
    outbox.add("img/" + id);
    saveOutbox();
    pushOutboxToFirebase();
  }
}

async function deleteLocalImage(id) {
  imgMap.delete(id);
  try {
    const idb = await openImgDb();
    const tx = idb.transaction("imgs", "readwrite");
    tx.objectStore("imgs").delete(id);
  } catch (e) {}
}

function compressImageFile(file, maxDim = 920, quality = 0.78) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        const ctx = cv.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---- Firebase REST Client (100% compatible with Android APK CloudSyncClient.kt) ----
async function ensureFirebaseAuth() {
  if (idToken) return idToken;
  const url = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(FIREBASE_CFG.apiKey)}`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email: FIREBASE_CFG.syncEmail,
      password: FIREBASE_CFG.syncPass,
      returnSecureToken: true
    })
  });
  if (!res.ok) throw new Error("Firebase Auth failed");
  const data = await res.json();
  idToken = data.idToken;
  refreshToken = data.refreshToken || "";
  return idToken;
}

async function fbGet(path) {
  const token = await ensureFirebaseAuth();
  const url = `${FIREBASE_CFG.databaseURL}/${path}.json?auth=${encodeURIComponent(token)}`;
  const res = await fetch(url);
  if (res.status === 401) {
    idToken = "";
    const retryToken = await ensureFirebaseAuth();
    const res2 = await fetch(`${FIREBASE_CFG.databaseURL}/${path}.json?auth=${encodeURIComponent(retryToken)}`);
    return res2.ok ? res2.json() : null;
  }
  return res.ok ? res.json() : null;
}

async function fbPut(path, payload) {
  const token = await ensureFirebaseAuth();
  const url = `${FIREBASE_CFG.databaseURL}/${path}.json?auth=${encodeURIComponent(token)}`;
  const res = await fetch(url, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  return res.ok ? res.json() : null;
}

const COLLECTIONS = ["products", "sales", "expenses", "customers", "settlements"];

async function pullFromFirebase() {
  try {
    syncStatus = "syncing";
    updateSyncPill();
    const shopId = FIREBASE_CFG.shopId;
    const [prodObj, salesObj, expObj, custObj, setObj, settingsObj] = await Promise.all([
      fbGet(`shops/${shopId}/data/products`),
      fbGet(`shops/${shopId}/data/sales`),
      fbGet(`shops/${shopId}/data/expenses`),
      fbGet(`shops/${shopId}/data/customers`),
      fbGet(`shops/${shopId}/data/settlements`),
      fbGet(`shops/${shopId}/data/settings`)
    ]);

    const colMap = { products: prodObj, sales: salesObj, expenses: expObj, customers: custObj, settlements: setObj };
    let changed = false;

    for (const col of COLLECTIONS) {
      const remoteCol = colMap[col];
      if (!remoteCol || typeof remoteCol !== "object") continue;
      for (const [id, wrapper] of Object.entries(remoteCol)) {
        if (!wrapper) continue;
        const ru = Number(wrapper._u) || 0;
        const idx = db[col].findIndex((x) => x.id === id);
        const localItem = idx >= 0 ? db[col][idx] : null;
        const tomb = db.tombs.find((t) => t.c === col && t.id === id);
        const lu = localItem ? (Number(localItem._u) || 0) : (tomb ? (Number(tomb._u) || 0) : -1);

        if (ru > lu) {
          db.tombs = db.tombs.filter((t) => !(t.c === col && t.id === id));
          if (wrapper.deleted) {
            if (idx >= 0) db[col].splice(idx, 1);
            db.tombs.push({ c: col, id, _u: ru });
          } else if (wrapper.j) {
            try {
              const parsed = typeof wrapper.j === "string" ? JSON.parse(wrapper.j) : wrapper.j;
              parsed._u = ru;
              if (idx >= 0) db[col][idx] = parsed;
              else db[col].unshift(parsed);
            } catch (e) {}
          }
          outbox.delete(`${col}/${id}`);
          changed = true;
        }
      }
    }

    if (settingsObj && settingsObj.j) {
      const ru = Number(settingsObj._u) || 0;
      const lu = Number(db.settings._u) || 0;
      if (ru > lu) {
        try {
          const remoteSettings = typeof settingsObj.j === "string" ? JSON.parse(settingsObj.j) : settingsObj.j;
          db.settings = {
            ...db.settings,
            ...remoteSettings,
            sisters: FIXED_SISTERS,
            pins: { ...DEFAULT_SETTINGS.pins, ...(db.settings.pins || {}), ...(remoteSettings.pins || {}) },
            profilePhotosAt: { ...(db.settings.profilePhotosAt || {}), ...(remoteSettings.profilePhotosAt || {}) },
            _u: ru
          };
          outbox.delete("settings");
          changed = true;
        } catch (e) {}
      }
    }

    if (changed) {
      saveLocalDb();
      saveOutbox();
      renderApp();
    }

    // Fetch any missing product or profile images
    const neededImgs = new Set();
    for (const p of db.products) {
      const ids = Array.isArray(p.photoIds) && p.photoIds.length ? p.photoIds : (p.imgAt ? [p.id] : []);
      for (const pid of ids) {
        const localIm = imgMap.get(pid);
        if (!localIm || (p.imgAt && localIm.at < p.imgAt)) neededImgs.add(pid);
      }
    }
    const profAt = db.settings.profilePhotosAt || {};
    for (const acc of FIXED_ACCOUNTS) {
      const ts = Number(profAt[acc.id]) || 0;
      const imgId = "profile_" + acc.id;
      const localIm = imgMap.get(imgId);
      if (ts > 0 && (!localIm || localIm.at < ts)) neededImgs.add(imgId);
    }
    if (db.settings.logoAt && (!imgMap.get("logo") || imgMap.get("logo").at < db.settings.logoAt)) {
      neededImgs.add("logo");
    }

    for (const imgId of neededImgs) {
      try {
        const imObj = await fbGet(`shops/${shopId}/data/images/${imgId}`);
        if (imObj && imObj.data) {
          await putLocalImage(imgId, imObj.data, imObj.at || Date.now(), true);
        }
      } catch (e) {}
    }
    if (neededImgs.size > 0) renderApp();

    syncStatus = "live";
    updateSyncPill();
  } catch (e) {
    syncStatus = "offline";
    updateSyncPill();
  }
}

async function pushOutboxToFirebase() {
  if (outbox.size === 0) return;
  try {
    syncStatus = "syncing";
    updateSyncPill();
    const shopId = FIREBASE_CFG.shopId;
    const keys = [...outbox];
    for (const key of keys) {
      if (key === "settings") {
        const u = db.settings._u || Date.now();
        await fbPut(`shops/${shopId}/data/settings`, { _u: u, j: JSON.stringify(db.settings) });
        outbox.delete(key);
      } else if (key.startsWith("img/")) {
        const imgId = key.slice(4);
        const im = imgMap.get(imgId);
        if (im && im.data) {
          await fbPut(`shops/${shopId}/data/images/${imgId}`, { at: im.at || Date.now(), data: im.data });
        }
        outbox.delete(key);
      } else if (key.includes("/")) {
        const [col, id] = key.split("/");
        const item = (db[col] || []).find((x) => x.id === id);
        const tomb = db.tombs.find((t) => t.c === col && t.id === id);
        if (item) {
          await fbPut(`shops/${shopId}/data/${col}/${id}`, { _u: item._u || Date.now(), j: JSON.stringify(item) });
        } else if (tomb) {
          await fbPut(`shops/${shopId}/data/${col}/${id}`, { _u: tomb._u || Date.now(), deleted: true });
        }
        outbox.delete(key);
      }
    }
    saveOutbox();
    syncStatus = "live";
    updateSyncPill();
  } catch (e) {
    syncStatus = "offline";
    updateSyncPill();
  }
}

function updateSyncPill() {
  const el = document.getElementById("syncPill");
  if (!el) return;
  if (syncStatus === "live") {
    el.className = "sync-pill";
    el.textContent = "● Live Sync";
  } else if (syncStatus === "syncing") {
    el.className = "sync-pill syncing";
    el.textContent = "↻ Syncing…";
  } else {
    el.className = "sync-pill offline";
    el.textContent = "○ Offline Ready";
  }
}

let pinEntryAcc = null;
let pinBuffer = "";

window.openPinModal = function(accId) {
  pinEntryAcc = FIXED_ACCOUNTS.find((a) => a.id === accId);
  pinBuffer = "";
  renderPinModal();
};

function renderPinModal() {
  if (!pinEntryAcc) return;
  const modalRoot = document.getElementById("modalRoot");
  const dots = [0, 1, 2, 3].map((i) => `<div class="pin-dot ${pinBuffer.length > i ? 'filled' : ''}"></div>`).join("");
  modalRoot.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal-sheet" style="text-align:center;">
        <div style="margin-bottom:8px;">${getAccountAvatarHtml(pinEntryAcc.id, "xl")}</div>
        <h3 style="margin:6px 0 2px;font-size:19px;">Hi, ${esc(pinEntryAcc.displayName)} ${pinEntryAcc.emoji}</h3>
        <p style="margin:0;color:var(--muted);font-size:13px;">Enter your 4-digit PIN code to unlock</p>
        <div class="pin-dots">${dots}</div>
        <div class="keypad">
          ${[1,2,3,4,5,6,7,8,9].map((n) => `<button class="key-btn" onclick="pressPinDigit('${n}')">${n}</button>`).join("")}
          <button class="key-btn" style="font-size:13px;color:var(--muted);" onclick="closeModal()">Cancel</button>
          <button class="key-btn" onclick="pressPinDigit('0')">0</button>
          <button class="key-btn" onclick="pressPinBack()">⌫</button>
        </div>
      </div>
    </div>
  `;
}

window.pressPinDigit = function(d) {
  if (pinBuffer.length >= 6) return;
  pinBuffer += d;
  renderPinModal();
  const expected = String((db.settings.pins && db.settings.pins[pinEntryAcc.id]) || pinEntryAcc.defaultPin);
  if (pinBuffer === expected) {
    currentAccount = pinEntryAcc;
    localStorage.setItem(LS_ACCT_KEY, JSON.stringify(currentAccount));
    closeModal();
    showToast(`Welcome, ${currentAccount.displayName}! ${currentAccount.emoji}`);
    renderApp();
    pullFromFirebase();
  } else if (pinBuffer.length >= expected.length) {
    setTimeout(() => {
      showToast("Incorrect PIN for " + pinEntryAcc.displayName);
      pinBuffer = "";
      renderPinModal();
    }, 180);
  }
};

window.pressPinBack = function() {
  pinBuffer = pinBuffer.slice(0, -1);
  renderPinModal();
};

window.closeModal = function() {
  document.getElementById("modalRoot").innerHTML = "";
};

window.signOutAccount = function() {
  currentAccount = null;
  localStorage.removeItem(LS_ACCT_KEY);
  showToast("Locked 🔒");
  renderApp();
};

function computeTotals() {
  let revenue = 0, cogs = 0, received = 0, due = 0;
  for (const s of db.sales) {
    const retRefund = (s.returns || []).reduce((a, r) => a + (Number(r.refund) || 0), 0);
    const retRestock = (s.returns || []).reduce((a, r) => a + (Number(r.restock) || 0), 0);
    const netTot = Math.max(0, (Number(s.total) || 0) - retRefund);
    const paid = (s.pays || []).reduce((a, p) => a + (Number(p.amount) || 0), 0);
    revenue += netTot;
    cogs += (Number(s.costAtSale) || 0) * Math.max(0, (Number(s.qty) || 1) - retRestock);
    received += paid;
    due += Math.max(0, netTot - paid);
  }
  const expenses = db.expenses
    .filter((e) => e.category !== "Capital Contribution" && e.category !== "Partner Withdrawal")
    .reduce((a, e) => a + (Number(e.amount) || 0), 0);
  const stockUnits = db.products.reduce((a, p) => a + Math.max(0, Number(p.qty) || 0), 0);
  const stockCost = db.products.reduce((a, p) => a + Math.max(0, Number(p.qty) || 0) * (Number(p.cost) || 0), 0);
  const stockRetail = db.products.reduce((a, p) => a + Math.max(0, Number(p.qty) || 0) * (Number(p.price) || 0), 0);
  const netProfit = revenue - cogs - expenses;
  return { revenue, cogs, received, due, expenses, stockUnits, stockCost, stockRetail, netProfit };
}

// ---- Reports & Diagrams Page (8 Visual Diagrams) ----
function renderReportsTab() {
  const t = computeTotals();
  const palette = ["#c85f83", "#b8860b", "#237a57", "#5b4b8a", "#d96b27", "#2b7a9b"];

  // 1. Sister Contributions (Vaheeda vs Balkees)
  function sisterStats(sisId) {
    const capIn = db.expenses.filter((e) => e.paidBy === sisId && e.category === "Capital Contribution").reduce((a, e) => a + (Number(e.amount) || 0), 0);
    const expPaid = db.expenses.filter((e) => e.paidBy === sisId && e.category !== "Capital Contribution" && e.category !== "Partner Withdrawal").reduce((a, e) => a + (Number(e.amount) || 0), 0);
    const withdrawn = db.expenses.filter((e) => e.paidBy === sisId && e.category === "Partner Withdrawal").reduce((a, e) => a + (Number(e.amount) || 0), 0);
    const salesBy = db.sales.filter((s) => s.seller === sisId).reduce((a, s) => a + (Number(s.total) || 0), 0);
    const stockOwned = db.products.filter((p) => p.owner === sisId).reduce((a, p) => a + (Number(p.cost) || 0) * Math.max(0, Number(p.qty) || 0), 0);
    const netContrib = capIn + expPaid + stockOwned - withdrawn;
    return { capIn, expPaid, withdrawn, salesBy, stockOwned, netContrib };
  }
  const vah = sisterStats("vaheeda");
  const bal = sisterStats("balkees");
  const totContrib = Math.max(1, vah.netContrib + bal.netContrib);
  const vahPct = Math.round((vah.netContrib / totContrib) * 100);

  // 2. Sales by Source / Channel
  const chanMap = {};
  db.sales.forEach((s) => { const ch = s.channel || "Instagram"; chanMap[ch] = (chanMap[ch] || 0) + (Number(s.total) || 0); });
  const chanEntries = Object.entries(chanMap).sort((a, b) => b[1] - a[1]);

  // 3. Payment Modes
  const payMap = {};
  db.sales.forEach((s) => {
    const paid = (s.pays || []).reduce((a, p) => {
      const m = p.method || "UPI / GPay";
      payMap[m] = (payMap[m] || 0) + (Number(p.amount) || 0);
      return a + (Number(p.amount) || 0);
    }, 0);
    const due = Math.max(0, (Number(s.total) || 0) - paid);
    if (due > 0) payMap["Pending Due"] = (payMap["Pending Due"] || 0) + due;
  });
  const payEntries = Object.entries(payMap).sort((a, b) => b[1] - a[1]);

  // 4. Expenses by Category
  const expMap = {};
  db.expenses.forEach((e) => { const c = e.category || "Other"; expMap[c] = (expMap[c] || 0) + (Number(e.amount) || 0); });
  const expEntries = Object.entries(expMap).sort((a, b) => b[1] - a[1]);

  // 5. Stock Value by Dress Category
  const catStockMap = {};
  db.products.forEach((p) => { const c = p.category || "Kurti"; catStockMap[c] = (catStockMap[c] || 0) + Math.max(0, Number(p.qty) || 0) * (Number(p.price) || 0); });
  const catStockEntries = Object.entries(catStockMap).sort((a, b) => b[1] - a[1]);

  // Helper for Donut HTML
  function buildDonutHtml(entries, centerLabel) {
    const total = entries.reduce((a, x) => a + x[1], 0);
    if (total <= 0) return `<p style="color:var(--muted);font-size:13px;margin:0;">No data recorded yet.</p>`;
    let accDeg = 0;
    const stops = entries.map(([k, v], i) => {
      const deg = (v / total) * 360;
      const start = accDeg;
      accDeg += deg;
      return `${palette[i % palette.length]} ${start.toFixed(1)}deg ${accDeg.toFixed(1)}deg`;
    }).join(", ");
    return `
      <div class="donut-wrap">
        <div class="donut-ring" style="background:conic-gradient(${stops});">
          <div class="donut-hole">
            <span style="color:var(--muted);font-size:9.5px;">${esc(centerLabel)}</span>
            <span>${money(total)}</span>
          </div>
        </div>
        <div class="legend-list">
          ${entries.map(([k, v], i) => `
            <div class="legend-item">
              <span><span class="legend-dot" style="background:${palette[i % palette.length]}"></span>${esc(k)}</span>
              <b>${money(v)} (${Math.round((v / total) * 100)}%)</b>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  return `
    <div class="card">
      <h3 style="margin:0 0 10px;">👭 Vaheeda vs Balkees Contributions & Sales</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
        <div class="kpi-box">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            ${getAccountAvatarHtml("vaheeda")}
            <b>Vaheeda</b>
          </div>
          <div style="font-size:12px;color:var(--muted);">Net Contribution: <b>${money(vah.netContrib)}</b></div>
          <div style="font-size:12px;color:var(--muted);">Expenses Paid: <b>${money(vah.expPaid)}</b></div>
          <div style="font-size:12px;color:var(--muted);">Sales Closed: <b>${money(vah.salesBy)}</b></div>
        </div>
        <div class="kpi-box">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            ${getAccountAvatarHtml("balkees")}
            <b>Balkees</b>
          </div>
          <div style="font-size:12px;color:var(--muted);">Net Contribution: <b>${money(bal.netContrib)}</b></div>
          <div style="font-size:12px;color:var(--muted);">Expenses Paid: <b>${money(bal.expPaid)}</b></div>
          <div style="font-size:12px;color:var(--muted);">Sales Closed: <b>${money(bal.salesBy)}</b></div>
        </div>
      </div>
      <div style="height:12px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;">
        <div style="width:${vahPct}%;background:#c85f83;"></div>
        <div style="width:${100 - vahPct}%;background:#b8860b;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px;">
        <span>Vaheeda (${vahPct}%)</span>
        <span>Balkees (${100 - vahPct}%)</span>
      </div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px;">📱 Sales by Source / Channel</h3>
      ${buildDonutHtml(chanEntries, "SALES")}
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px;">💳 Payment Modes Breakdown</h3>
      ${buildDonutHtml(payEntries, "PAYMENTS")}
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px;">🧾 Expenses Breakdown by Category</h3>
      ${buildDonutHtml(expEntries, "EXPENSES")}
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px;">👗 Inventory Value by Dress Category</h3>
      ${catStockEntries.length === 0 ? `<p style="color:var(--muted);margin:0;">No stock items yet.</p>` : catStockEntries.map(([cat, val], i) => {
        const maxVal = Math.max(1, catStockEntries[0][1]);
        const pct = Math.round((val / maxVal) * 100);
        return `
          <div style="margin-bottom:9px;">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;">
              <span><b>${esc(cat)}</b></span>
              <span>${money(val)}</span>
            </div>
            <div style="height:8px;border-radius:99px;background:var(--line);overflow:hidden;">
              <div style="width:${pct}%;height:100%;background:${palette[i % palette.length]};"></div>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

window.saveProductFromModal = async function() {
  const name = (document.getElementById("pName")?.value || "").trim();
  if (!name) return showToast("Please enter an outfit name");
  const now = Date.now();
  const id = window._draftProdBaseId;

  // Ensure first photo uses product ID as key for backward compatibility with cover lookup
  if (draftPhotos.length > 0 && draftPhotos[0].id !== id) {
    draftPhotos[0].id = id;
  }
  const photoIds = draftPhotos.map((x) => x.id);
  for (const ph of draftPhotos) {
    await putLocalImage(ph.id, ph.data, now, false);
  }

  const item = {
    id,
    name,
    code: (document.getElementById("pCode")?.value || "").trim(),
    category: document.getElementById("pCat")?.value || "Kurti",
    variant: (document.getElementById("pVar")?.value || "").trim(),
    color: (document.getElementById("pCol")?.value || "").trim(),
    cost: Number(document.getElementById("pCost")?.value) || 0,
    price: Number(document.getElementById("pPrice")?.value) || 0,
    qty: Number(document.getElementById("pQty")?.value) || 0,
    low: 2,
    owner: document.getElementById("pOwner")?.value || "joint",
    notes: "",
    imgAt: photoIds.length ? now : 0,
    photoIds,
    createdAt: nowIso(),
    updatedAt: nowIso(),
    _u: now
  };

  const idx = db.products.findIndex((x) => x.id === id);
  if (idx >= 0) db.products[idx] = item;
  else db.products.unshift(item);

  saveLocalDb();
  outbox.add(`products/${id}`);
  saveOutbox();
  closeModal();
  renderApp();
  pushOutboxToFirebase();
  showToast("Outfit saved & synced ✨");
};

window.adjustProductQty = function(prodId, delta) {
  const p = db.products.find((x) => x.id === prodId);

  p.qty = Math.max(0, (Number(p.qty) || 0) + delta);
  p._u = Date.now();

};

window.executeCustomerShare = async function(prodId, shareId, tempUrl) {
  const p = db.products.find((x) => x.id === prodId);
  if (!p) return;
  const expHours = Number(document.getElementById("shareExpHours")?.value) || 48;
  const now = Date.now();
  const payload = {
    shareId,
    productId: p.id,
    shopName: db.settings.shopName,
    name: p.name,
    code: p.code || "",
    category: p.category || "Kurti",
    price: money(p.price),
    rawPrice: p.price,
    availableSizes: p.variant || "Free Size",
    availableColors: p.color || "As Shown",
    inStock: (Number(p.qty) || 0) > 0,
    qty: Number(p.qty) || 0,
    notes: p.notes || "",
    photoIds: Array.isArray(p.photoIds) && p.photoIds.length ? p.photoIds : [p.id],
    createdAt: now,
    expiresAt: now + expHours * 3600000
  };

  showToast("Publishing temporary link…");
  try {
    await fbPut(`shops/${FIREBASE_CFG.shopId}/data/shares/${shareId}`, payload);
  } catch (e) {}

  const text = document.getElementById("sharePreviewBox")?.innerText || tempUrl;
  closeModal();

  // Try native iOS Web Share API with photos if supported
  if (navigator.share) {
    try {
      const files = [];
      for (const pid of payload.photoIds) {
        const im = imgMap.get(pid);
        if (im && im.data) {
          const res = await fetch(im.data);
          const blob = await res.blob();
          files.push(new File([blob], `${p.name.replace(/\W+/g, "_")}_${pid}.jpg`, { type: "image/jpeg" }));
        }
      }
      if (files.length > 0 && navigator.canShare && navigator.canShare({ files })) {
        await navigator.share({ title: p.name, text, files });
        return;
      }
      await navigator.share({ title: p.name, text, url: tempUrl });
      return;
    } catch (e) {}
  }
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
};

    costAtSale: prod.cost || 0,
    owner: prod.owner || "joint",
    customer: (document.getElementById("sCust")?.value || "").trim(),
    customerId: "",
    seller: document.getElementById("sSeller")?.value || "vaheeda",
    channel: document.getElementById("sChan")?.value || "Instagram",
    date: todayIso(),
    notes: "",
    total,
    status: "ordered",
    courier: "",
    tracking: "",
    address: "",
    pays: payMethod === "PENDING" ? [] : [{ id: uid(), date: todayIso(), amount: total, method: payMethod, note: "" }],
    returns: [],
    createdAt: nowIso(),
    _u: now
  };
  prod.qty = Math.max(0, (Number(prod.qty) || 0) - qty);
  prod._u = now;
  db.sales.unshift(sale);
  saveLocalDb();
  outbox.add(`sales/${sale.id}`);
  outbox.add(`products/${prod.id}`);
  saveOutbox();
  closeModal();
  renderApp();
  pushOutboxToFirebase();
  showToast("Sale recorded 🎉");
};

window.updateSaleStatus = function(saleId, status) {
  const s = db.sales.find((x) => x.id === saleId);
  if (!s) return;
  s.status = status;
  s._u = Date.now();
  saveLocalDb();
  outbox.add(`sales/${s.id}`);
  saveOutbox();
  renderApp();
  pushOutboxToFirebase();
  showToast("Order status updated");
};

window.markSalePaid = function(saleId) {
  const s = db.sales.find((x) => x.id === saleId);
  if (!s) return;
  s.pays = [{ id: uid(), date: todayIso(), amount: s.total, method: "UPI / GPay", note: "" }];
  s._u = Date.now();
  saveLocalDb();
  outbox.add(`sales/${s.id}`);
  saveOutbox();
  renderApp();
  pushOutboxToFirebase();
  showToast("Marked as Paid ✓");
};

window.deleteSaleItem = function(saleId) {
  db.sales = db.sales.filter((x) => x.id !== saleId);
  db.tombs.push({ c: "sales", id: saleId, _u: Date.now() });
  saveLocalDb();
  outbox.add(`sales/${saleId}`);
  saveOutbox();
  renderApp();
  pushOutboxToFirebase();
  showToast("Sale deleted");
};

// ---- Expense / Contribution Modal ----
window.openExpenseModal = function(mode = "expense") {
  const isCap = mode === "capital";
  const modalRoot = document.getElementById("modalRoot");
  modalRoot.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal-sheet">
        <div class="modal-head">
          <h3>${isCap ? "💰 Add Sister Contribution" : "🧾 Add Expense"}</h3>
          <button onclick="closeModal()" style="font-size:20px;">✕</button>
        </div>
        <div class="field">
          <label>Description</label>
          <input id="eTitle" placeholder="${isCap ? 'e.g. Eid Stock Capital Injection' : 'e.g. Courier & Packaging'}">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Amount (₹)</label>
            <input id="eAmt" type="number" inputmode="decimal" placeholder="0">
          </div>
          <div class="field">
            <label>Sister</label>
            <select id="ePaidBy">
              <option value="vaheeda">🌷 Vaheeda</option>
              <option value="balkees">🌸 Balkees</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Category</label>
          <select id="eCat">
            ${isCap
              ? `<option value="Capital Contribution">Capital Contribution</option><option value="Partner Withdrawal">Partner Withdrawal</option>`
              : (db.settings.expCats || DEFAULT_SETTINGS.expCats).map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("")
            }
          </select>
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="saveExpenseFromModal()">💾 Save Entry</button>
      </div>
    </div>
  `;
};

window.saveExpenseFromModal = function() {
  const title = (document.getElementById("eTitle")?.value || "").trim() || "Boutique Entry";
  const amount = Number(document.getElementById("eAmt")?.value) || 0;
  if (amount <= 0) return showToast("Enter a valid amount");
  const now = Date.now();
  const exp = {
    id: uid(),
    title,
    category: document.getElementById("eCat")?.value || "Other",
    amount,
    paidBy: document.getElementById("ePaidBy")?.value || "vaheeda",
    date: todayIso(),
    notes: "",
    createdAt: nowIso(),
    _u: now
  };
  db.expenses.unshift(exp);
  saveLocalDb();
  outbox.add(`expenses/${exp.id}`);
  saveOutbox();
  closeModal();
  renderApp();
  pushOutboxToFirebase();
  showToast("Entry saved ✨");
};

// ---- Boot Application ----
(async function boot() {
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
  const params = new URLSearchParams(window.location.search);
  const shareItem = params.get("item");
  if (shareItem) {
    await renderCustomerShareMode(shareItem);
    return;
  }
  await loadAllImagesFromIdb();
  renderApp();
  await pullFromFirebase();
  setInterval(() => {
    if (!document.hidden) pullFromFirebase();
  }, 12000);
})();
</script>
</body>
</html>
